<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro-Balanced Volley AI</title>
    <style>
        :root { --p1: #ff4757; --ai: #2f3542; --gold: #f1c40f; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #game-container { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: linear-gradient(to bottom, #1e3799, #4a69bd); overflow: hidden; border: 4px solid #222; }
        canvas { width: 100%; height: 100%; display: block; }
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 50px; z-index: 10; pointer-events: none; }
        .score { background: rgba(0,0,0,0.8); color: white; padding: 10px 25px; border-radius: 15px; border: 2px solid var(--gold); font-weight: bold; font-size: 1.4rem; min-width: 120px; text-align: center; }
        #timer { color: var(--gold); font-size: 2rem; font-weight: 900; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        .btn-start { padding: 15px 60px; background: var(--gold); border: none; border-radius: 50px; font-size: 2rem; cursor: pointer; font-weight: bold; box-shadow: 0 6px #b8950c; }
        #touch-ui { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; z-index: 20; }
        .ctrl-btn { width: 75px; height: 75px; background: rgba(255,255,255,0.2); border: 3px solid #fff; border-radius: 50%; color: white; font-size: 30px; display: flex; justify-content: center; align-items: center; }
        .jump-btn { width: 100px; height: 100px; background: rgba(255, 165, 0, 0.4); border-radius: 25px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay">
        <h1 style="font-size: 3rem; margin-bottom: 30px;">PRO VOLLEY</h1>
        <button class="btn-start" onclick="begin()">PLAY</button>
    </div>
    <div id="hud">
        <div class="score">AI: <span id="c-s">0</span></div>
        <div id="timer">02:00</div>
        <div class="score">YOU: <span id="u-s">0</span></div>
    </div>
    <canvas id="stage"></canvas>
    <div id="touch-ui">
        <div style="display: flex; gap: 20px;">
            <div class="ctrl-btn" id="l-btn">←</div>
            <div class="ctrl-btn" id="r-btn">→</div>
        </div>
        <div class="ctrl-btn jump-btn" id="j-btn">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

let W, H, G_Y, NET;
let state = { scores: { p: 0, c: 0 }, time: 120, running: false, lastWinner: null };
let input = { l: false, r: false, j: false };

function begin() {
    if (container.requestFullscreen) container.requestFullscreen();
    document.getElementById('overlay').style.display = 'none';
    state.running = true;
    syncDimensions();
    requestAnimationFrame(engine);
}

function syncDimensions() {
    W = canvas.width = container.clientWidth;
    H = canvas.height = container.clientHeight;
    G_Y = H - 40;
    NET = { x: W/2, y: H - 150, w: 12, h: 110 };
    p1.reset(); cpu.reset(); ball.spawn();
}

class Player {
    constructor(side, color) { this.side = side; this.color = color; this.r = 35; }
    reset() {
        this.x = this.side === 'left' ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.r;
        this.dx = 0; this.dy = 0; this.air = false;
    }
    render() {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.beginPath();
        ctx.arc(this.x + (this.side === 'right' ? -15 : 15), this.y - 12, 10, 0, Math.PI*2); ctx.fill();
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if (this.y < G_Y - this.r) this.dy += 0.85;
        else { this.y = G_Y - this.r; this.dy = 0; this.air = false; }
        
        // Edge Locking
        if (this.x < this.r) this.x = this.r;
        if (this.x > W - this.r) this.x = W - this.r;
        // Net Locking
        const margin = this.r + NET.w/2;
        if (this.side === 'right' && this.x < NET.x + margin) this.x = NET.x + margin;
        if (this.side === 'left' && this.x > NET.x - margin) this.x = NET.x - margin;
    }
}

const ball = {
    r: 16,
    spawn() {
        this.y = H * 0.2; this.dy = 0; this.dx = 0;
        this.x = !state.lastWinner ? W/2 : (state.lastWinner === 'p' ? W*0.8 : W*0.2);
    },
    render() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = "#fff200"; ctx.fill(); ctx.stroke();
    },
    update() {
        this.dy += 0.45; this.x += this.dx; this.y += this.dy;
        if (this.y < this.r) { this.y = this.r; this.dy = Math.abs(this.dy) * 0.5; }
        if (this.y > G_Y - this.r) { this.y = G_Y - this.r; this.dy *= -0.7; this.dx *= 0.98; }

        // Net Collision
        if (this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx *= -1.2; this.x = (this.x < NET.x) ? NET.x - 25 : NET.x + 25;
        }

        // Out of Bounds Point
        if (this.x < -this.r || this.x > W + this.r) {
            if (this.x > W) { state.scores.c++; state.lastWinner = 'c'; }
            else { state.scores.p++; state.lastWinner = 'p'; }
            this.spawn(); p1.reset(); cpu.reset();
        }
    }
};

const p1 = new Player('right', '#ff4757');
const cpu = new Player('left', '#2c3e50');

const bind = (id, k) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { e.preventDefault(); input[k] = true; };
    el.ontouchend = (e) => { e.preventDefault(); input[k] = false; };
};
bind('l-btn', 'l'); bind('r-btn', 'r'); bind('j-btn', 'j');

function engine() {
    if (!state.running) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, G_Y, W, 40);
    ctx.fillStyle = "white"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = 0;
    if (input.l) p1.dx = -8; if (input.r) p1.dx = 8;
    if (input.j && !p1.air) { p1.dy = -17; p1.air = true; }

    // --- PRO AI SHUFFLE & ANGLE LOGIC ---
    let aiTarget;
    if (ball.x < NET.x) {
        // Attack Mode: Get slightly behind ball to drive it forward
        aiTarget = ball.x - 15;
    } else {
        // Defend Mode: Stay in center of AI territory
        aiTarget = W * 0.2;
    }
    cpu.dx = (cpu.x < aiTarget - 5) ? 7 : (cpu.x > aiTarget + 5) ? -7 : 0;
    if (ball.x < NET.x && Math.abs(ball.x - cpu.x) < 40 && !cpu.air && ball.y < G_Y - 50) {
        if (Math.random() > 0.4) { cpu.dy = -15; cpu.air = true; }
    }

    [p1, cpu].forEach(p => {
        p.update();
        let dist = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (dist < p.r + ball.r) {
            // Impact Physics
            let impact = (ball.x - p.x) / p.r; 
            let randomAngle = (Math.random() - 0.5) * 2; // Extra variance
            
            // --- IN-PLAY CONSTRAINT ---
            // Calculate how far the ball is from the center. 
            // If hitting from the back, we dampen horizontal speed.
            let powerFactor = (p.side === 'right' && p.x > W * 0.8) || (p.side === 'left' && p.x < W * 0.2) ? 0.7 : 1.2;
            
            ball.dx = (impact * 10 + p.dx * 0.5 + randomAngle) * powerFactor;
            ball.dy = -12 - Math.abs(impact * 3);

            // Safety Direction Check
            if (p.side === 'left' && ball.dx < 2) ball.dx = 5;
            if (p.side === 'right' && ball.dx > -2) ball.dx = -5;
        }
    });

    ball.update();
    p1.render(); cpu.render(); ball.render();
    document.getElementById('u-s').innerText = state.scores.p;
    document.getElementById('c-s').innerText = state.scores.c;
    requestAnimationFrame(engine);
}

setInterval(() => {
    if (!state.running) return;
    if (state.time > 0) {
        state.time--;
        let m = Math.floor(state.time/60), s = state.time%60;
        document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
    }
}, 1000);

window.addEventListener('resize', syncDimensions);
</script>
</body>
</html>
