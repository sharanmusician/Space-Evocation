<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High-Speed Pro | Steering Lock</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --danger: #ff3366;
            --road: #1a1a1c;
        }

        body { 
            margin: 0; background: #000; 
            height: 100vh; width: 100vw; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none; 
        }

        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: var(--road);
            display: flex; flex-direction: column;
            border: 1px solid #222;
        }

        #game-view { flex: 1; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        #dashboard {
            height: 32%;
            background: linear-gradient(180deg, #1c1c21 0%, #050505 100%);
            border-top: 4px solid #333;
            padding: 15px;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .dash-top { display: flex; justify-content: space-between; align-items: center; }
        .hud-digital { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 11px; }
        
        .speedo-hub { text-align: center; font-family: 'Orbitron', sans-serif; }
        .speed-digit { font-size: 42px; color: #fff; text-shadow: 0 0 15px var(--neon); line-height: 1; }

        .dash-bottom { display: flex; justify-content: space-between; align-items: flex-end; }

        /* Steering Wheel */
        #steering-wheel {
            width: 100px; height: 100px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 10px solid #1a1a1c;
            background: radial-gradient(circle, #2a2a2e 0%, #111 80%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 10px #000;
            will-change: transform;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 8px; background: #1a1a1c; transform: translateY(-50%); border-radius: 4px; }
        .top-marker { position: absolute; top: -10px; left: 50%; width: 8px; height: 10px; background: var(--danger); transform: translateX(-50%); border-radius: 1px; }
        
        .ac-vent { width: 38px; height: 16px; background: #0a0a0b; border: 1px solid #2a2a2a; border-radius: 2px;
                   background-image: linear-gradient(0deg, #1a1a1a 50%, transparent 50%); background-size: 100% 4px; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view"><canvas id="gameCanvas"></canvas></div>

        <div id="dashboard">
            <div class="dash-top">
                <div class="hud-digital">
                    FUEL
                    <div style="width: 60px; height: 4px; background: #000; margin-top: 4px; border: 1px solid #333;">
                        <div id="fuel-gauge" style="width: 100%; height: 100%; background: #00ff66;"></div>
                    </div>
                </div>
                <div class="speedo-hub">
                    <div id="kmh" class="speed-digit">00</div>
                    <div style="font-size: 8px; letter-spacing: 3px; color: #444;">KM/H</div>
                </div>
            </div>

            <div class="dash-bottom">
                <div style="display: flex; gap: 10px;"><div class="ac-vent"></div><div class="ac-vent"></div></div>
                <div id="steering-wheel">
                    <div class="top-marker"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const kmhDisp = document.getElementById('kmh');
        const fuelBar = document.getElementById('fuel-gauge');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = resize;
        resize();

        // --- SIMULATION CONFIG ---
        const LANES = 4;
        const LANE_W = canvas.width / LANES;
        const STEER_LIMIT = 90; // The lock angle
        const START_SPD = 2;
        const TOP_SPD = 20;
        const ACCEL = 0.008;

        let gameSpeed = START_SPD;
        let playerX = canvas.width / 2;
        let visualRotation = 0; // What we see
        let internalAngle = 0;  // The actual thumb position
        let isDragging = false;
        let startAngle = 0;
        
        let traffic = [];
        let roadOff = 0;
        let dist = 0;

        // --- INPUT ENGINE ---
        function getTouchAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const onStart = (e) => { 
            isDragging = true; 
            startAngle = getTouchAngle(e) - internalAngle; 
            e.preventDefault(); 
        };

        const onMove = (e) => {
            if (!isDragging) return;
            
            // Track thumb position continuously
            internalAngle = getTouchAngle(e) - startAngle;
            
            // VISUAL LOCK LOGIC:
            // The wheel follows the thumb 1:1, but is CLAMPED visually.
            // If the thumb rotates to 120, visual stays at 90.
            // If the thumb moves back to 80, visual follows to 80 immediately.
            visualRotation = Math.max(-STEER_LIMIT, Math.min(STEER_LIMIT, internalAngle));
            
            wheel.style.transform = `rotate(${visualRotation}deg)`;
        };

        const onEnd = () => { isDragging = false; };

        wheel.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        wheel.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);

        // --- OBJECT FACTORY ---
        class Vehicle {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_W) + (LANE_W / 2);
                this.y = -120;
                this.w = 26;
                this.h = 52;
                this.color = `hsl(${Math.random() * 360}, 60%, 45%)`;
                this.vSpeed = 4 + (Math.random() * 3);
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h);
                // Windows
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(this.x - 9, this.y + 10, 18, 14);
            }
        }

        function spawn() {
            let count = Math.floor(Math.random() * 3) + 1;
            let lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, count);
            lanes.forEach(l => traffic.push(new Vehicle(l)));
        }

        // --- CORE LOOP ---
        let lastSpawn = 0;
        function update(t) {
            // Speed Ramping
            if (gameSpeed < TOP_SPD) gameSpeed += ACCEL;
            roadOff = (roadOff + gameSpeed) % 80;
            
            // Movement Physics (Based on Visual Rotation)
            playerX += (visualRotation / STEER_LIMIT) * 8.5; 
            playerX = Math.max(22, Math.min(canvas.width - 22, playerX));

            // Auto-centering with internal reset
            if (!isDragging) {
                visualRotation *= 0.86;
                internalAngle = visualRotation; // Sync internal angle to center
                wheel.style.transform = `rotate(${visualRotation}deg)`;
            }

            // Dashboard
            kmhDisp.innerText = Math.round(gameSpeed * 9).toString().padStart(2, '0');
            dist += (gameSpeed / 12);
            fuelBar.style.width = Math.max(0, (100 - dist/40)) + "%";

            // Traffic
            if (t - lastSpawn > (1800 - gameSpeed * 70)) {
                spawn();
                lastSpawn = t;
            }

            traffic.forEach(v => {
                v.y += (gameSpeed - v.vSpeed);
                if (Math.abs(v.x - playerX) < 24 && v.y + v.h > canvas.height - 70 && v.y < canvas.height - 18) {
                    location.reload();
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 150);
        }

        function draw(t) {
            ctx.fillStyle = "#1a1a1c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 4-Lane Markers
            ctx.strokeStyle = "#2a2a2c";
            ctx.setLineDash([30, 45]);
            ctx.lineDashOffset = -roadOff;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_W, 0);
                ctx.lineTo(i * LANE_W, canvas.height);
                ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // Player Ship/Car
            ctx.shadowBlur = 20;
            ctx.shadowColor = var(--neon);
            ctx.fillStyle = var(--neon);
            ctx.fillRect(playerX - 13, canvas.height - 70, 26, 52);
            // Windshield
            ctx.fillStyle = "#000";
            ctx.fillRect(playerX - 10, canvas.height - 65, 20, 12);

            update(t);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
