<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Head Volley</title>
    <style>
        :root { --bg: #121212; --court: #f39c12; --sky: #2980b9; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        
        body { 
            margin: 0; background: var(--bg); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-family: 'Segoe UI', sans-serif; color: white;
        }

        /* Fixed Gaming Container */
        #game-view {
            position: relative; width: 90vw; max-width: 800px; 
            aspect-ratio: 16 / 9; background: var(--sky);
            border: 4px solid #444; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* UI Overlays */
        #hud {
            position: absolute; top: 0; width: 100%; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); pointer-events: none;
        }
        .score-pill { background: #000; padding: 5px 15px; border-radius: 20px; border: 2px solid #666; font-weight: bold; }
        #timer { font-size: 1.5rem; color: #f1c40f; }

        /* Mobile Controls - Positioned over the canvas */
        #touch-controls {
            position: absolute; bottom: 10px; width: 100%; 
            display: flex; justify-content: space-between; padding: 0 20px;
        }
        .btn {
            width: 65px; height: 65px; background: rgba(255,255,255,0.2); 
            border: 2px solid white; border-radius: 50%; color: white;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
        }
        .btn:active { background: rgba(255,255,255,0.5); }
        .jump-btn { background: rgba(230, 126, 34, 0.6); width: 80px; height: 80px; border-radius: 15px; }

        #end-screen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="hud">
            <div class="score-pill">AI: <span id="c-s">0</span></div>
            <div id="timer">02:00</div>
            <div class="score-pill">YOU: <span id="u-s">0</span></div>
        </div>

        <div id="end-screen">
            <h1 id="res">GAME OVER</h1>
            <button onclick="location.reload()" style="padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold;">PLAY AGAIN</button>
        </div>

        <canvas id="stage"></canvas>

        <div id="touch-controls">
            <div style="display: flex; gap: 10px;">
                <div class="btn" id="left">←</div>
                <div class="btn" id="right">→</div>
            </div>
            <div class="btn jump-btn" id="jump">JUMP</div>
        </div>
    </div>

<script>
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');

// Game State
let w, h, gY, net;
let scores = { p: 0, c: 0 };
let time = 120;
let input = { l: 0, r: 0, j: 0 };
let active = true;

function syncSize() {
    w = cvs.width = cvs.offsetWidth;
    h = cvs.height = cvs.offsetHeight;
    gY = h - 35;
    net = { x: w/2, y: h - 140, w: 10, h: 105 };
}

class Player {
    constructor(x, color, isP) {
        this.startX = x; this.color = color; this.isP = isP;
        this.r = 30; this.reset();
    }
    reset() {
        this.x = this.startX; this.y = gY - this.r;
        this.dx = 0; this.dy = 0; this.air = false;
    }
    draw() {
        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
        // Eye
        ctx.fillStyle = "white"; ctx.beginPath();
        ctx.arc(this.x + (this.isP ? -10 : 10), this.y - 10, 7, 0, Math.PI*2); ctx.fill();
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if (this.y < gY - this.r) this.dy += 0.8;
        else { this.y = gY - this.r; this.dy = 0; this.air = false; }
        
        // Net Collision for Players
        if (this.isP) {
            if (this.x < net.x + this.r + 5) this.x = net.x + this.r + 5;
            if (this.x > w - this.r) this.x = w - this.r;
        } else {
            if (this.x > net.x - this.r - 5) this.x = net.x - this.r - 5;
            if (this.x < this.r) this.x = this.r;
        }
    }
}

const ball = {
    r: 12,
    reset() { this.x = w/2; this.y = 50; this.dx = 0; this.dy = 0; },
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = "#ffff00"; ctx.fill(); ctx.stroke();
    }
};

const user = new Player(0, '#e74c3c', true);
const cpu = new Player(0, '#34495e', false);

window.addEventListener('resize', () => { syncSize(); user.startX = w-80; cpu.startX = 80; });
syncSize();
user.startX = w-80; cpu.startX = 80;
user.reset(); cpu.reset(); ball.reset();

// Logic
const ctrl = (id, k, v) => {
    const el = document.getElementById(id);
    const set = (e) => { e.preventDefault(); input[k] = v; };
    el.addEventListener('touchstart', set);
    el.addEventListener('touchend', (e) => { e.preventDefault(); input[k] = !v; });
};
ctrl('left', 'l', 1); ctrl('right', 'r', 1); ctrl('jump', 'j', 1);

setInterval(() => {
    if (!active) return;
    if (time > 0) {
        time--;
        let m = Math.floor(time/60), s = time%60;
        document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
    } else {
        active = false;
        document.getElementById('end-screen').style.display = 'flex';
        const res = document.getElementById('res');
        if (scores.p > scores.c) res.innerText = "YOU WIN!";
        else if (scores.p < scores.c) res.innerText = "AI WINS!";
        else res.innerText = "GAME MATCH (TIE)";
    }
}, 1000);

function game() {
    if (!active) return;
    ctx.clearRect(0, 0, w, h);

    // Draw Court & Net
    ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, gY, w, 40);
    ctx.fillStyle = "white"; ctx.fillRect(net.x - 5, net.y, net.w, net.h);

    // Player Movement
    user.dx = 0;
    if (input.l) user.dx = -6; if (input.r) user.dx = 6;
    if (input.j && !user.air) { user.dy = -15; user.air = true; }

    // AI Logic
    const target = ball.x - 15;
    cpu.dx = (cpu.x < target) ? 5 : (cpu.x > target) ? -5 : 0;
    if (ball.y < cpu.y && Math.abs(ball.x - cpu.x) < 50 && !cpu.air) { cpu.dy = -15; cpu.air = true; }

    user.update(); cpu.update();
    ball.dy += 0.4; ball.x += ball.dx; ball.y += ball.dy;

    // Ball/Net Collision
    if (ball.y > net.y && Math.abs(ball.x - net.x) < ball.r + 5) { ball.dx *= -1; }

    // Scoring
    if (ball.y > gY - ball.r) {
        if (ball.x < net.x) scores.p++; else scores.c++;
        ball.reset();
    }
    if (ball.x < 0 || ball.x > w) ball.dx *= -1;

    // Ball/Player Collision
    [user, cpu].forEach(p => {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (d < p.r + ball.r) {
            ball.dx = (ball.x - p.x) * 0.3 + p.dx;
            ball.dy = (ball.y - p.y) * 0.3 - 5;
        }
    });

    user.draw(); cpu.draw(); ball.draw();
    document.getElementById('u-s').innerText = scores.p;
    document.getElementById('c-s').innerText = scores.c;

    requestAnimationFrame(game);
}
game();
</script>
</body>
</html>
