<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Evocation | Steering Control</title>
    <style>
        body { margin: 0; background: #0a0a0c; color: #00ffcc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); border-bottom: 4px solid #00ffcc; }
        .hud { position: absolute; top: 20px; left: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .status-panel { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 14px; }
        #wheel-indicator { color: #ff4444; }
    </style>
</head>
<body>
    <div class="hud">Score: <span id="score">0</span></div>
    <div class="status-panel">
        <div>Hardware: <span id="wheel-indicator">Disconnected</span></div>
        <div style="font-size: 10px; opacity: 0.7;">Turn wheel to initialize</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const wheelStatus = document.getElementById('wheel-indicator');

        // Set Canvas Size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game Constants
        const STEERING_SENSITIVITY = 18;
        const DEADZONE = 0.05; // Prevents slight drift when wheel is centered
        
        let score = 0;
        let gameActive = true;
        let playerX = canvas.width / 2;

        const player = {
            width: 30,
            height: 30,
            color: '#00ffcc'
        };

        const obstacles = [];

        function spawnObstacle() {
            const size = Math.random() * 50 + 20;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 4 + 3
            });
        }

        function update() {
            if (!gameActive) return;

            // Handle Steering Wheel Input
            const gamepads = navigator.getGamepads();
            let moveInput = 0;

            if (gamepads[0]) {
                wheelStatus.innerText = "Active";
                wheelStatus.style.color = "#00ffcc";
                
                // Axis 0 is standard for steering wheels
                const axisValue = gamepads[0].axes[0]; 
                
                // Apply deadzone and move
                if (Math.abs(axisValue) > DEADZONE) {
                    moveInput = axisValue;
                }
            } else {
                wheelStatus.innerText = "Disconnected";
                wheelStatus.style.color = "#ff4444";
            }

            playerX += moveInput * STEERING_SENSITIVITY;

            // Screen Boundary Check
            if (playerX < 0) playerX = 0;
            if (playerX > canvas.width - player.width) playerX = canvas.width - player.width;

            // Obstacle Logic
            obstacles.forEach((obs, index) => {
                obs.y += obs.speed;
                
                // Hitbox detection
                if (obs.x < playerX + player.width &&
                    obs.x + obs.size > playerX &&
                    obs.y < (canvas.height - 60) + player.height &&
                    obs.y + obs.size > (canvas.height - 60)) {
                    
                    gameActive = false;
                    alert(`SYSTEM FAILURE. Final Score: ${score}`);
                    location.reload();
                }

                // Score and removal
                if (obs.y > canvas.height) {
                    obstacles.splice(index, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });

            if (Math.random() < 0.04) spawnObstacle();
        }

        function draw() {
            // Clear Frame
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Creates a slight trail effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Player Ship
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(playerX, canvas.height - 60, player.width, player.height);

            // Draw Obstacles (Asteroids)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff4444';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
            });

            update();
            requestAnimationFrame(draw);
        }

        // Initialize
        draw();

        // Handle window resizing
        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            playerX = canvas.width / 2;
        };
    </script>
</body>
</html>
