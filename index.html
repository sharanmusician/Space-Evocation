<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: Ultra Premium</title>
    <style>
        :root { 
            --accent: #00d2ff; --warn: #ff0055; --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        
        html, body { 
            width: 100vw; height: 100vh; height: -webkit-fill-available;
            background: var(--bg); overflow: hidden; position: fixed; top: 0; left: 0; 
            font-family: 'Inter', -apple-system, sans-serif;
        }
        
        #game-container { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle at 50% 30%, #101820 0%, #000 100%);
            display: flex; align-items: center; justify-content: center;
        }

        canvas { width: 100%; height: 100%; display: block; }
        
        /* 1 Cr Project HUD Layout */
        #hud { 
            position: absolute; top: 40px; width: 100%; 
            display: flex; justify-content: center; align-items: center; gap: 20px; 
            pointer-events: none; z-index: 10;
        }
        .panel { 
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 10px 25px; display: flex; align-items: center; justify-content: center;
        }
        .score { color: #fff; font-size: 24px; font-weight: 200; letter-spacing: 2px; }
        #timer { 
            font-size: 38px; font-weight: 800; color: #fff; width: 140px; text-align: center;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        
        /* Premium Linear Slider */
        #joy-zone { 
            position: absolute; bottom: 60px; left: 50px; width: 180px; height: 2px; 
            background: var(--border); z-index: 20; 
        }
        #joy-zone::before { content: ''; position: absolute; top: -10px; left: 0; width: 1px; height: 20px; background: var(--border); }
        #joy-zone::after { content: ''; position: absolute; top: -10px; right: 0; width: 1px; height: 20px; background: var(--border); }
        
        #knob { 
            position: absolute; width: 30px; height: 50px; 
            background: #fff; border-radius: 2px; 
            transform: translate(-50%, -50%); pointer-events: none; 
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        
        /* Pro Action Buttons */
        #act-zone { position: absolute; bottom: 40px; right: 30px; width: 260px; height: 180px; z-index: 20; }
        .btn { 
            position: absolute; border-radius: 50%; 
            background: var(--glass); backdrop-filter: blur(15px); 
            color: #fff; display: flex; align-items: center; justify-content: center; 
            font-weight: 300; border: 1px solid var(--border);
            font-size: 10px; letter-spacing: 2px; transition: all 0.2s;
        }
        .btn:active { background: #fff; color: #000; transform: scale(0.9); }
        
        #spike { width: 85px; height: 85px; bottom: 95px; right: 10px; }
        #lob { width: 85px; height: 85px; bottom: 95px; right: 110px; }
        #jump { 
            width: 185px; height: 65px; bottom: 10px; right: 10px; 
            border-radius: 4px; font-weight: 700; background: rgba(255,255,255,0.05);
        }
        
        #overlay { 
            position: absolute; inset: 0; background: #000; 
            z-index: 100; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; cursor: pointer; 
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="overlay" onclick="enterFullscreen()">
        <h1 style="letter-spacing: 20px; font-weight: 100; font-size: 14px; color: #888;">E V O L V E</h1>
        <p style="margin-top: 20px; font-size: 10px; letter-spacing: 5px;">INITIALIZE ENGINE</p>
    </div>
    
    <div id="hud">
        <div class="panel"><div class="score" id="s-c">0</div></div>
        <div id="timer">01:00</div>
        <div class="panel"><div class="score" id="s-u">0</div></div>
    </div>
    
    <canvas id="canvas"></canvas>
    <div id="joy-zone"></div>
    <div id="knob"></div>
    
    <div id="act-zone">
        <div class="btn" id="spike">STRIKE</div>
        <div class="btn" id="lob">LOB</div>
        <div class="btn" id="jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
let W, H, G_Y, NET, state = { u: 0, c: 0, active: false, time: 60 };
const inputs = { joyId: null, moveX: 0, spike: false, lob: false, buffer: 0 };

async function enterFullscreen() {
    const el = document.documentElement;
    try { if (el.requestFullscreen) await el.requestFullscreen(); } catch (err) {}
    start();
}

function start() {
    document.getElementById('overlay').style.display = 'none';
    state.active = true; resize(); ball.spawn(); startTimer(); requestAnimationFrame(loop);
}

function startTimer() {
    const tInterval = setInterval(() => {
        if (state.time > 0) {
            state.time--;
            let m = Math.floor(state.time / 60), s = state.time % 60;
            document.getElementById('timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        } else {
            clearInterval(tInterval); state.active = false;
            location.reload();
        }
    }, 1000);
}

function resize() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 50; NET = { x: W/2, y: G_Y - 90, w: 4, h: 90 };
    updateKnobUI(0);
    if(p1) p1.reset(); if(cpu) cpu.reset();
}

function updateKnobUI(val) {
    const r = joyZone.getBoundingClientRect();
    knob.style.left = (r.left + r.width/2 + val * (r.width/2)) + "px";
    knob.style.top = (r.top + r.height/2) + "px";
}

joyZone.addEventListener('touchstart', e => { e.preventDefault(); inputs.joyId = e.changedTouches[0].identifier; }, {passive: false});
window.addEventListener('touchmove', e => {
    for (let t of e.changedTouches) if (t.identifier === inputs.joyId) {
        const r = joyZone.getBoundingClientRect();
        inputs.moveX = Math.max(-1, Math.min(1, (t.clientX - (r.left + r.width/2)) / (r.width/2)));
        updateKnobUI(inputs.moveX);
    }
}, {passive: false});
window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) if (t.identifier === inputs.joyId) { inputs.joyId = null; inputs.moveX = 0; updateKnobUI(0); }
});

const bindBtn = (id, key) => {
    const b = document.getElementById(id);
    b.addEventListener('touchstart', e => {
        e.preventDefault(); inputs[key] = true; inputs.buffer = 12;
        if(key === 'jump' && !p1.air) { p1.dy = -18.5; p1.air = true; } 
    }, {passive: false});
    b.addEventListener('touchend', () => { if(key !== 'jump') inputs[key] = false; });
};
bindBtn('spike', 'spike'); bindBtn('lob', 'lob'); bindBtn('jump', 'jump');

class Athlete {
    constructor(side, color) { this.side = side; this.color = color; this.h = 45; }
    reset() { 
        this.x = (this.side === 'right') ? W * 0.75 : W * 0.25; 
        this.y = G_Y - this.h; this.dx = this.dy = 0; this.air = false; this.anim = 0; 
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        // FAST PLAYER LANDING
        if(this.y < G_Y - this.h) { this.dy += 1.4; } 
        else { this.y = G_Y - this.h; this.dy = 0; this.air = false; }
        const limit = NET.x + (this.side === 'right' ? 20 : -20);
        this.x = (this.side === 'right') ? Math.max(limit, Math.min(W-20, this.x)) : Math.min(limit, Math.max(20, this.x));
        this.anim += Math.abs(this.dx) * 0.25;
    }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y); if(this.side === 'right') ctx.scale(-1, 1);
        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
        let walk = Math.sin(this.anim) * 7;
        ctx.beginPath(); ctx.moveTo(0, 25); ctx.lineTo(walk, 45); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 25); ctx.lineTo(-walk, 45); ctx.stroke();
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.roundRect(-7, 7, 14, 24, 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
        let skill = (this === p1) ? (inputs.spike ? 'spike' : (inputs.lob || inputs.buffer > 0 ? 'lob' : null)) : this.skill;
        ctx.beginPath();
        if(skill === 'spike') { ctx.moveTo(6, 8); ctx.lineTo(25, -12); }
        else if(skill === 'lob') { ctx.moveTo(6, 12); ctx.lineTo(30, 40); }
        else { ctx.moveTo(3, 12); ctx.lineTo(3, 35); }
        ctx.stroke();
        ctx.restore();
    }
}

const ball = {
    r: 10, dx: 0, dy: 0, x: 0, y: 0, lock: 0,
    spawn() { this.y = H * 0.2; this.dx = 0; this.dy = 0; this.x = (state.u > state.c) ? W*0.3 : W*0.7; this.lock = 0; },
    update() {
        if(this.lock > 0) this.lock--;
        // FLOATY BALL GRAVITY (RESTORED)
        this.dy += 0.42; this.x += this.dx; this.y += this.dy;
        if(this.y >= G_Y - this.r) {
            this.y = G_Y - this.r;
            if(Math.abs(this.dy) > 3) this.dy *= -0.6;
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); p1.reset(); cpu.reset(); }
        }
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx = (this.x < NET.x) ? -Math.abs(this.dx) - 2.5 : Math.abs(this.dx) + 2.5;
            this.x = (this.x < NET.x) ? NET.x - (NET.w/2 + this.r + 2) : NET.x + (NET.w/2 + this.r + 2);
        }
    },
    draw() { 
        ctx.save();
        ctx.shadowBlur = 20; ctx.shadowColor = "#fff";
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); 
        ctx.restore();
    }
};

const p1 = new Athlete('right', '#fff'), cpu = new Athlete('left', '#444');

function loop() {
    if(!state.active) return;
    ctx.clearRect(0,0,W,H);
    if(inputs.buffer > 0) inputs.buffer--;
    
    // Aesthetic Floor Reflection
    let grad = ctx.createRadialGradient(ball.x, G_Y, 0, ball.x, G_Y, 150);
    grad.addColorStop(0, "rgba(255,255,255,0.05)"); grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad; ctx.fillRect(0, G_Y, W, 50);

    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(0, G_Y, W, 1);
    ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = inputs.moveX * 9.5;
    let d = ball.x - cpu.x;
    if (ball.x < NET.x) {
        cpu.dx = d > 5 ? 8 : d < -5 ? -8 : 0;
        if(!cpu.air && ball.y < G_Y - 90 && Math.abs(d) < 70) { cpu.dy = -18; cpu.air = true; }
        cpu.skill = (Math.abs(NET.x - cpu.x) < 140) ? (Math.random() > 0.4 ? 'spike' : 'lob') : null;
    } else { cpu.dx = (cpu.x < W * 0.2) ? 4 : -4; cpu.skill = null; }
    
    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let action = (p === p1) ? (inputs.spike ? 'spike' : (inputs.lob || inputs.buffer > 0 ? 'lob' : null)) : p.skill;
        let hb = { x1: p.x - 35, x2: p.x + 35, y1: p.y - 20, y2: p.y + 60 };
        if(ball.x > hb.x1 && ball.x < hb.x2 && ball.y > hb.y1 && ball.y < hb.y2 && ball.lock === 0) {
            ball.lock = 12;
            const side = (p.side === 'right') ? -1 : 1;
            if(action === 'spike') { ball.dx = side * 18.5; ball.dy = (ball.y < p.y + 10) ? 11 : 4; }
            else if(action === 'lob') { ball.dx = side * 7.5; ball.dy = -23; }
            else { ball.dx = side * 6.5; ball.dy = -8.5; }
            ball.x = p.x + (side * 40); inputs.buffer = 0;
        }
    });
    ball.update(); ball.draw();
    document.getElementById('s-u').innerText = state.u.toString().padStart(2, '0');
    document.getElementById('s-c').innerText = state.c.toString().padStart(2, '0');
    requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
</script>
</body>
</html>
