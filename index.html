<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA Physics Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        
        /* THE STAGE: This holds everything */
        #stage { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #050508;
            overflow: hidden;
        }

        /* THE WORLD: This rotates "All Left" or "All Right" */
        #world-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            /* Center of rotation is roughly where the car hood is */
            transform-origin: 50% 70%;
            transition: transform 0.1s ease-out;
        }

        /* DASHBOARD SPEEDO */
        #speedo-ui {
            position: absolute;
            bottom: 12.8%; right: 17.6%;
            width: 95px;
            z-index: 5;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        #kmh { color: #00ffcc; font-size: 28px; text-shadow: 0 0 15px #00ffcc; line-height: 1; }

        /* YOUR COCKPIT PNG */
        #cockpit-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            object-fit: fill;
            pointer-events: none;
        }

        /* STEERING INPUT RADIUS */
        #steering-zone {
            position: absolute;
            bottom: 5%; right: 7%;
            width: 160px; height: 160px;
            z-index: 20;
            border: 2px dashed rgba(0, 255, 204, 0.3);
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div id="stage">
    <div id="world-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="speedo-ui">
        <div id="kmh">000</div>
        <div style="color: #00ffcc; font-size: 8px; font-weight: bold; opacity: 0.7;">KM/H</div>
    </div>

    <img src="Cock.png" id="cockpit-img">

    <div id="steering-zone" id="wheel"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const worldWrapper = document.getElementById('world-wrapper');
    const kmhTxt = document.getElementById('kmh');
    const steeringZone = document.getElementById('steering-zone');

    // Engine States
    let playerX = 0;       // Left/Right position
    let velocityX = 0;     // Side-to-side speed (Momentum)
    let wheelAngle = 0;    // Rotation of your touch
    let worldTilt = 0;     // The "Lean" degree
    let gameSpeed = 0.08;
    let obstacles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 3D Engine Projection (GTA style)
    function project(x, y, z) {
        const scale = 1 / z;
        // vanishing point logic
        const px = (canvas.width * 0.63) + (x - playerX * 1800) * scale;
        const py = (canvas.height * 0.38) + (y * scale);
        return { x: px, y: py, scale: scale };
    }

    class Car {
        constructor() {
            this.lane = Math.floor(Math.random() * 4);
            this.laneX = -900 + (this.lane * 600);
            this.z = 60;
        }
        update() { this.z -= (gameSpeed * 0.8); }
        draw() {
            if (this.z < 0.2) return;
            const p = project(this.laneX, 350, this.z);
            const s = 650 * p.scale;
            ctx.fillStyle = "#900"; // Red Box Traffic
            ctx.fillRect(p.x - s/2, p.y - s, s, s);
        }
    }

    // Steering Logic
    let isTouching = false, lastTouchA = 0;
    const getA = (e) => {
        const r = steeringZone.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    };

    steeringZone.ontouchstart = (e) => { isTouching = true; lastTouchA = getA(e); e.preventDefault(); };
    window.ontouchmove = (e) => {
        if (!isTouching) return;
        let a = getA(e), delta = a - lastTouchA;
        if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
        wheelAngle = Math.max(-150, Math.min(150, wheelAngle + delta));
        steeringZone.style.transform = `rotate(${wheelAngle}deg)`;
        lastTouchA = a;
    };
    window.ontouchend = () => isTouching = false;

    function mainLoop() {
        ctx.fillStyle = "#050508";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- GTA PHYSICS ENGINE ---
        // Turn intensity creates Momentum
        let force = (wheelAngle / 150) * 0.04;
        velocityX += force;
        
        // Friction: The car tries to straighten out
        velocityX *= 0.93; 
        playerX += velocityX;
        
        // Boundaries
        if(playerX > 2.8) { playerX = 2.8; velocityX = 0; }
        if(playerX < -2.8) { playerX = -2.8; velocityX = 0; }

        // --- THE "ALL LEFT" LEAN ---
        // When you turn left, the world tilts right to show weight shift
        worldTilt = velocityX * 18; 
        worldWrapper.style.transform = `rotate(${-worldTilt}deg) scale(1.2)`;

        if (!isTouching) { 
            wheelAngle *= 0.85; 
            steeringZone.style.transform = `rotate(${wheelAngle}deg)`; 
        }

        // --- DRAW ROAD ---
        for (let z = 60; z > 0.1; z -= 2) {
            const p = project(0, 350, z), pNext = project(0, 350, z - 2);
            const w = 6500 * p.scale;
            ctx.fillStyle = (Math.floor(z + (Date.now()/80)) % 2 == 0) ? "#222" : "#1a1a1a";
            ctx.beginPath();
            ctx.moveTo(p.x - w/2, p.y);
            ctx.lineTo(p.x + w/2, p.y);
            ctx.lineTo(pNext.x + (6500 * pNext.scale)/2, pNext.y);
            ctx.lineTo(pNext.x - (6500 * pNext.scale)/2, pNext.y);
            ctx.fill();
        }

        // --- TRAFFIC ---
        if (Math.random() < 0.02) obstacles.push(new Car());
        obstacles.forEach((v, i) => {
            v.update(); v.draw();
            // Crash
            if (v.z < 1.2 && v.z > 0.5 && Math.abs(v.laneX - playerX * 1800) < 400) {
                location.reload(); 
            }
            if (v.z < 0.1) obstacles.splice(i, 1);
        });

        // --- SPEEDO ---
        kmhTxt.innerText = Math.round(gameSpeed * 1600);
        if (gameSpeed < 0.9) gameSpeed += 0.0001;

        requestAnimationFrame(mainLoop);
    }
    mainLoop();
</script>
</body>
</html>
