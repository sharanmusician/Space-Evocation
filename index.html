<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vice City Engine Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        #stage { position: relative; width: 100vw; height: 100vh; background: #1a0b2e; }

        /* THE WORLD: This moves and curves */
        #world-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            transform-origin: 50% 80%;
        }

        /* SPEEDO: Aligned to your dashboard hole */
        #speedo-ui {
            position: absolute;
            bottom: 12.8%; right: 17.6%;
            width: 95px;
            z-index: 5;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        #kmh { color: #ff00ff; font-size: 26px; text-shadow: 0 0 10px #ff00ff; line-height: 1; }

        /* INTERIOR: Your Cock.png */
        #cockpit {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            object-fit: fill;
            pointer-events: none;
        }

        /* STEERING INPUT */
        #steering-wheel {
            position: absolute;
            bottom: 4%; right: 7%;
            width: 150px; height: 150px;
            z-index: 20;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 255, 0.3);
        }
    </style>
</head>
<body>

<div id="stage">
    <div id="world-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="speedo-ui">
        <div id="kmh">000</div>
        <div style="color: #00f0ff; font-size: 8px; font-weight: bold;">MPH</div>
    </div>

    <img src="Cock.png" id="cockpit">

    <div id="steering-wheel"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const worldContainer = document.getElementById('world-container');
    const kmhDisp = document.getElementById('kmh');
    const wheel = document.getElementById('steering-wheel');

    // --- MAP DEFINITION (Edit this to change directions) ---
    // curve: negative = Left, positive = Right, 0 = Straight
    const map = [
        { length: 200, curve: 0 },
        { length: 300, curve: 2 },  // Hard Right
        { length: 200, curve: 0 },
        { length: 400, curve: -3 }, // Very Hard Left
        { length: 500, curve: 1 },  // Gentle Right
        { length: 200, curve: 0 }
    ];

    let pos = 0;           // Current distance on map
    let playerX = 0;       // Left/Right position
    let speed = 0;         // Current velocity
    let steerAngle = 0;    // Wheel rotation
    let trackVelocity = 0; // Momentum

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function getSegment(p) {
        let currentPos = 0;
        for (let i = 0; i < map.length; i++) {
            currentPos += map[i].length;
            if (p < currentPos) return map[i];
        }
        return map[0];
    }

    function project(x, y, z, segmentCurve) {
        const scale = 1 / z;
        // Perspective shift based on road curvature
        const px = (canvas.width * 0.63) + (x - (playerX * 1500) + segmentCurve) * scale;
        const py = (canvas.height * 0.38) + (y * scale);
        return { x: px, y: py, scale: scale };
    }

    // Input Handling
    let active = false, lastA = 0;
    const getA = (e) => {
        const r = wheel.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    };
    wheel.ontouchstart = (e) => { active = true; lastA = getA(e); e.preventDefault(); };
    window.ontouchmove = (e) => {
        if (!active) return;
        let a = getA(e), d = a - lastA;
        if (d > 180) d -= 360; if (d < -180) d += 360;
        steerAngle = Math.max(-160, Math.min(160, steerAngle + d));
        wheel.style.transform = `rotate(${steerAngle}deg)`;
        lastA = a;
    };
    window.ontouchend = () => active = false;

    function loop() {
        ctx.fillStyle = "#0a0515";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Physics
        if (speed < 0.8) speed += 0.002;
        pos += speed * 5;
        
        let targetSteer = (steerAngle / 160) * 0.05;
        trackVelocity += targetSteer;
        trackVelocity *= 0.92; // Friction
        playerX += trackVelocity;
        playerX = Math.max(-3, Math.min(3, playerX));

        // 2. Camera Tilt / Lean
        let lean = trackVelocity * 20;
        worldContainer.style.transform = `rotate(${-lean}deg) scale(1.15)`;

        if (!active) { steerAngle *= 0.85; wheel.style.transform = `rotate(${steerAngle}deg)`; }

        // 3. Render 3D Road with Curves
        let currentSegment = getSegment(pos / 10);
        let roadCurve = 0;

        for (let z = 60; z > 0.5; z -= 2) {
            // Apply curvature to the projection
            roadCurve += currentSegment.curve * (z / 20);
            
            const p = project(0, 350, z, roadCurve);
            const pNext = project(0, 350, z - 2, roadCurve + currentSegment.curve * ((z-2)/20));
            const w = 6000 * p.scale;
            
            // Texture
            ctx.fillStyle = (Math.floor((pos + z*10)/30) % 2 == 0) ? "#301040" : "#200a30";
            
            ctx.beginPath();
            ctx.moveTo(p.x - w/2, p.y);
            ctx.lineTo(p.x + w/2, p.y);
            ctx.lineTo(pNext.x + (6000 * pNext.scale)/2, pNext.y);
            ctx.lineTo(pNext.x - (6000 * pNext.scale)/2, pNext.y);
            ctx.fill();

            // White side lines
            ctx.fillStyle = "#ff00ff";
            ctx.fillRect(p.x - w/2, p.y, 15 * p.scale, pNext.y - p.y);
            ctx.fillRect(p.x + w/2 - (15*p.scale), p.y, 15 * p.scale, pNext.y - p.y);
        }

        // 4. Update Speedo
        kmhDisp.innerText = Math.round(speed * 140);

        // Reset map loop
        if (pos / 10 > 1700) pos = 0;

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
