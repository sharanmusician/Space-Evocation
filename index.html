<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traffic Racer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --brake-red: #ff3366;
            --asphalt: #1a1a1c;
        }

        body { 
            margin: 0; background: #000; 
            height: 100vh; width: 100vw; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none; 
        }

        /* Strict 9:16 Portrait Viewport */
        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: var(--asphalt);
            display: flex; flex-direction: column;
            border: 2px solid #333;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        #game-view { flex: 1; position: relative; overflow: hidden; background: #151517; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Professional Racing Dashboard */
        #dashboard {
            height: 32%;
            background: linear-gradient(180deg, #1c1c21 0%, #050505 100%);
            border-top: 5px solid #333;
            padding: 15px;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .dash-top { display: flex; justify-content: space-between; align-items: center; }
        .hud-stats { font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); font-size: 12px; }
        .bar-bg { width: 70px; height: 5px; background: #000; margin-top: 4px; border-radius: 2px; }
        .bar-fill { height: 100%; background: var(--neon-blue); transition: width 0.3s; }

        .speedo-main { text-align: center; font-family: 'Orbitron', sans-serif; color: #fff; }
        .speedo-val { font-size: 44px; line-height: 1; text-shadow: 0 0 15px var(--neon-blue); }

        .dash-bottom { display: flex; justify-content: space-between; align-items: flex-end; }

        /* "Direct-Drive" Steering Wheel */
        #steering-wheel {
            width: 105px; height: 105px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 11px solid #1a1a1c;
            background: radial-gradient(circle, #2a2a2e 0%, #111 80%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 10px #000;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 10px; background: #1a1a1c; transform: translateY(-50%); border-radius: 5px; }
        .top-notch { position: absolute; top: -11px; left: 50%; width: 10px; height: 11px; background: var(--brake-red); transform: translateX(-50%); }
        .wheel-center { position: absolute; top: 50%; left: 50%; width: 25px; height: 25px; background: #222; border: 2px solid #333; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view"><canvas id="gameCanvas"></canvas></div>

        <div id="dashboard">
            <div class="dash-top">
                <div class="hud-stats">
                    DISTANCE
                    <div id="dist-val" style="color: #fff; font-size: 16px;">0m</div>
                </div>
                <div class="speedo-main">
                    <div id="kmh" class="speedo-val">00</div>
                    <div style="font-size: 9px; letter-spacing: 3px; color: #555;">KM/H</div>
                </div>
            </div>

            <div class="dash-bottom">
                <div class="hud-stats">
                    STABILITY
                    <div class="bar-bg"><div id="stab-bar" class="bar-fill" style="width: 100%"></div></div>
                </div>
                <div id="steering-wheel">
                    <div class="top-notch"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                    <div class="wheel-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const kmhDisp = document.getElementById('kmh');
        const distDisp = document.getElementById('dist-val');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- TRAFFIC RACER CONSTANTS ---
        const LANES = 4;
        const LANE_W = canvas.width / LANES;
        const STEER_LOCK = 90; // Physical stop at 90 degrees
        
        let gameSpeed = 3; 
        const MAX_SPEED = 24;
        const ACCEL = 0.006;

        let playerX = canvas.width / 2;
        let visualRot = 0;   // Visual wheel position (Clamped)
        let thumbRot = 0;    // Real thumb position (Unclamped)
        let isDragging = false;
        let startA = 0;
        
        let traffic = [];
        let roadOffset = 0;
        let distance = 0;

        // --- STEERING LOGIC ---
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        wheel.addEventListener('touchstart', (e) => { 
            isDragging = true; 
            startA = getAngle(e) - thumbRot; 
            e.preventDefault(); 
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            thumbRot = getAngle(e) - startA;
            
            // LOCK MECHANISM: Visual follows thumb 1:1 until 90, then stops.
            // If thumb moves back, visual follows immediately.
            visualRot = Math.max(-STEER_LOCK, Math.min(STEER_LOCK, thumbRot));
            wheel.style.transform = `rotate(${visualRot}deg)`;
        }, {passive: false});

        window.addEventListener('touchend', () => { isDragging = false; });

        // --- TRAFFIC ENGINE ---
        class NPC {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_W) + (LANE_W / 2);
                this.y = -150;
                this.w = 32;
                this.h = 65;
                this.vSpeed = 4 + Math.random() * 5; // NPCs have different speeds
                this.color = `hsl(${Math.random() * 360}, 50%, 40%)`;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h);
                // Windows & Roof
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(this.x - 10, this.y + 10, 20, 18);
                // Brake lights (Static)
                ctx.fillStyle = "#600";
                ctx.fillRect(this.x - 14, this.y + this.h - 4, 8, 3);
                ctx.fillRect(this.x + 6, this.y + this.h - 4, 8, 3);
            }
        }

        function spawnTraffic() {
            // Traffic Racer Logic: Block 1-3 lanes, always leave an opening.
            let count = Math.floor(Math.random() * 3) + 1;
            let lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, count);
            lanes.forEach(l => traffic.push(new NPC(l)));
        }

        // --- MAIN LOOP ---
        let lastSpawn = 0;
        function update(t) {
            // 1. Acceleration
            if (gameSpeed < MAX_SPEED) gameSpeed += ACCEL;
            roadOffset = (roadOffset + gameSpeed) % 100;
            
            // 2. Steering Physics
            // Movement is 1:1 with the VISUAL rotation
            playerX += (visualRot / STEER_LOCK) * 10; 
            playerX = Math.max(20, Math.min(canvas.width - 20, playerX));

            if (!isDragging) {
                visualRot *= 0.85;
                thumbRot = visualRot; // Sync internal angle back
                wheel.style.transform = `rotate(${visualRot}deg)`;
            }

            // 3. HUD
            kmhDisp.innerText = Math.round(gameSpeed * 11).toString().padStart(2, '0');
            distance += (gameSpeed / 10);
            distDisp.innerText = Math.floor(distance) + "m";

            // 4. Traffic Logic
            if (t - lastSpawn > (1500 - gameSpeed * 40)) {
                spawnTraffic();
                lastSpawn = t;
            }

            traffic.forEach(v => {
                v.y += (gameSpeed - v.vSpeed); // Objects move relative to player
                
                // CRASH LOGIC
                if (Math.abs(v.x - playerX) < 28 && v.y + v.h > canvas.height - 105 && v.y < canvas.height - 35) {
                    location.reload();
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 200);
        }

        function render(t) {
            ctx.fillStyle = "#151517";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Highway Lanes
            ctx.strokeStyle = "#252528";
            ctx.setLineDash([40, 60]);
            ctx.lineDashOffset = -roadOffset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_W, 0);
                ctx.lineTo(i * LANE_W, canvas.height);
                ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // Draw Player Vehicle
            ctx.shadowBlur = 20;
            ctx.shadowColor = var(--neon-blue);
            ctx.fillStyle = var(--neon-blue);
            ctx.fillRect(playerX - 16, canvas.height - 100, 32, 65);
            
            // Details
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#000";
            ctx.fillRect(playerX - 12, canvas.height - 92, 24, 15); // Windshield

            update(t);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
