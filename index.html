<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice City - Internal Drive</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', Courier, monospace; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        
        /* The Windscreen Overlay */
        #interior-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows you to click the game behind the image */
            z-index: 100;
            object-fit: cover;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ff00ff;
            text-shadow: 2px 2px #00ffff;
            z-index: 101;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">W/S: ACCEL | A/D: STEER</div>
    <img id="interior-overlay" src="Cock.png" alt="Car Interior">
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.Fog(0x220022, 5, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('game-container').appendChild(renderer.domElement);

    // --- Vice City Lighting ---
    const ambient = new THREE.AmbientLight(0xff00ff, 0.5); // Pink ambient
    scene.add(ambient);
    
    const streetLight = new THREE.PointLight(0x00ffff, 2, 20); // Cyan street glow
    scene.add(streetLight);

    // --- Building Generator (10 Buildings) ---
    const createBuilding = (x, z, h) => {
        const group = new THREE.Group();
        const geo = new THREE.BoxGeometry(5, h, 5);
        const mat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const body = new THREE.Mesh(geo, mat);
        body.position.y = h / 2;
        group.add(body);

        // Neon Trim
        const trimGeo = new THREE.BoxGeometry(5.2, 0.5, 5.2);
        const trimMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
        const trim = new THREE.Mesh(trimGeo, trimMat);
        trim.position.y = h - 1;
        group.add(trim);

        group.position.set(x, 0, z);
        scene.add(group);
    };

    // Layout buildings around the junction
    const positions = [
        [-8, -15], [8, -15], [-8, -25], [8, -25], [-8, -35],
        [8, -5], [-8, -5], [8, 5], [-8, 5], [8, 15]
    ];
    positions.forEach(pos => createBuilding(pos[0], pos[1], Math.random() * 10 + 5));

    // --- The Road ---
    const roadGeo = new THREE.PlaneGeometry(200, 200);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x080808 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // --- Car & Physics ---
    const car = new THREE.Group();
    scene.add(car);
    car.add(camera);
    camera.position.set(0, 1.1, 0); // Eye-level view through Cock.png windscreen

    let speed = 0;
    let rotation = 0;
    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // --- Main Loop ---
    function animate() {
        requestAnimationFrame(animate);

        // Movement Logic
        if (keys['w']) speed += 0.005;
        if (keys['s']) speed -= 0.005;
        speed *= 0.96; // Friction

        if (keys['a']) rotation += 0.02;
        if (keys['d']) rotation -= 0.02;

        car.rotation.y = rotation;
        car.translateZ(-speed);

        // Move light with car
        streetLight.position.set(car.position.x, 2, car.position.z);

        renderer.render(scene, camera);
    }

    animate();

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
