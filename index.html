<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Highway Star | 4-Lane Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0b;
            --road: #1a1a1c;
            --neon: #00f2ff;
            --danger: #ff3366;
            --dash-panel: #141416;
        }

        body { 
            margin: 0; background: #000; 
            height: 100vh; width: 100vw; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none; 
        }

        /* Fixed 9:16 Portrait Viewport */
        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: var(--road);
            display: flex; flex-direction: column;
            border: 1px solid #222;
        }

        #game-view { flex: 1; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Professional Ergo-Dashboard */
        #dashboard {
            height: 30%;
            background: linear-gradient(180deg, #1c1c1f 0%, #050505 100%);
            border-top: 3px solid #333;
            padding: 10px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dash-upper { display: flex; justify-content: space-between; align-items: flex-start; }
        
        /* Digital HUD Cluster */
        .hud-cluster { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 11px; }
        .gauge-bar { width: 70px; height: 4px; background: #000; margin-top: 2px; border-radius: 2px; overflow: hidden; }
        .gauge-fill { height: 100%; background: var(--neon); transition: width 0.3s; }

        .speedo-main { text-align: center; font-family: 'Orbitron', sans-serif; color: #fff; }
        .speedo-val { font-size: 34px; line-height: 1; text-shadow: 0 0 12px var(--neon); }

        .dash-lower { display: flex; justify-content: space-between; align-items: flex-end; }
        
        .vent-unit { display: flex; gap: 6px; }
        .vent { width: 30px; height: 14px; background: #0c0c0d; border: 1px solid #252525; border-radius: 2px;
                background-image: linear-gradient(0deg, #1a1a1a 50%, transparent 50%); background-size: 100% 4px; }

        /* Precise Steering Control */
        #steering-wheel {
            width: 90px; height: 90px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 9px solid #18181a;
            background: radial-gradient(circle, #222 0%, #111 70%);
            box-shadow: 0 6px 15px rgba(0,0,0,0.7), inset 0 0 8px #000;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 8px; background: #18181a; transform: translateY(-50%); }
        .wheel-cap { position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; background: #252528; border: 1px solid #3a3a3a; border-radius: 50%; transform: translate(-50%, -50%); }
        .top-notch { position: absolute; top: -9px; left: 50%; width: 8px; height: 9px; background: var(--danger); transform: translateX(-50%); border-radius: 1px; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="dashboard">
            <div class="dash-upper">
                <div class="hud-cluster">
                    FUEL
                    <div class="gauge-bar"><div id="fuel-meter" class="gauge-fill" style="width: 100%"></div></div>
                    <div style="margin-top: 8px;">TEMP</div>
                    <div class="gauge-bar"><div class="gauge-fill" style="width: 35%; background: #ffaa00"></div></div>
                </div>
                <div class="speedo-main">
                    <div id="kmh-val" class="speedo-val">00</div>
                    <div style="font-size: 8px; letter-spacing: 2px; color: #555;">KILOMETERS/H</div>
                </div>
            </div>

            <div class="dash-lower">
                <div class="vent-unit">
                    <div class="vent"></div>
                    <div class="vent"></div>
                </div>
                <div id="steering-wheel">
                    <div class="top-notch"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                    <div class="wheel-cap"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const kmhDisp = document.getElementById('kmh-val');
        const fuelMeter = document.getElementById('fuel-meter');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = resize;
        resize();

        // High-Experience Config
        const LANES = 4;
        const LANE_WIDTH = canvas.width / LANES;
        const SPEED = 16;
        const STEER_SENSITIVITY = 0.15;

        let playerX = canvas.width / 2;
        let rotation = 0;
        let dragging = false;
        let startA = 0;
        let traffic = [];
        let fuel = 100;
        let offset = 0;

        // Interaction Logic
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const handleStart = (e) => { dragging = true; startA = getAngle(e) - rotation; e.preventDefault(); };
        const handleMove = (e) => {
            if (!dragging) return;
            rotation = getAngle(e) - startA;
            rotation = Math.max(-420, Math.min(420, rotation));
            wheel.style.transform = `rotate(${rotation}deg)`;
        };
        const handleEnd = () => { dragging = false; };

        wheel.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        wheel.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleEnd);

        // Professional Traffic Engine
        class Vehicle {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_WIDTH) + (LANE_WIDTH / 2);
                this.y = -120;
                this.w = 28;
                this.h = 55;
                this.speed = 5 + Math.random() * 5;
                this.hue = Math.random() * 360;
            }
            draw() {
                ctx.fillStyle = `hsl(${this.hue}, 70%, 50%)`;
                ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h);
                // Glass
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(this.x - 10, this.y + 10, 20, 15);
            }
        }

        function spawn() {
            // Block 1, 2, or 3 lanes, but ALWAYS keep at least one free.
            let blockCount = Math.floor(Math.random() * 3) + 1;
            let lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, blockCount);
            lanes.forEach(l => traffic.push(new Vehicle(l)));
        }

        let lastT = 0;
        function update(t) {
            offset = (offset + SPEED) % 100;
            
            // Dynamics
            playerX += rotation * STEER_SENSITIVITY;
            playerX = Math.max(20, Math.min(canvas.width - 20, playerX));

            if (!dragging) {
                rotation *= 0.88;
                wheel.style.transform = `rotate(${rotation}deg)`;
            }

            // HUD
            kmhDisp.innerText = Math.abs(Math.round(rotation * 0.6)).toString().padStart(2, '0');
            fuel -= 0.008;
            fuelMeter.style.width = fuel + "%";

            // Traffic
            if (t - lastT > 900) {
                spawn();
                lastT = t;
            }

            traffic.forEach(v => {
                v.y += (SPEED - v.speed);
                // Hitbox detection
                if (Math.abs(v.x - playerX) < 26 && v.y + v.h > canvas.height - 70 && v.y < canvas.height - 15) {
                    location.reload();
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 100);
        }

        function draw(t) {
            ctx.fillStyle = "#1a1a1c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 4-Lane Road Markings
            ctx.strokeStyle = "#333";
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -offset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_WIDTH, 0);
                ctx.lineTo(i * LANE_WIDTH, canvas.height);
                ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // Player Vehicle (The Pursuit Car)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";
            ctx.fillRect(playerX - 14, canvas.height - 70, 28, 55);

            update(t);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
