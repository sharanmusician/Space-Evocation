<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Evocation | Pro Cockpit</title>
    <style>
        :root {
            --dashboard-bg: #111113;
            --panel-border: #2a2a2e;
            --glow: #00f2ff;
            --danger: #ff3366;
        }

        body { 
            margin: 0; 
            background: #000; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        /* Landscape Force-Rotation Logic */
        #main-stage {
            position: relative;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg); /* Rotates for portrait phones */
            transform-origin: center;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* If the device is already landscape, don't rotate */
        @media (orientation: landscape) {
            #main-stage {
                width: 100vw;
                height: 100vh;
                transform: rotate(0deg);
            }
        }

        /* Game Viewport */
        #game-view {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at bottom, #0d0d21 0%, #000 100%);
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* Full Interior Dashboard */
        #interior {
            height: 40%;
            background: linear-gradient(180deg, #1a1a1c 0%, #0a0a0a 100%);
            border-top: 5px solid #222;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            padding: 15px 40px;
            box-sizing: border-box;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Left Gauges (Fuel/Temp) */
        .instrument-cluster { display: flex; flex-direction: column; justify-content: center; gap: 20px; }
        .gauge-label { font-size: 10px; color: #555; font-weight: bold; margin-bottom: 4px; letter-spacing: 1px; }
        .gauge-track { width: 100%; height: 8px; background: #000; border-radius: 4px; border: 1px solid #333; overflow: hidden; }
        .gauge-bar { height: 100%; width: 100%; transition: width 0.3s; }

        /* Center Console (Speedo & AC) */
        .console { display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .speedo-digital { text-align: center; color: var(--glow); text-shadow: 0 0 10px var(--glow); }
        .speed-val { font-size: 54px; font-weight: bold; line-height: 1; }
        
        .vents-row { display: flex; gap: 15px; width: 100%; justify-content: center; }
        .ac-vent { 
            width: 70px; height: 35px; 
            background: repeating-linear-gradient(180deg, #111, #111 6px, #1a1a1a 7px);
            border: 2px solid #333; border-radius: 4px;
            box-shadow: inset 0 0 5px #000;
        }

        /* Right Side: Steering System */
        .steering-box { display: flex; align-items: center; justify-content: flex-end; }
        #wheel-wrap {
            width: 180px; height: 180px;
            position: relative;
            cursor: grab;
            display: flex; align-items: center; justify-content: center;
        }
        .real-wheel {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 16px solid #1a1a1a;
            background: transparent;
            box-shadow: inset 0 0 15px #000, 0 8px 20px rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
        }
        .spoke-h { position: absolute; width: 85%; height: 18px; background: #1a1a1a; border-radius: 4px; }
        .spoke-v { position: absolute; height: 85%; width: 18px; background: #1a1a1a; border-radius: 4px; }
        .wheel-center { width: 45px; height: 45px; background: #222; border: 2px solid #333; border-radius: 50%; z-index: 3; }
        .top-stripe { position: absolute; top: -16px; width: 12px; height: 16px; background: var(--danger); }
    </style>
</head>
<body>

    <div id="main-stage">
        <div id="game-view">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="interior">
            <div class="instrument-cluster">
                <div>
                    <div class="gauge-label">FUEL</div>
                    <div class="gauge-track"><div id="fuel-fill" class="gauge-bar" style="background: #00ff88; width: 100%;"></div></div>
                </div>
                <div>
                    <div class="gauge-label">ENGINE TEMP</div>
                    <div class="gauge-track"><div id="temp-fill" class="gauge-bar" style="background: var(--danger); width: 45%;"></div></div>
                </div>
            </div>

            <div class="console">
                <div class="speedo-digital">
                    <div class="speed-val" id="kmh">0</div>
                    <div style="font-size: 12px; letter-spacing: 3px;">KM/H</div>
                </div>
                <div class="vents-row">
                    <div class="ac-vent"></div>
                    <div class="ac-vent"></div>
                </div>
            </div>

            <div class="steering-box">
                <div id="wheel-wrap">
                    <div class="top-stripe"></div>
                    <div class="real-wheel">
                        <div class="wheel-center"></div>
                        <div class="spoke-h"></div>
                        <div class="spoke-v"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('wheel-wrap');
        const kmhDisplay = document.getElementById('kmh');
        const fuelBar = document.getElementById('fuel-fill');

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // System Variables
        let rotation = 0;
        let isActive = false;
        let startAngle = 0;
        let playerX = canvas.width / 2;
        let fuel = 100;
        let obstacles = [];

        // Interaction
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const start = (e) => { isActive = true; startAngle = getAngle(e) - rotation; e.preventDefault(); };
        const move = (e) => {
            if (!isActive) return;
            rotation = getAngle(e) - startAngle;
            rotation = Math.max(-360, Math.min(360, rotation));
            wheel.style.transform = `rotate(${rotation}deg)`;
        };
        const end = () => { isActive = false; };

        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);

        function update() {
            // Steering Physics
            playerX += rotation * 0.15; // High sensitivity
            if (playerX < 30) playerX = 30;
            if (playerX > canvas.width - 30) playerX = canvas.width - 30;

            // Auto-center wheel
            if (!isActive) {
                rotation *= 0.88;
                wheel.style.transform = `rotate(${rotation}deg)`;
            }

            // Dashboard State
            kmhDisplay.innerText = Math.abs(Math.round(rotation * 0.9));
            fuel -= 0.005;
            fuelBar.style.width = fuel + "%";

            // Spawn Obstacles
            if (Math.random() < 0.06) {
                obstacles.push({ x: Math.random() * canvas.width, y: -50, speed: 6 + Math.random() * 4 });
            }

            obstacles.forEach((o, i) => {
                o.y += o.speed;
                // Collision
                if (Math.abs(o.x - playerX) < 40 && o.y > canvas.height - 70) {
                    location.reload();
                }
            });
            obstacles = obstacles.filter(o => o.y < canvas.height);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = "#fff";
            for(let i=0; i<10; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

            // Draw Ship
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";
            ctx.beginPath();
            ctx.moveTo(playerX, canvas.height - 70);
            ctx.lineTo(playerX - 25, canvas.height - 20);
            ctx.lineTo(playerX + 25, canvas.height - 20);
            ctx.fill();

            // Draw Obstacles
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ff3366";
            obstacles.forEach(o => {
                ctx.beginPath();
                ctx.arc(o.x, o.y, 20, 0, Math.PI*2);
                ctx.fill();
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
