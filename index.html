<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed Multi-Touch Volley</title>
    <style>
        :root { --gold: #f1c40f; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: linear-gradient(to bottom, #1e3799, #4a69bd);
        }
        canvas { width: 100%; height: 100%; display: block; background: transparent; }
        
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 10; pointer-events: none; }
        .score { background: rgba(0,0,0,0.7); color: white; padding: 8px 20px; border-radius: 12px; border: 2px solid var(--gold); font-family: sans-serif; font-weight: bold; }
        #timer { color: var(--gold); font-size: 2rem; font-weight: bold; font-family: sans-serif; }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; font-family: sans-serif; }
        .btn-start { padding: 20px 60px; background: var(--gold); border: none; border-radius: 50px; font-size: 1.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px #b8950c; }

        /* Joystick Controls */
        #joystick-zone { position: absolute; bottom: 10%; left: 10%; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 50; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; pointer-events: none; }
        
        /* Action Buttons */
        #action-zone { position: absolute; bottom: 10%; right: 5%; display: flex; gap: 15px; z-index: 50; }
        .act-btn { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #fff; color: white; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.5); font-family: sans-serif; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay">
        <h1 id="m-title">1000YR VOLLEY</h1>
        <button class="btn-start" onclick="begin()">SERVE</button>
    </div>
    <div id="hud">
        <div class="score">AI: <span id="c-s">0</span></div>
        <div id="timer">01:00</div>
        <div class="score">YOU: <span id="u-s">0</span></div>
    </div>
    <canvas id="stage"></canvas>
    
    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    
    <div id="action-zone">
        <div class="act-btn" id="btn-spike" style="border-color: #ff4757;">SPIKE</div>
        <div class="act-btn" id="btn-lob" style="border-color: #2ecc71;">LOB</div>
        <div class="act-btn" id="btn-cut" style="border-color: #f1c40f;">CUT</div>
    </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');
const stick = document.getElementById('joystick-stick');

let W, H, G_Y, NET;
let joy = { x: 0, y: 0, identifier: null };
let activeSkill = null;
let state = { scores: { p: 0, c: 0 }, time: 60, running: false, lastWinner: null };

function syncDimensions() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    G_Y = H - 50;
    NET = { x: W/2, y: H - 170, w: 14, h: 120 };
    // Re-clamp positions on resize
    if(p1) p1.reset();
    if(cpu) cpu.reset();
}

function begin() {
    // Standard and Webkit Fullscreen
    const f = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
    if (f) f.call(container).catch(() => {}); 
    
    document.getElementById('overlay').style.display = 'none';
    state.running = true;
    state.time = 60;
    syncDimensions();
    requestAnimationFrame(loop);
}

// MULTI-TOUCH STICK
const zone = document.getElementById('joystick-zone');
zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    joy.identifier = touch.identifier;
}, {passive: false});

window.addEventListener('touchmove', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joy.identifier) {
            const r = zone.getBoundingClientRect();
            const cx = r.left + r.width/2, cy = r.top + r.height/2;
            const dx = t.clientX - cx, dy = t.clientY - cy;
            const d = Math.hypot(dx, dy), lim = r.width/2;
            
            joy.x = (d > 0) ? (dx / d) * Math.min(d, lim) / lim : 0;
            joy.y = (d > 0) ? (dy / d) * Math.min(d, lim) / lim : 0;
            
            stick.style.left = (50 + joy.x * 40) + "%";
            stick.style.top = (50 + joy.y * 40) + "%";
            
            if(joy.y < -0.7 && !p1.air) { p1.dy = -17; p1.air = true; }
        }
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joy.identifier) {
            joy.identifier = null; joy.x = 0; joy.y = 0;
            stick.style.left = stick.style.top = "50%";
        }
    }
});

// ACTION BUTTONS
['spike', 'lob', 'cut'].forEach(s => {
    const b = document.getElementById('btn-' + s);
    b.addEventListener('touchstart', e => { e.preventDefault(); activeSkill = s; b.style.background = "rgba(255,255,255,0.3)"; });
    b.addEventListener('touchend', e => { e.preventDefault(); activeSkill = null; b.style.background = "rgba(0,0,0,0.5)"; });
});

class Actor {
    constructor(side, color) { this.side = side; this.color = color; this.r = 35; }
    reset() {
        this.x = (this.side === 'left') ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.r;
        this.dx = 0; this.dy = 0; this.air = false;
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.r) this.dy += 0.8;
        else { this.y = G_Y - this.r; this.dy = 0; this.air = false; }
        
        // Edge/Net Collision
        this.x = Math.max(this.r, Math.min(W - this.r, this.x));
        const m = this.r + NET.w/2;
        if(this.side === 'right') this.x = Math.max(NET.x + m, this.x);
        else this.x = Math.min(NET.x - m, this.x);
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
        // Eye for direction
        ctx.fillStyle = "white"; ctx.beginPath();
        ctx.arc(this.side === 'right' ? -15 : 15, -10, 8, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

const ball = {
    r: 16, dx: 0, dy: 0, x: 0, y: 0,
    spawn() {
        this.y = H * 0.3; this.dx = this.dy = 0;
        this.x = (state.lastWinner === 'p') ? W * 0.75 : W * 0.25;
    },
    update() {
        this.dy += 0.45; this.dx *= 0.99; this.dy *= 0.99;
        this.x += this.dx; this.y += this.dy;

        if(this.y < this.r) { this.y = this.r; this.dy = Math.abs(this.dy)*0.5; }
        if(this.y > G_Y - this.r) { this.y = G_Y - this.r; this.dy *= -0.7; }
        
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx *= -1.2; this.x = (this.x < NET.x) ? NET.x - 25 : NET.x + 25;
        }

        if(this.x < -50 || this.x > W + 50) {
            state.scores[this.x > W ? 'c' : 'p']++;
            state.lastWinner = this.x > W ? 'c' : 'p';
            this.spawn(); p1.reset(); cpu.reset();
        }
    },
    draw() {
        ctx.fillStyle = "#fff200"; ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fill(); ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
    }
};

const p1 = new Actor('right', '#ff4757');
const cpu = new Actor('left', '#2c3e50');

function loop() {
    if(!state.running) return;
    ctx.clearRect(0,0,W,H);
    
    // Background and Floor
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, G_Y, W, 50);
    ctx.fillStyle = "white"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = joy.x * 10;
    
    // AI Shuffle
    let target = (ball.x < NET.x) ? ball.x - 10 : W * 0.15;
    cpu.dx = (cpu.x < target - 5) ? 7.5 : (cpu.x > target + 5) ? -7.5 : 0;
    if(ball.x < NET.x && !cpu.air && ball.y < G_Y - 80 && Math.random() > 0.98) { cpu.dy = -17; cpu.air = true; }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let dist = Math.hypot(p.x - ball.x, p.y - ball.y);
        if(dist < p.r + ball.r) {
            const ang = (ball.x - p.x) / p.r;
            const s = (p === p1) ? activeSkill : (Math.random() > 0.7 ? 'spike' : 'lob');
            if(s === 'spike') { ball.dx = (p.side==='right'?-18:18); ball.dy = -4; }
            else if(s === 'lob') { ball.dx = (p.side==='right'?-6:6); ball.dy = -18; }
            else if(s === 'cut') { ball.dx = ang * 16; ball.dy = -11; }
            else { ball.dx = ang * 5; ball.dy = -9; }
        }
    });

    ball.update(); ball.draw();
    
    document.getElementById('u-s').innerText = state.scores.p;
    document.getElementById('c-s').innerText = state.scores.c;
    requestAnimationFrame(loop);
}

setInterval(() => {
    if(!state.running) return;
    state.time--;
    document.getElementById('timer').innerText = `00:${state.time < 10 ? '0' + state.time : state.time}`;
    if(state.time <= 0) {
        state.running = false;
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('m-title').innerText = state.scores.p > state.scores.c ? "YOU WIN!" : "AI WINS!";
    }
}, 1000);

window.addEventListener('resize', syncDimensions);
syncDimensions(); // Immediate setup
</script>
</body>
</html>
