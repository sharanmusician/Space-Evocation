<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Evocation | Cockpit Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            touch-action: none;
        }

        /* 16:9 Game Container */
        #game-container {
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100vw;
            max-height: 56.25vw; /* 9/16 of width */
            background: #020205;
            overflow: hidden;
            border: 2px solid #333;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Dashboard Interior */
        #dashboard {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(to top, #0f0f0f 0%, #1a1a1a 80%, #2a2a2a 100%);
            border-top: 4px solid #333;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        /* Speedometer/Digital HUD on Dashboard */
        .hud-display {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid #00f2ff;
            padding: 10px 30px;
            border-radius: 5px;
            color: #00f2ff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        /* Realistic Corner Steering Wheel */
        #wheel-tray {
            position: absolute;
            bottom: 10px;
            right: 20px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }

        #steering-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #111;
            box-sizing: border-box;
            border: 10px solid #222;
            box-shadow: inset 0 0 10px #000, 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            cursor: grab;
            transition: transform 0.05s linear;
        }

        /* Leather texture and grip detail */
        #steering-wheel::before {
            content: '';
            position: absolute;
            top: 50%; left: 10%; right: 10%; height: 12px;
            background: #222; transform: translateY(-50%);
            border-radius: 4px;
        }

        #steering-wheel::after {
            content: '';
            position: absolute;
            left: 50%; top: 10%; bottom: 10%; width: 12px;
            background: #222; transform: translateX(-50%);
            border-radius: 4px;
        }

        /* Center Hub */
        .wheel-center {
            position: absolute;
            top: 50%; left: 50%;
            width: 40px; height: 40px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* Top Marker (The 12 o'clock stripe) */
        .top-marker {
            position: absolute;
            top: 0; left: 50%;
            width: 12px; height: 10px;
            background: #ff3366;
            transform: translateX(-50%);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="dashboard">
            <div class="hud-display">
                <div style="font-size: 10px; opacity: 0.8;">VELOCITY</div>
                <div id="speed-val">0</div>
                <div style="font-size: 10px; margin-top: 5px;">SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div id="wheel-tray">
            <div id="steering-wheel">
                <div class="top-marker"></div>
                <div class="wheel-center"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const speedElement = document.getElementById('speed-val');
        const wheel = document.getElementById('steering-wheel');

        // Logic to maintain 16:9 internal resolution
        function setSize() {
            canvas.width = 1280;
            canvas.height = 720;
        }
        setSize();

        // Constants
        const MOVEMENT_SENSITIVITY = 0.2; 
        const MAX_SHIP_SPEED = 30;
        const AUTO_CENTER_SPEED = 0.85;

        let score = 0;
        let gameActive = true;
        let playerX = canvas.width / 2;
        let currentRotation = 0; 
        let isRotating = false;
        let startAngle = 0;

        const player = { width: 40, height: 40, color: '#00f2ff' };
        const obstacles = [];

        function getMouseAngle(event) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
        }

        const startRotation = (e) => {
            isRotating = true;
            startAngle = getMouseAngle(e) - currentRotation;
            e.preventDefault();
        };

        const updateRotation = (e) => {
            if (!isRotating) return;
            const newAngle = getMouseAngle(e);
            currentRotation = newAngle - startAngle;
            currentRotation = Math.max(-450, Math.min(450, currentRotation));
            wheel.style.transform = `rotate(${currentRotation}deg)`;
        };

        const stopRotation = () => { isRotating = false; };

        wheel.addEventListener('mousedown', startRotation);
        window.addEventListener('mousemove', updateRotation);
        window.addEventListener('mouseup', stopRotation);
        wheel.addEventListener('touchstart', startRotation, {passive: false});
        window.addEventListener('touchmove', updateRotation, {passive: false});
        window.addEventListener('touchend', stopRotation);

        function spawnObstacle() {
            const size = Math.random() * 50 + 30;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 4 + 6
            });
        }

        function update() {
            if (!gameActive) return;

            let velocity = currentRotation * MOVEMENT_SENSITIVITY;
            velocity = Math.max(-MAX_SHIP_SPEED, Math.min(MAX_SHIP_SPEED, velocity));
            playerX += velocity;
            
            speedElement.innerText = Math.abs(Math.round(velocity * 10));

            if (!isRotating) {
                currentRotation *= AUTO_CENTER_SPEED;
                wheel.style.transform = `rotate(${currentRotation}deg)`;
            }

            if (playerX < 0) playerX = 0;
            if (playerX > canvas.width - player.width) playerX = canvas.width - player.width;

            // Collision logic adjusted for dashboard height
            const dashboardTop = canvas.height * 0.75;

            obstacles.forEach((obs, index) => {
                obs.y += obs.speed;
                
                if (obs.x < playerX + player.width &&
                    obs.x + obs.size > playerX &&
                    obs.y < (dashboardTop - 50) + player.height &&
                    obs.y + obs.size > (dashboardTop - 50)) {
                    gameActive = false;
                    alert("CRITICAL DAMAGE! Score: " + score);
                    location.reload();
                }

                if (obs.y > dashboardTop) {
                    obstacles.splice(index, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });

            if (Math.random() < 0.07) spawnObstacle();
        }

        function draw() {
            // Draw background
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = "#fff";
            for(let i=0; i<5; i++) {
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
            }

            // Ship
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(playerX + player.width / 2, 720 * 0.75 - 50);
            ctx.lineTo(playerX, 720 * 0.75 - 10);
            ctx.lineTo(playerX + player.width, 720 * 0.75 - 10);
            ctx.fill();

            // Obstacles
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff3366';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
