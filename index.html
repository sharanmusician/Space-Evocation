<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Evocation | High-Speed Steering</title>
    <style>
        body { margin: 0; background: #020205; color: #00f2ff; font-family: 'Orbitron', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        
        .hud { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; pointer-events: none; }

        /* The Custom CSS Steering Wheel */
        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #steering-wheel {
            width: 100%;
            height: 100%;
            border: 12px solid #444;
            border-top-color: #00f2ff; /* Indicates "Top" */
            border-radius: 50%;
            position: relative;
            cursor: grab;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            background: radial-gradient(circle, rgba(20,20,30,0.8) 0%, rgba(0,0,0,0.9) 70%);
            transition: transform 0.05s linear;
        }

        /* Inner spokes of the wheel */
        #steering-wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 8px;
            background: #444;
            transform: translateY(-50%);
        }

        #steering-wheel::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 8px;
            height: 100%;
            background: #444;
            transform: translateX(-50%);
        }

        #steering-wheel:active { cursor: grabbing; }
    </style>
</head>
<body>
    <div class="hud">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div id="steering-wheel"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const wheel = document.getElementById('steering-wheel');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- ADJUSTABLE SETTINGS ---
        const MOVEMENT_SENSITIVITY = 0.15; // Higher = Faster ship response
        const MAX_SHIP_SPEED = 25;        // Maximum horizontal speed
        const AUTO_CENTER_SPEED = 0.88;    // Lower = Snaps back faster
        // ---------------------------

        let score = 0;
        let gameActive = true;
        let playerX = canvas.width / 2;
        let currentRotation = 0; 
        let isRotating = false;
        let startAngle = 0;

        const player = { width: 36, height: 36, color: '#00f2ff' };
        const obstacles = [];

        function getMouseAngle(event) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
        }

        const startRotation = (e) => {
            isRotating = true;
            startAngle = getMouseAngle(e) - currentRotation;
            e.preventDefault();
        };

        const updateRotation = (e) => {
            if (!isRotating) return;
            const newAngle = getMouseAngle(e);
            currentRotation = newAngle - startAngle;
            // Cap rotation to prevent infinite spinning
            currentRotation = Math.max(-360, Math.min(360, currentRotation));
            wheel.style.transform = `rotate(${currentRotation}deg)`;
        };

        const stopRotation = () => { isRotating = false; };

        wheel.addEventListener('mousedown', startRotation);
        window.addEventListener('mousemove', updateRotation);
        window.addEventListener('mouseup', stopRotation);
        wheel.addEventListener('touchstart', startRotation, {passive: false});
        window.addEventListener('touchmove', updateRotation, {passive: false});
        window.addEventListener('touchend', stopRotation);

        function spawnObstacle() {
            const size = Math.random() * 40 + 25;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 3 + 5 // Faster falling speed
            });
        }

        function update() {
            if (!gameActive) return;

            // Calculate movement: further rotation = faster movement
            let velocity = currentRotation * MOVEMENT_SENSITIVITY;
            velocity = Math.max(-MAX_SHIP_SPEED, Math.min(MAX_SHIP_SPEED, velocity));
            playerX += velocity;

            // Decay rotation when not grabbing (auto-center)
            if (!isRotating) {
                currentRotation *= AUTO_CENTER_SPEED;
                if (Math.abs(currentRotation) < 0.1) currentRotation = 0;
                wheel.style.transform = `rotate(${currentRotation}deg)`;
            }

            // Boundaries
            if (playerX < 0) playerX = 0;
            if (playerX > canvas.width - player.width) playerX = canvas.width - player.width;

            obstacles.forEach((obs, index) => {
                obs.y += obs.speed;
                
                // Collision
                if (obs.x < playerX + player.width &&
                    obs.x + obs.size > playerX &&
                    obs.y < (canvas.height - 130) + player.height &&
                    obs.y + obs.size > (canvas.height - 130)) {
                    gameActive = false;
                    alert("SHIP DESTROYED. Score: " + score);
                    location.reload();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(index, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });

            if (Math.random() < 0.06) spawnObstacle();
        }

        function draw() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ship (Futuristic look)
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(playerX + player.width / 2, canvas.height - 130);
            ctx.lineTo(playerX, canvas.height - 130 + player.height);
            ctx.lineTo(playerX + player.width, canvas.height - 130 + player.height);
            ctx.fill();

            // Obstacles
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff3366';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
