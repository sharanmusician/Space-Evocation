<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skelly Ball: Firebase Pro</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.2); --bg: #0a0a0a; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100vw; height: 100vh; background: var(--bg); overflow: hidden; position: fixed; font-family: 'Inter', sans-serif; }
        #game-container { position: absolute; inset: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); }
        canvas { width: 100%; height: 100%; display: block; }
        .screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .action-btn { padding: 18px 45px; background: #fff; color: #000; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; margin: 10px; }
        input { padding: 15px; border-radius: 4px; text-align: center; font-size: 20px; width: 220px; color: #000; margin-bottom: 10px; }
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; opacity: 0; pointer-events: none; }
        .score-box { background: var(--glass); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; color: white; }
        #joy-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 40px; background: var(--glass); border-radius: 20px; opacity: 0; border: 1px solid var(--border); }
        #knob { position: absolute; width: 30px; height: 30px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #act-zone { position: absolute; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; opacity: 0; }
        .btn { background: var(--glass); border: 1px solid var(--border); padding: 15px; border-radius: 8px; font-size: 10px; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="main-menu" class="screen">
        <h1 style="font-size: 40px; margin-bottom: 20px;">SKELLY BALL</h1>
        <button class="action-btn" id="off-btn">OFFLINE AI</button>
        <button class="action-btn" id="on-btn" style="background:#333; color:#fff">ONLINE PLAY</button>
    </div>

    <div id="online-menu" class="screen hidden">
        <button class="action-btn" id="host-btn">CREATE ROOM</button>
        <p style="margin: 10px;">- OR -</p>
        <input type="number" id="room-input" placeholder="ENTER CODE">
        <button class="action-btn" id="join-btn">JOIN ROOM</button>
    </div>

    <div id="waiting-screen" class="screen hidden">
        <p>YOUR ROOM CODE:</p>
        <h1 id="display-code" style="font-size: 60px; color: #00ffcc;">----</h1>
        <p>Waiting for opponent...</p>
    </div>

    <div id="hud">
        <div class="score-box" id="s-c">0</div>
        <div style="color: white; font-size: 24px; font-weight: bold;" id="timer">01:00</div>
        <div class="score-box" id="s-u">0</div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="joy-zone"></div><div id="knob" style="left: -100px;"></div>
    <div id="act-zone">
        <div class="btn" id="lift">LIFT</div><div class="btn" id="lob">LOB</div><div class="btn" id="spike">SPIKE</div>
    </div>
</div>

<script type="module">
    // --- FIREBASE SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAMfZLzlY_uivMNeoaEY6CTegVf2RtUHtU",
        authDomain: "skelly-ball.firebaseapp.com",
        projectId: "skelly-ball",
        storageBucket: "skelly-ball.firebasestorage.app",
        messagingSenderId: "51373655501",
        appId: "1:51373655501:web:25774aad43cf709845f084"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- GAME VARIABLES ---
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
    let W, H, G_Y, NET, state = { u: 0, c: 0, active: false };
    const inputs = { moveX: 0, buffer: 0, type: '', joyID: null };

    let isOnline = false, isHost = false, roomID = null;

    // --- NAVIGATION ---
    document.getElementById('off-btn').onclick = () => startMatch('offline');
    document.getElementById('on-btn').onclick = () => {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('online-menu').classList.remove('hidden');
    };

    document.getElementById('host-btn').onclick = () => {
        roomID = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;
        document.getElementById('online-menu').classList.add('hidden');
        document.getElementById('waiting-screen').classList.remove('hidden');
        document.getElementById('display-code').innerText = roomID;

        // Create Room in Firebase
        set(ref(db, 'rooms/' + roomID), { status: 'waiting' });
        
        // Listen for Joiner
        onValue(ref(db, 'rooms/' + roomID + '/status'), (snap) => {
            if(snap.val() === 'playing') startMatch('online');
        });
    };

    document.getElementById('join-btn').onclick = () => {
        roomID = document.getElementById('room-input').value;
        if(roomID.length !== 4) return alert("Enter 4 digits");
        isHost = false;
        
        // Update Room Status
        update(ref(db, 'rooms/' + roomID), { status: 'playing' });
        startMatch('online');
    };

    function startMatch(mode) {
        isOnline = (mode === 'online');
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('hud').style.opacity = 1;
        document.getElementById('joy-zone').style.opacity = 1;
        document.getElementById('act-zone').style.opacity = 1;
        state.active = true;
        resize();
        ball.spawn();
        
        if(isOnline) {
            const myPath = isHost ? 'host' : 'joiner';
            const oppPath = isHost ? 'joiner' : 'host';

            // Sync Opponent Position
            onValue(ref(db, `rooms/${roomID}/${oppPath}`), (snap) => {
                const data = snap.val();
                if(data) {
                    cpu.x = W - data.x; // MIRROR LOGIC
                    cpu.y = data.y;
                    cpu.actionAnim = data.anim;
                }
            });

            // If Joiner, sync ball from Host
            if(!isHost) {
                onValue(ref(db, `rooms/${roomID}/ball`), (snap) => {
                    const data = snap.val();
                    if(data) { ball.x = W - data.x; ball.y = data.y; }
                });
            }
        }
        requestAnimationFrame(loop);
    }

    // --- GAME ENGINE ---
    class Athlete {
        constructor(side) { this.side = side; this.x=0; this.y=0; this.actionAnim=0; }
        reset() { this.x = (this.side === 'right') ? W * 0.8 : W * 0.2; this.y = G_Y - 40; }
        update() {
            if(this.side === 'right') this.x += inputs.moveX * 7;
            const lim = NET.x + (this.side === 'right' ? 25 : -25);
            this.x = (this.side === 'right') ? Math.max(lim, Math.min(W-20, this.x)) : Math.min(lim, Math.max(20, this.x));
            if(this.actionAnim > 0) this.actionAnim--;
        }
        draw() {
            ctx.fillStyle = (this.side === 'right') ? "#fff" : "#555";
            ctx.fillRect(this.x-10, this.y, 20, 40);
        }
    }

    const ball = {
        x: 0, y: 0, dx: 2, dy: 0,
        spawn() { this.x = W/2; this.y = 100; },
        update() {
            if(!isOnline || isHost) {
                this.x += this.dx; this.y += this.dy; this.dy += 0.25;
                if(this.y > G_Y) { this.dy *= -0.8; this.y = G_Y; }
                if(this.x < 10 || this.x > W-10) this.dx *= -1;
            }
        },
        draw() { ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(this.x, this.y, 8, 0, Math.PI*2); ctx.fill(); }
    };

    const p1 = new Athlete('right'), cpu = new Athlete('left');

    function resize() {
        W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
        G_Y = H - 100; NET = { x: W/2 };
        p1.reset(); cpu.reset();
    }

    function loop() {
        if(!state.active) return;
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = "gray"; ctx.fillRect(W/2-2, G_Y-80, 4, 80); // Net

        p1.update();
        ball.update();

        // Simple Collision
        if(Math.abs(ball.x - p1.x) < 30 && Math.abs(ball.y - p1.y) < 40) {
            ball.dy = -8; ball.dx = (ball.x < p1.x) ? -4 : 4;
            p1.actionAnim = 10;
        }

        // --- FIREBASE SYNC ---
        if(isOnline) {
            const myPath = isHost ? 'host' : 'joiner';
            update(ref(db, `rooms/${roomID}/${myPath}`), {
                x: p1.x, y: p1.y, anim: p1.actionAnim
            });
            if(isHost) {
                update(ref(db, `rooms/${roomID}/ball`), { x: ball.x, y: ball.y });
            }
        }

        p1.draw(); cpu.draw(); ball.draw();
        requestAnimationFrame(loop);
    }

    // Controls
    window.addEventListener('touchstart', e => {
        let t = e.touches[0];
        if(t.clientX < W/2) {
            const rJ = joyZone.getBoundingClientRect();
            inputs.moveX = (t.clientX - (rJ.left + rJ.width/2)) / 30;
            knob.style.left = t.clientX + "px"; knob.style.top = t.clientY + "px";
        }
    });
    window.addEventListener('touchend', () => { inputs.moveX = 0; knob.style.left = "-100px"; });
    window.onresize = resize;
</script>
</body>
</html>
