<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Head Ball 2 MVP</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        #stage { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #scoreboard { height: 50px; background: #000; color: gold; display: flex; justify-content: center; align-items: center; gap: 30px; font-weight: bold; font-size: 20px; }
        
        canvas { flex-grow: 1; background: #4a90e2; display: block; }

        /* Mobile Controls */
        #ui-layer { height: 160px; background: #2c3e50; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-top: 5px solid #34495e; }
        .group { display: flex; gap: 15px; }
        .btn { width: 85px; height: 85px; background: #ecf0f1; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 6px #bdc3c7; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px #bdc3c7; }
        .jump { background: #e67e22; color: white; width: 100px; height: 100px; box-shadow: 0 6px #d35400; font-size: 18px; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="scoreboard">
            <span id="cpu-score">AI: 0</span>
            <span>-</span>
            <span id="user-score">YOU: 0</span>
        </div>

        <canvas id="game"></canvas>

        <div id="ui-layer">
            <div class="group">
                <div class="btn" id="l">←</div>
                <div class="btn" id="r">→</div>
            </div>
            <div class="btn jump" id="j">JUMP</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let w, h, gY;
let scores = { p: 0, c: 0 };
let keys = { l: false, r: false, j: false };

// Character Setup
class Head {
    constructor(side, color) {
        this.side = side;
        this.color = color;
        this.r = 38;
        this.reset();
    }
    reset() {
        this.x = this.side === 'left' ? 120 : w - 120;
        this.y = gY - this.r;
        this.dx = 0; this.dy = 0;
        this.jump = false;
    }
    draw() {
        // Boot
        ctx.fillStyle = "#333";
        ctx.fillRect(this.x - 20, this.y + 25, 40, 15);
        // Head
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 4; ctx.stroke();
        // Eye
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x + (this.side === 'right' ? -15 : 15), this.y - 12, 8, 0, Math.PI*2);
        ctx.fill();
    }
    update() {
        this.y += this.dy; this.x += this.dx;
        if (this.y < gY - this.r) this.dy += 0.8;
        else { this.y = gY - this.r; this.dy = 0; this.jump = false; }
        this.x = Math.max(this.r, Math.min(w - this.r, this.x));
    }
}

const ball = {
    r: 14,
    reset() { this.x = w/2; this.y = h/4; this.dx = 0; this.dy = 0; },
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = "white"; ctx.fill(); ctx.stroke();
    }
};

const cpu = new Head('left', '#2c3e50'); // AI Character
const user = new Head('right', '#e74c3c'); // Your Character

function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = canvas.offsetHeight;
    gY = h - 20;
    cpu.reset(); user.reset(); ball.reset();
}

window.addEventListener('resize', init);
init();

// Touch Controls
const touch = (id, k) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
    el.ontouchend = (e) => { e.preventDefault(); keys[k] = false; };
};
touch('l', 'l'); touch('r', 'r'); touch('j', 'j');

function main() {
    ctx.clearRect(0, 0, w, h);
    
    // Field & Goals
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, gY, w, 20);
    ctx.strokeStyle = "white"; ctx.lineWidth = 6;
    ctx.strokeRect(-10, gY - 110, 30, 110); // AI Goal
    ctx.strokeRect(w - 20, gY - 110, 30, 110); // User Goal

    // AI logic (Simple ball tracking)
    cpu.dx = (ball.x < cpu.x + 30) ? -5 : (ball.x > cpu.x + 50) ? 5 : 0;
    if (ball.y < cpu.y && Math.abs(ball.x - cpu.x) < 80 && !cpu.jump) { cpu.dy = -15; cpu.jump = true; }

    // User logic
    user.dx = 0;
    if (keys.l) user.dx = -7;
    if (keys.r) user.dx = 7;
    if (keys.j && !user.jump) { user.dy = -16; user.jump = true; }

    // Ball Physics
    ball.dy += 0.5; ball.x += ball.dx; ball.y += ball.dy;
    if (ball.y > gY - ball.r) { ball.y = gY - ball.r; ball.dy *= -0.75; ball.dx *= 0.98; }
    if (ball.x < 0 || ball.x > w) ball.dx *= -0.8;

    // Hit Detection
    [cpu, user].forEach(p => {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (d < p.r + ball.r) {
            ball.dx = (ball.x - p.x) * 0.4 + p.dx;
            ball.dy = (ball.y - p.y) * 0.4 - 4;
        }
    });

    // Scoring
    if (ball.x < 20 && ball.y > gY - 110) { scores.p++; ball.reset(); }
    if (ball.x > w - 20 && ball.y > gY - 110) { scores.c++; ball.reset(); }

    cpu.update(); user.update();
    cpu.draw(); user.draw(); ball.draw();

    document.getElementById('cpu-score').innerText = `AI: ${scores.c}`;
    document.getElementById('user-score').innerText = `YOU: ${scores.p}`;

    requestAnimationFrame(main);
}
main();
</script>
</body>
</html>
