<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Traffic Racer | Cockpit PNG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        
        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* LAYER 1: The World (Road/Cars) sits at the very back */
        #world {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* LAYER 2: Speedometer (Positions itself behind the dash hole) */
        #dash-display {
            position: absolute;
            bottom: 13%; 
            right: 17.5%;
            z-index: 5; /* In front of road, behind cockpit */
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        #kmh { color: #00ff00; font-size: 26px; text-shadow: 0 0 10px rgba(0,255,0,0.7); }

        /* LAYER 3: The Full-Screen Cockpit with Transparency */
        #cockpit-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; /* Sits on top of the road */
            pointer-events: none;
            object-fit: fill;
        }

        /* LAYER 4: Interactive Steering Wheel */
        #controls {
            position: absolute;
            bottom: 4%; right: 6%;
            width: 150px; height: 150px;
            z-index: 20; /* Highest layer for touch interaction */
        }
        #controls img { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>

<div id="stage">
    <canvas id="world"></canvas>

    <div id="dash-display">
        <div id="kmh">0</div>
        <div style="color: #0f0; font-size: 9px; letter-spacing: 1px;">KM/H</div>
    </div>

    <img src="Cock.png" id="cockpit-overlay">

    <div id="controls">
        <img src="wheel.png" id="wheel-gfx">
    </div>
</div>

<script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const speedo = document.getElementById('kmh');
    const steering = document.getElementById('controls');

    // Asset Loading
    const roadImg = new Image(); roadImg.src = 'road.jpg';
    const npcImg = new Image(); npcImg.src = 'traffic_car.png';

    let playerX = 0, wheelRot = 0, speed = 0.05, roadOff = 0, traffic = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 3D Projection Logic
    function project(x, y, z) {
        const scale = 1 / z;
        // Adjust center to match your Right-Hand Drive perspective
        const px = (canvas.width * 0.62) + (x - playerX * 1300) * scale;
        const py = (canvas.height * 0.38) + (y * scale);
        return { x: px, py: py, scale: scale };
    }

    class NPC {
        constructor(lane) {
            this.lane = lane;
            this.laneX = -750 + (lane * 500);
            this.z = 35;
        }
        update() { this.z -= speed; }
        draw() {
            if (this.z < 0.2) return;
            const p = project(this.laneX, 350, this.z);
            const w = 550 * p.scale;
            const h = 400 * p.scale;
            if (npcImg.complete) ctx.drawImage(npcImg, p.x - w/2, p.py - h, w, h);
        }
    }

    // Interactive Steering
    let active = false, startA = 0;
    const getA = (e) => {
        const r = steering.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    };

    steering.onmousedown = steering.ontouchstart = (e) => { active = true; startA = getA(e); e.preventDefault(); };
    window.onmousemove = window.ontouchmove = (e) => {
        if (!active) return;
        let a = getA(e), delta = a - startA;
        if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
        wheelRot = Math.max(-90, Math.min(90, wheelRot + delta));
        steering.style.transform = `rotate(${wheelRot}deg)`;
        startA = a;
    };
    window.onmouseup = window.ontouchend = () => active = false;

    function render(t) {
        ctx.fillStyle = "#0a0a0f"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        roadOff = (roadOff + speed * 75) % 100;
        playerX += (wheelRot / 90) * 0.08;
        playerX = Math.max(-2.2, Math.min(2.2, playerX));
        
        if (!active) { wheelRot *= 0.88; steering.style.transform = `rotate(${wheelRot}deg)`; }

        // Draw 3D Road
        for (let z = 35; z > 0.1; z -= 1.5) {
            const p = project(0, 350, z), pNext = project(0, 350, z - 1.5);
            const w = 4500 * p.scale;
            if (roadImg.complete) ctx.drawImage(roadImg, p.x - w/2, p.py, w, pNext.py - p.py);
        }

        // Handle Traffic
        if (Math.random() < 0.018) traffic.push(new NPC(Math.floor(Math.random() * 4)));
        traffic.forEach((v, i) => {
            v.update(); v.draw();
            // Crash logic: if car gets too close and hits your lane
            if (v.z < 1.0 && v.z > 0.5 && Math.abs((v.laneX - playerX * 1300)) < 350) {
                speed = 0; // Stop game
                setTimeout(() => location.reload(), 1000);
            }
            if (v.z < 0.1) traffic.splice(i, 1);
        });

        // Update Dashboard
        speedo.innerText = Math.round(speed * 600);
        if (speed < 0.5) speed += 0.00005;

        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
</script>

</body>
</html>
