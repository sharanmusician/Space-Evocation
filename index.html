<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Volley: Full Correction</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --accent: #00f2ff; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; font-family: sans-serif; }
        
        /* Fullscreen Overlay */
        #overlay { position: fixed; inset: 0; background: #111; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .start-btn { padding: 25px 80px; background: var(--accent); color: #000; border-radius: 50px; font-weight: 900; font-size: 20px; border: none; cursor: pointer; box-shadow: 0 0 20px var(--accent); }

        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 10; pointer-events: none; }
        .score { background: var(--glass); border: 1px solid rgba(255,255,255,0.2); padding: 10px 25px; border-radius: 12px; color: #fff; font-size: 24px; font-weight: bold; }

        canvas { display: block; width: 100vw; height: 100vh; z-index: 1; }

        /* Controls */
        #ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
        #joy-zone { position: absolute; bottom: 40px; left: 40px; width: 160px; height: 80px; background: var(--glass); border-radius: 40px; border: 1px solid rgba(255,255,255,0.3); pointer-events: auto; }
        #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #act-zone { position: absolute; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; pointer-events: auto; }
        .btn { background: var(--glass); border: 1px solid rgba(255,255,255,0.3); height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 12px; }
        #jump-btn { grid-column: span 3; background: rgba(0, 242, 255, 0.2); color: var(--accent); }
    </style>
</head>
<body>

<div id="overlay">
    <button class="start-btn" id="entry-point">TAP TO PLAY FULLSCREEN</button>
</div>

<div id="hud">
    <div class="score" id="s-c">0</div>
    <div style="color:var(--accent); font-weight: 800;" id="timer">01:00</div>
    <div class="score" id="s-u">0</div>
</div>

<canvas id="canvas"></canvas>

<div id="ui-layer">
    <div id="joy-zone"><div id="knob"></div></div>
    <div id="act-zone">
        <div class="btn" id="lift">LIFT</div>
        <div class="btn" id="lob">LOB</div>
        <div class="btn" id="strike">STRIKE</div>
        <div class="btn" id="jump-btn">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
let W, H, G_Y, NET;
let state = { u: 0, c: 0, active: false, time: 60 };
let input = { x: 0, buffer: '', bTimer: 0, joyID: null };

function resize() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 60; NET = { x: W/2, y: G_Y - 100, w: 8, h: 100 };
}

// FULLSCREEN CORRECTION
document.getElementById('entry-point').addEventListener('click', function() {
    const doc = window.document;
    const docEl = doc.documentElement;
    const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
    if (requestFullScreen) requestFullScreen.call(docEl);
    
    document.getElementById('overlay').style.display = 'none';
    state.active = true;
    resize();
    ball.spawn();
    requestAnimationFrame(loop);
});

class Athlete {
    constructor(side, color) {
        this.side = side; this.color = color;
        this.w = 40; this.h = 45; this.reset();
    }
    reset() {
        this.x = (this.side === 'left') ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.h; this.dx = 0; this.dy = 0; this.air = false;
        this.skill = null; this.combo = 0;
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if (this.y < G_Y - this.h) this.dy += 1.5;
        else { this.y = G_Y - this.h; this.dy = 0; this.air = false; }
        
        let min = (this.side === 'left') ? 25 : NET.x + 30;
        let max = (this.side === 'left') ? NET.x - 30 : W - 25;
        this.x = Math.max(min, Math.min(max, this.x));
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - 18, this.y, 36, 45);
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(this.x, this.y - 5, 15, 0, Math.PI*2); ctx.fill();
    }
}

const ball = {
    x: 0, y: 0, dx: 0, dy: 0, r: 10, lock: 0,
    spawn() { this.x = W * 0.7; this.y = H * 0.3; this.dx = -5; this.dy = 0; this.lock = 0; },
    update() {
        if (this.lock > 0) this.lock--;
        for (let i = 0; i < 8; i++) {
            this.x += this.dx / 8; this.y += this.dy / 8;
            if (this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
                this.dx *= -0.6; this.x = (this.x < NET.x) ? NET.x - 15 : NET.x + 15;
            }
        }
        this.dy += 0.3;
        if (this.y >= G_Y - this.r) {
            if (Math.abs(this.dy) > 2) this.dy *= -0.5;
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); }
        }
    }
};

const p1 = new Athlete('right', '#4a90e2'), cpu = new Athlete('left', '#ff3b3b');

function loop() {
    if (!state.active) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(NET.x-4, NET.y, 8, 100);
    
    // AI Prediction
    if (ball.x < NET.x) {
        let isStuck = (ball.x > NET.x - 100 && ball.dx < 1);
        if (isStuck || cpu.combo > 0) {
            cpu.dx = (ball.x - cpu.x) * 0.8;
            if (cpu.combo === 0) cpu.combo = 1;
            if (cpu.combo === 1) { cpu.skill = 'lift'; if (ball.lock > 0) cpu.combo = 2; }
            else { if (!cpu.air) cpu.dy = -18, cpu.air = true; cpu.skill = 'strike'; if (ball.dx > 5) cpu.combo = 0; }
        } else {
            cpu.dx = (ball.x + (ball.dx * 10) - cpu.x) * 0.2;
            cpu.skill = ['lob', 'lift', 'strike'][Math.floor(Date.now()/2000)%3];
        }
    } else { cpu.dx = (W*0.1 - cpu.x)*0.1; cpu.skill = null; }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let act = (p === p1) ? (input.bTimer > 0 ? input.buffer : null) : p.skill;
        if (act && Math.abs(ball.x - p.x) < 70 && Math.abs(ball.y - p.y) < 90 && ball.lock === 0) {
            ball.lock = 25; let d = (p.side === 'right') ? -1 : 1;
            if (act === 'strike') { ball.dx = d * 28; ball.dy = 8; }
            else if (act === 'lift') { ball.dx = d * 0.5; ball.dy = -19; }
            else { ball.dx = d * 12; ball.dy = -24; }
            if (p === p1) input.bTimer = 0;
        }
    });

    ball.update();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 11, 0, Math.PI*2); ctx.fill();
    
    if (input.bTimer > 0) input.bTimer--;
    document.getElementById('s-c').innerText = state.c; document.getElementById('s-u').innerText = state.u;
    requestAnimationFrame(loop);
}

// MOVEMENT FIX: Continuous touch tracking
window.addEventListener('touchstart', e => {
    for (let t of e.changedTouches) {
        if (t.clientX < W / 2) input.joyID = t.identifier;
        ['lift', 'lob', 'strike', 'jump-btn'].forEach(id => {
            const r = document.getElementById(id).getBoundingClientRect();
            if (t.clientX > r.left && t.clientX < r.right && t.clientY > r.top && t.clientY < r.bottom) {
                if (id === 'jump-btn') { if(!p1.air) { p1.dy = -18; p1.air = true; } }
                else { input.buffer = id; input.bTimer = 30; }
            }
        });
    }
});

window.addEventListener('touchmove', e => {
    for (let t of e.touches) {
        if (t.identifier === input.joyID) {
            let r = joyZone.getBoundingClientRect();
            let val = (t.clientX - (r.left + r.width/2)) / (r.width/2);
            input.x = Math.max(-1, Math.min(1, val));
            knob.style.left = (50 + input.x * 40) + "%";
            p1.dx = input.x * 10; // Apply move speed
        }
    }
});

window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) { 
        if (t.identifier === input.joyID) { p1.dx = 0; knob.style.left = "50%"; input.joyID = null; } 
    }
});

window.addEventListener('resize', resize);
</script>
</body>
</html>
