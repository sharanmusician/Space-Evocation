<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Racer | Advanced Layering</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffcc; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        #game-view { position: relative; width: 100vw; height: 100vh; }

        /* LAYER 1: THE COCKPIT PICTURE (The Base) */
        #cockpit-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Bottom Layer */
            object-fit: fill;
        }

        /* LAYER 2: THE WORKING SPEEDO */
        #speedo-mount {
            position: absolute;
            bottom: 12.8%; right: 17.5%;
            width: 90px;
            z-index: 5; /* Above Cockpit, Below Outside View */
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        #kmh-txt { color: var(--neon); font-size: 26px; text-shadow: 0 0 10px var(--neon); line-height: 1; }

        /* LAYER 3: THE OUTSIDE WORLD (3D VIEW) */
        /* We place this ABOVE the picture but use transparency to see the dash */
        #worldCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; /* Top Layer */
            pointer-events: none;
        }

        /* LAYER 4: STEERING CONTROL */
        #steering-input {
            position: absolute;
            bottom: 4%; right: 7%;
            width: 150px; height: 150px;
            z-index: 20; /* Interaction Layer */
        }
        #steering-input img { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="game-view">
    <img src="Cock.png" id="cockpit-bg">

    <div id="speedo-mount">
        <div id="kmh-txt">0</div>
        <div style="color: var(--neon); font-size: 8px; font-weight: bold; margin-top: 2px;">KM/H</div>
    </div>

    <canvas id="worldCanvas"></canvas>

    <div id="steering-input">
        <img src="wheel.png">
    </div>
</div>

<script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const speedo = document.getElementById('kmh-txt');
    const wheel = document.getElementById('steering-input');

    // Load Assets - Ensure these filenames are correct!
    const roadImg = new Image(); roadImg.src = 'road.jpg';
    const trafficImg = new Image(); trafficImg.src = 'traffic_car.png';

    let state = {
        playerX: 0,
        wheelRot: 0,
        speed: 0.06,
        roadOffset: 0,
        traffic: []
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Perspective projection aligned to your windshield frame
    function project(x, y, z) {
        const scale = 1 / z;
        // Adjusted center to align with the RHD windshield in Cock.png
        const px = (canvas.width * 0.63) + (x - state.playerX * 1500) * scale;
        const py = (canvas.height * 0.38) + (y * scale);
        return { x: px, y: py, scale: scale };
    }

    class Traffic {
        constructor() {
            this.lane = Math.floor(Math.random() * 4);
            this.laneX = -850 + (this.lane * 550);
            this.z = 45;
            this.vSpeed = 0.02 + Math.random() * 0.04;
        }
        update() { this.z -= (state.speed - this.vSpeed); }
        draw() {
            if (this.z < 0.1 || this.z > 45) return;
            const p = project(this.laneX, 350, this.z);
            const w = 650 * p.scale;
            const h = 450 * p.scale;
            if (trafficImg.complete) ctx.drawImage(trafficImg, p.x - w/2, p.y - h, w, h);
        }
    }

    // Touch Controls
    let driving = false, startA = 0;
    const getAngle = (e) => {
        const r = wheel.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    };
    wheel.ontouchstart = (e) => { driving = true; startA = getAngle(e); e.preventDefault(); };
    window.ontouchmove = (e) => {
        if (!driving) return;
        let a = getAngle(e), d = a - startA;
        if (d > 180) d -= 360; if (d < -180) d += 360;
        state.wheelRot = Math.max(-90, Math.min(90, state.wheelRot + d));
        wheel.style.transform = `rotate(${state.wheelRot}deg)`;
        startA = a;
    };
    window.ontouchend = () => driving = false;

    function loop() {
        // IMPORTANT: We use clearRect instead of fillRect 
        // to keep the dashboard visible beneath the canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        state.roadOffset = (state.roadOffset + state.speed * 90) % 100;
        state.playerX += (state.wheelRot / 90) * 0.1;
        state.playerX = Math.max(-2.6, Math.min(2.6, state.playerX));
        
        if (!driving) { state.wheelRot *= 0.85; wheel.style.transform = `rotate(${state.wheelRot}deg)`; }

        // Render Road
        for (let z = 45; z > 0.1; z -= 1.8) {
            const p = project(0, 350, z), pNext = project(0, 350, z - 1.8);
            const w = 5500 * p.scale;
            if (roadImg.complete) ctx.drawImage(roadImg, p.x - w/2, p.y, w, pNext.y - p.y);
        }

        // Handle Traffic
        if (Math.random() < 0.02 && state.traffic.length < 5) state.traffic.push(new Traffic());
        state.traffic.forEach((t, i) => {
            t.update(); t.draw();
            if (t.z < 1.1 && t.z > 0.6 && Math.abs(t.laneX - state.playerX * 1500) < 350) {
                location.reload(); 
            }
            if (t.z < 0.1) state.traffic.splice(i, 1);
        });

        // Speedo Update
        speedo.innerText = Math.round(state.speed * 1000);
        if (state.speed < 0.8) state.speed += 0.0001;

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
