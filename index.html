<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Evocation | Pro-Spec Interior</title>
    <style>
        :root {
            --panel-bg: #121214;
            --accent-glow: #00f2ff;
            --hazard-red: #ff3366;
            --dial-bg: #1a1a1d;
        }

        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Responsive 16:9 Container */
        #viewport {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            background: #000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        /* Upper Game Screen */
        #game-canvas-wrapper {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            overflow: hidden;
        }
        
        canvas { width: 100%; height: 100%; display: block; }

        /* Professional Dashboard Interior */
        #dashboard {
            height: 35%;
            background: linear-gradient(180deg, #222 0%, #111 15%, #080808 100%);
            border-top: 3px solid #333;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 10px 40px;
            gap: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Left Gauges: Fuel & Temp */
        .gauge-cluster {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .mini-gauge {
            height: 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .gauge-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* Center Console: Speedo & AC */
        .center-console {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }

        .speedometer {
            text-align: center;
            color: var(--accent-glow);
        }

        .speed-digits { font-size: 48px; font-weight: bold; text-shadow: 0 0 15px var(--accent-glow); }
        
        .ac-vents {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .vent {
            width: 60px;
            height: 30px;
            background: repeating-linear-gradient(90deg, #111, #111 5px, #222 6px);
            border: 2px solid #333;
            border-radius: 4px;
        }

        /* Right Side: Steering Tray */
        .steering-bay {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        #wheel-container {
            width: 160px;
            height: 160px;
            position: relative;
            cursor: grab;
        }

        .wheel-rim {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 14px solid #1a1a1a;
            box-shadow: inset 0 0 10px #000, 0 5px 15px rgba(0,0,0,0.5);
            background: transparent;
            position: relative;
            z-index: 5;
        }

        .wheel-spoke {
            position: absolute;
            top: 50%; left: 50%;
            width: 80%; height: 14px;
            background: #1a1a1a;
            transform: translate(-50%, -50%);
            border-radius: 4px;
        }

        .marker {
            position: absolute;
            top: -14px; left: 50%;
            width: 10px; height: 14px;
            background: var(--hazard-red);
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="dashboard">
            <div class="gauge-cluster">
                <div>
                    <label style="font-size: 10px; color: #666;">FUEL</label>
                    <div class="mini-gauge"><div id="fuel-bar" class="gauge-fill" style="width: 80%; background: #00ff66;"></div></div>
                </div>
                <div>
                    <label style="font-size: 10px; color: #666;">TEMP</label>
                    <div class="mini-gauge"><div id="temp-bar" class="gauge-fill" style="width: 40%; background: var(--hazard-red);"></div></div>
                </div>
            </div>

            <div class="center-console">
                <div class="speedometer">
                    <div class="speed-digits" id="speed-out">000</div>
                    <div style="font-size: 12px; letter-spacing: 4px;">km/h</div>
                </div>
                <div class="ac-vents">
                    <div class="vent"></div>
                    <div class="vent"></div>
                </div>
            </div>

            <div class="steering-bay">
                <div id="wheel-container">
                    <div class="marker"></div>
                    <div class="wheel-rim"></div>
                    <div class="wheel-spoke"></div>
                    <div class="wheel-spoke" style="transform: translate(-50%, -50%) rotate(90deg);"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('wheel-container');
        const speedOut = document.getElementById('speed-out');
        const fuelBar = document.getElementById('fuel-bar');

        // Professional Scaling
        function initCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        // Engine State
        let playerX = canvas.width / 2;
        let rotation = 0;
        let isDragging = false;
        let startAngle = 0;
        let score = 0;
        let fuel = 100;
        let obstacles = [];

        // Input Logic
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const ex = e.touches ? e.touches[0].clientX : e.clientX;
            const ey = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(ey - cy, ex - cx) * 180 / Math.PI;
        }

        const onStart = (e) => { isDragging = true; startAngle = getAngle(e) - rotation; e.preventDefault(); };
        const onMove = (e) => {
            if (!isDragging) return;
            rotation = getAngle(e) - startAngle;
            rotation = Math.max(-360, Math.min(360, rotation));
            wheel.style.transform = `rotate(${rotation}deg)`;
        };
        const onEnd = () => { isDragging = false; };

        wheel.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        wheel.addEventListener('touchstart', onStart, {passive:false});
        window.addEventListener('touchmove', onMove, {passive:false});
        window.addEventListener('touchend', onEnd);

        // Gameplay Logic
        function update() {
            // Steering Physics
            const sensitivity = 0.12;
            playerX += rotation * sensitivity;
            if (playerX < 20) playerX = 20;
            if (playerX > canvas.width - 20) playerX = canvas.width - 20;

            // Auto-centering
            if (!isDragging) {
                rotation *= 0.9;
                wheel.style.transform = `rotate(${rotation}deg)`;
            }

            // Dashboard Updates
            speedOut.innerText = Math.abs(Math.round(rotation * 0.8)).toString().padStart(3, '0');
            fuel -= 0.01;
            fuelBar.style.width = `${fuel}%`;

            // Obstacles
            if (Math.random() < 0.05) {
                obstacles.push({ x: Math.random() * canvas.width, y: -50, s: Math.random() * 5 + 5 });
            }

            obstacles.forEach((o, i) => {
                o.y += o.s;
                // Collision check
                if (Math.abs(o.x - playerX) < 30 && o.y > canvas.height - 60) {
                    location.reload(); 
                }
            });
            obstacles = obstacles.filter(o => o.y < canvas.height);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Player Ship (Simplified for high performance)
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";
            ctx.beginPath();
            ctx.moveTo(playerX, canvas.height - 60);
            ctx.lineTo(playerX - 20, canvas.height - 20);
            ctx.lineTo(playerX + 20, canvas.height - 20);
            ctx.fill();

            // Draw Obstacles
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ff3366";
            obstacles.forEach(o => {
                ctx.beginPath();
                ctx.arc(o.x, o.y, 15, 0, Math.PI*2);
                ctx.fill();
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
