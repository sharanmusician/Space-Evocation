<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High-Speed Highway | Pro Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --road-grey: #1a1a1a;
            --line-gold: #ffcc00;
            --ui-glow: #00f2ff;
            --car-red: #ff3366;
        }

        body { margin: 0; background: #000; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }

        /* 16:9 Viewport */
        #viewport {
            position: relative;
            width: 100vw; height: 56.25vw;
            max-height: 100vh; max-width: 177.78vh;
            background: var(--road-grey);
            display: flex; flex-direction: column;
            box-shadow: 0 0 80px rgba(0,0,0,1);
            border: 1px solid #333;
        }

        #game-area { flex: 1; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Modern Ergonomic Dashboard */
        #dashboard {
            height: 28%;
            background: linear-gradient(180deg, #151518 0%, #050505 100%);
            border-top: 3px solid #2a2a2a;
            display: grid;
            grid-template-columns: 1.2fr 2fr 1.2fr;
            padding: 5px 30px;
            box-sizing: border-box;
            position: relative;
        }

        /* Digital Telemetry */
        .telemetry { display: flex; flex-direction: column; justify-content: center; font-family: 'Share Tech Mono', monospace; color: var(--ui-glow); }
        .stat-line { font-size: 11px; margin: 2px 0; opacity: 0.8; }
        .bar-outer { width: 100px; height: 4px; background: #000; margin-top: 2px; border-radius: 2px; }
        .bar-inner { height: 100%; background: var(--ui-glow); transition: width 0.3s; }

        .center-hud { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .speedo { font-family: 'Orbitron', sans-serif; font-size: 38px; color: #fff; text-shadow: 0 0 15px var(--ui-glow); line-height: 1; }
        .ac-unit { display: flex; gap: 10px; margin-top: 10px; }
        .ac-vent { width: 45px; height: 18px; background: #0a0a0a; border: 1px solid #333; border-radius: 2px; 
                   background-image: linear-gradient(0deg, transparent 50%, #1a1a1a 50%); background-size: 100% 4px; }

        /* Compact Performance Wheel */
        .wheel-box { display: flex; align-items: center; justify-content: flex-end; }
        #wheel {
            width: 100px; height: 100px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 10px solid #111;
            box-shadow: inset 0 0 15px #000, 0 5px 15px rgba(0,0,0,0.8);
            background: repeating-conic-gradient(from 0deg, #151518 0deg 90deg, #111 90deg 180deg);
        }
        .marker { position: absolute; top: -10px; left: 50%; width: 8px; height: 12px; background: var(--car-red); transform: translateX(-50%); border-radius: 2px; }
        .hub { position: absolute; top: 50%; left: 50%; width: 25px; height: 25px; background: #222; border: 2px solid #333; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-area">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="dashboard">
            <div class="telemetry">
                <div class="stat-line">SYSTEMS: NOMINAL</div>
                <div class="stat-line">FUEL</div>
                <div class="bar-outer"><div id="fuel" class="bar-inner" style="width: 100%;"></div></div>
                <div class="stat-line" style="margin-top: 5px;">DIST: <span id="dist">0</span>m</div>
            </div>

            <div class="center-hud">
                <div class="speedo" id="speed">000</div>
                <div class="ac-unit">
                    <div class="ac-vent"></div>
                    <div class="ac-vent"></div>
                </div>
            </div>

            <div class="wheel-box">
                <div id="wheel">
                    <div class="marker"></div>
                    <div class="hub"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('wheel');
        const speedEl = document.getElementById('speed');
        const distEl = document.getElementById('dist');
        const fuelBar = document.getElementById('fuel');

        function init() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = init;
        init();

        // --- GAME ENGINE CONSTANTS ---
        const LANES = 4;
        const LANE_WIDTH = canvas.width / LANES;
        const PLAYER_SENSITIVITY = 0.18;
        const ROAD_SPEED = 12;

        let playerX = canvas.width / 2;
        let wheelAngle = 0;
        let isDragging = false;
        let startA = 0;
        let distance = 0;
        let fuel = 100;
        let roadOffset = 0;
        let traffic = [];

        // --- INPUT HANDLER ---
        function getMouseAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const start = (e) => { isDragging = true; startA = getMouseAngle(e) - wheelAngle; e.preventDefault(); };
        const move = (e) => {
            if (!isDragging) return;
            wheelAngle = getMouseAngle(e) - startA;
            wheelAngle = Math.max(-400, Math.min(400, wheelAngle));
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
        };
        const end = () => { isDragging = false; };

        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);

        // --- VEHICLE FACTORY ---
        class Vehicle {
            constructor(lane) {
                this.lane = lane;
                this.x = lane * LANE_WIDTH + (LANE_WIDTH / 2);
                this.y = -150;
                this.type = Math.random() > 0.3 ? 'CAR' : 'BUS';
                this.h = this.type === 'CAR' ? 60 : 110;
                this.w = 40;
                this.speed = 3 + Math.random() * 4;
                this.color = this.type === 'CAR' ? '#ff3366' : '#555';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h);
                // Windows/Details
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(this.x - this.w/2 + 5, this.y + 10, this.w - 10, 15);
            }
        }

        function spawnTraffic() {
            // Algorithm: Pick 1 to 3 lanes to block, always leave 1 lane clear.
            const blockedLanes = [];
            const count = Math.floor(Math.random() * 3) + 1;
            while(blockedLanes.length < count) {
                let l = Math.floor(Math.random() * LANES);
                if(!blockedLanes.includes(l)) blockedLanes.push(l);
            }
            // Logic: If we block lanes, ensure they aren't all side-by-side without a gap
            blockedLanes.forEach(lane => traffic.push(new Vehicle(lane)));
        }

        // --- MAIN LOOP ---
        let lastSpawn = 0;

        function update(time) {
            // Road Scroll
            roadOffset = (roadOffset + ROAD_SPEED) % 100;
            
            // Physics
            playerX += wheelAngle * PLAYER_SENSITIVITY;
            if (playerX < 30) playerX = 30;
            if (playerX > canvas.width - 30) playerX = canvas.width - 30;

            if (!isDragging) {
                wheelAngle *= 0.85;
                wheel.style.transform = `rotate(${wheelAngle}deg)`;
            }

            // HUD
            distance += 1;
            fuel -= 0.005;
            speedEl.innerText = Math.abs(Math.round(wheelAngle * 0.8)).toString().padStart(3, '0');
            distEl.innerText = distance;
            fuelBar.style.width = fuel + "%";

            // Traffic Logic
            if (time - lastSpawn > 1200) {
                spawnTraffic();
                lastSpawn = time;
            }

            traffic.forEach((v, i) => {
                v.y += ROAD_SPEED - v.speed; // Relative speed
                
                // Collision
                if (Math.abs(v.x - playerX) < 35 && v.y + v.h > canvas.height - 80 && v.y < canvas.height - 20) {
                    location.reload();
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 200);
        }

        function draw(time) {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Road Lanes
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -roadOffset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_WIDTH, 0);
                ctx.lineTo(i * LANE_WIDTH, canvas.height);
                ctx.stroke();
            }

            // Draw Traffic
            traffic.forEach(v => v.draw());

            // Draw Player Car
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f2ff';
            ctx.fillStyle = '#00f2ff';
            ctx.fillRect(playerX - 20, canvas.height - 80, 40, 70);
            // Windshield
            ctx.fillStyle = '#000';
            ctx.fillRect(playerX - 15, canvas.height - 70, 30, 15);

            update(time);
            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
