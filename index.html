<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: Pro Placement</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.15); --bg: #080808; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; position: fixed; font-family: sans-serif; }
        #game-container { position: absolute; inset: 0; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        canvas { width: 100%; height: 100%; display: block; }
        #hud { position: absolute; top: 30px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; pointer-events: none; z-index: 10; opacity: 0; }
        .score-box { background: var(--glass); border: 1px solid var(--border); border-radius: 4px; width: 45px; height: 35px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
        #timer { color: #fff; font-size: 28px; font-weight: 800; width: 80px; text-align: center; }
        #joy-zone { position: absolute; bottom: 30px; left: 30px; width: 160px; height: 50px; z-index: 20; background: var(--glass); border: 1px solid var(--border); border-radius: 6px; opacity: 0; }
        #knob { position: absolute; width: 30px; height: 40px; background: #fff; border-radius: 2px; transform: translate(-50%, -50%); pointer-events: none; }
        #act-zone { position: absolute; bottom: 30px; right: 30px; width: 240px; height: 110px; z-index: 20; opacity: 0; }
        .btn { position: absolute; background: var(--glass); border: 1px solid var(--border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 10px; letter-spacing: 1px; border-radius: 6px;}
        .btn.active { background: #fff; color: #000; }
        #spike { width: 75px; height: 50px; top: 0; right: 0; }
        #lob { width: 75px; height: 50px; top: 0; right: 85px; }
        #jump { width: 160px; height: 50px; bottom: 0; right: 0; font-weight: 800; }
        #overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #start-btn { padding: 25px 50px; background: #fff; color: #000; border: none; border-radius: 4px; font-weight: 900; font-size: 18px; letter-spacing: 5px; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="overlay"><button id="start-btn">KICKOFF</button></div>
    <div id="hud"><div class="score-box" id="s-c">0</div><div id="timer">01:00</div><div class="score-box" id="s-u">0</div></div>
    <canvas id="canvas"></canvas>
    <div id="joy-zone"></div><div id="knob"></div>
    <div id="act-zone">
        <div class="btn" id="spike">STRIKE</div>
        <div class="btn" id="lob">LOB</div>
        <div class="btn" id="jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
let W, H, G_Y, NET, state = { u: 0, c: 0, active: false, time: 60 };
const inputs = { moveX: 0, spike: false, lob: false, buffer: 0, joyID: null };

document.getElementById('start-btn').addEventListener('click', function() {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    state.active = true;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('hud').style.opacity = 1;
    document.getElementById('joy-zone').style.opacity = 1;
    document.getElementById('act-zone').style.opacity = 1;
    resize(); ball.spawn();
    setInterval(() => { if(state.time > 0 && state.active) { state.time--; document.getElementById('timer').innerText = `00:${state.time.toString().padStart(2, '0')}`; } }, 1000);
    requestAnimationFrame(loop);
});

function resize() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 50; NET = { x: W/2, y: G_Y - 80, w: 2, h: 80 };
    updateKnobUI(0); p1.reset(); cpu.reset();
}

function updateKnobUI(val) {
    const r = joyZone.getBoundingClientRect();
    knob.style.left = (r.left + r.width/2 + val * (r.width/2 - 20)) + "px";
    knob.style.top = (r.top + r.height/2) + "px";
}

window.addEventListener('touchstart', e => {
    const rJ = joyZone.getBoundingClientRect();
    const btns = { spike: document.getElementById('spike').getBoundingClientRect(), lob: document.getElementById('lob').getBoundingClientRect(), jump: document.getElementById('jump').getBoundingClientRect() };
    for (let t of e.changedTouches) {
        if (t.clientX > rJ.left && t.clientX < rJ.right && t.clientY > rJ.top && t.clientY < rJ.bottom) inputs.joyID = t.identifier;
        for (let k in btns) {
            const b = btns[k];
            if (t.clientX > b.left && t.clientX < b.right && t.clientY > b.top && t.clientY < b.bottom) {
                inputs[k] = true;
                if (k === 'jump' && !p1.air) { p1.dy = -19; p1.air = true; }
                if (k !== 'jump') inputs.buffer = 12;
                document.getElementById(k).classList.add('active');
            }
        }
    }
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (!state.active) return;
    const rJ = joyZone.getBoundingClientRect();
    for (let t of e.touches) {
        if (t.identifier === inputs.joyID) {
            inputs.moveX = Math.max(-1, Math.min(1, (t.clientX - (rJ.left + rJ.width/2)) / (rJ.width/2 - 20)));
            updateKnobUI(inputs.moveX);
        }
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) {
        if (t.identifier === inputs.joyID) { inputs.joyID = null; inputs.moveX = 0; updateKnobUI(0); }
        ['spike', 'lob', 'jump'].forEach(k => {
            const b = document.getElementById(k).getBoundingClientRect();
            if (t.clientX > b.left && t.clientX < b.right && t.clientY > b.bottom - 60) { // Specific jump button check
                inputs[k] = false; document.getElementById(k).classList.remove('active');
            } else {
                inputs[k] = false; document.getElementById(k).classList.remove('active');
            }
        });
    }
});

class Athlete {
    constructor(side, color) { this.side = side; this.color = color; this.h = 40; this.cpuSkill = null; }
    reset() { 
        // BACK-COURT SPAWNING
        this.x = (this.side === 'right') ? W * 0.85 : W * 0.15; 
        this.y = G_Y - this.h; this.dx = this.dy = 0; this.air = false; this.anim = 0; 
    }
    update() {
        this.dx = (this === p1) ? inputs.moveX * 9.5 : this.cpuDX;
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.h) this.dy += 1.5;
        else { this.y = G_Y - this.h; this.dy = 0; this.air = false; }
        const limit = NET.x + (this.side === 'right' ? 18 : -18);
        this.x = (this.side === 'right') ? Math.max(limit, Math.min(W-20, this.x)) : Math.min(limit, Math.max(20, this.x));
        this.anim += Math.abs(this.dx) * 0.2;
    }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y); if(this.side === 'right') ctx.scale(-1, 1);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        let walk = Math.sin(this.anim) * 6;
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(walk, 40); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-walk, 40); ctx.stroke();
        ctx.fillStyle = this.color; ctx.fillRect(-6, 6, 12, 22);
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
        let s = (this === p1) ? (inputs.spike ? 'spike' : (inputs.lob || inputs.buffer > 0 ? 'lob' : null)) : this.cpuSkill;
        ctx.beginPath();
        if(s === 'spike') { ctx.moveTo(6, 6); ctx.lineTo(20, -12); }
        else if(s === 'lob') { ctx.moveTo(6, 10); ctx.lineTo(25, 35); }
        else { ctx.moveTo(3, 10); ctx.lineTo(3, 30); }
        ctx.stroke(); ctx.restore();
    }
}

const ball = {
    r: 9, dx: 0, dy: 0, x: 0, y: 0, lock: 0,
    spawn() { this.y = H * 0.3; this.dx = 0; this.dy = 0; this.x = (state.u > state.c) ? W*0.3 : W*0.7; this.lock = 0; },
    update() {
        if(this.lock > 0) this.lock--;
        this.dy += 0.22; // SLOW FLOAT PHYSICS
        this.x += this.dx; this.y += this.dy;
        if (this.y < 25) { this.y = 25; this.dy = Math.abs(this.dy) * 0.2; } 
        if(this.y >= G_Y - this.r) {
            this.y = G_Y - this.r; if(Math.abs(this.dy) > 2) this.dy *= -0.5;
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); p1.reset(); cpu.reset(); }
        }
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx = -this.dx * 0.1;
            this.dy *= 0.3;
            this.x = (this.x < NET.x) ? NET.x - (NET.w/2 + this.r + 2) : NET.x + (NET.w/2 + this.r + 2);
        }
    },
    draw() { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); }
};

const p1 = new Athlete('right', '#fff'), cpu = new Athlete('left', '#444');

function loop() {
    if(!state.active) return;
    ctx.clearRect(0,0,W,H);
    if(inputs.buffer > 0) inputs.buffer--;
    ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(0, G_Y, W, 1);
    ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);
    
    // SMART AI TIMING
    let ballDist = ball.x - cpu.x;
    if (ball.x < NET.x) {
        cpu.cpuDX = ballDist > 12 ? 7 : ballDist < -12 ? -7 : 0;
        
        // JUMP LOGIC: Only jump if close horizontally AND ball is falling within reach
        if (Math.abs(ballDist) < 50 && ball.dy > 0 && ball.y > G_Y - 180 && ball.y < G_Y - 80) {
            if (!cpu.air) { 
                cpu.dy = -17; 
                cpu.air = true; 
            }
        }

        if (Math.abs(ballDist) < 60) {
            let rnd = Math.random();
            if (cpu.air && ball.y < cpu.y) cpu.cpuSkill = (rnd > 0.5) ? 'spike' : 'lob';
            else cpu.cpuSkill = (rnd > 0.8) ? 'lob' : null;
        } else {
            cpu.cpuSkill = null;
        }
    } else {
        let homeX = W * 0.15; // Return to far back
        cpu.cpuDX = (cpu.x < homeX - 10) ? 5 : (cpu.x > homeX + 10) ? -5 : 0;
        cpu.cpuSkill = null;
    }
    
    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let act = (p === p1) ? (inputs.spike ? 'spike' : (inputs.lob || inputs.buffer > 0 ? 'lob' : null)) : p.cpuSkill;
        let hb = { x1: p.x - 32, x2: p.x + 32, y1: p.y - 25, y2: p.y + 55 };
        
        if(ball.x > hb.x1 && ball.x < hb.x2 && ball.y > hb.y1 && ball.y < hb.y2 && ball.lock === 0) {
            ball.lock = 18;
            const hitDir = (ball.x < p.x) ? -1 : 1; 
            
            if(act === 'spike') { ball.dx = hitDir * 11; ball.dy = 5.5; }
            else if(act === 'lob') { ball.dx = hitDir * 4.2; ball.dy = -15.5; }
            else { ball.dx = hitDir * 3.8; ball.dy = -4.8; }
            
            inputs.buffer = 0;
        }
    });
    
    ball.update(); ball.draw();
    document.getElementById('s-u').innerText = state.u;
    document.getElementById('s-c').innerText = state.c;
    requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
window.onload = resize;
</script>
</body>
</html>
