<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Head Ball Mobile Recreation</title>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { margin: 0; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Landscape Force / Warning */
        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex; }
            #game-container { display: none; }
        }
        @media screen and (orientation: landscape) {
            #rotate-warning { display: none; }
            #game-container { display: flex; }
        }

        #rotate-warning {
            position: fixed; inset: 0; background: #222; color: white;
            flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 100;
        }

        #game-container {
            width: 100vw; height: 100vh; flex-direction: column; position: relative;
        }

        canvas { background: linear-gradient(#1e90ff, #87CEEB); width: 100%; height: 70%; touch-action: none; }

        /* UI Overlays */
        #score-board {
            position: absolute; top: 10px; width: 100%; display: flex; 
            justify-content: center; gap: 40px; color: white; font-size: 2rem; font-weight: 900;
        }

        /* Control Panel */
        #controls {
            height: 30%; background: #333; display: flex; justify-content: space-between; align-items: center; padding: 0 40px;
        }

        .btn-group { display: flex; gap: 20px; }
        .control-btn {
            width: 80px; height: 80px; background: #555; border: 4px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;
            font-size: 1.2rem; active-state: brightness(1.5);
        }
        .control-btn:active { background: #888; transform: scale(0.95); }
        .jump-btn { background: #ff4757; width: 100px; height: 100px; }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <h1>🔄</h1>
        <p>Please rotate your device to Landscape to play</p>
    </div>

    <div id="game-container">
        <div id="score-board">
            <div id="cpuScore">0</div>
            <span>VS</span>
            <div id="playerScore">0</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="controls">
            <div class="btn-group">
                <div class="control-btn" id="btnLeft">←</div>
                <div class="control-btn" id="btnRight">→</div>
            </div>

            <div class="btn-group">
                <div class="control-btn jump-btn" id="btnJump">JUMP</div>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Set canvas resolution for wide screen
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.7;
}
window.addEventListener('resize', resize);
resize();

const GRAVITY = 0.5;
const GROUND_Y = canvas.height - 20;

let scores = { cpu: 0, player: 0 };
let input = { left: false, right: false, jump: false };

class Player {
    constructor(x, color, isPlayer) {
        this.x = x;
        this.y = GROUND_Y - 40;
        this.radius = 35;
        this.color = color;
        this.dx = 0;
        this.dy = 0;
        this.isJumping = false;
        this.isPlayer = isPlayer;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
        
        // Eye (direction)
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x + (this.isPlayer ? -15 : 15), this.y - 10, 8, 0, Math.PI * 2);
        ctx.fill();
    }

    update() {
        this.x += this.dx;
        this.y += this.dy;

        if (this.y + this.radius < GROUND_Y) {
            this.dy += GRAVITY;
        } else {
            this.dy = 0;
            this.y = GROUND_Y - this.radius;
            this.isJumping = false;
        }

        // Keep in bounds
        if (this.x < this.radius) this.x = this.radius;
        if (this.x > canvas.width - this.radius) this.x = canvas.width - this.radius;
    }
}

class Ball {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = canvas.width / 2;
        this.y = 50;
        this.dx = 0;
        this.dy = 0;
        this.radius = 15;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        ctx.stroke();
    }
    update() {
        this.dy += 0.3;
        this.x += this.dx;
        this.y += this.dy;

        // Ground bounce
        if (this.y + this.radius > GROUND_Y) {
            this.y = GROUND_Y - this.radius;
            this.dy *= -0.6;
        }
        // Goal Check (Left is CPU, Right is Player)
        if (this.x < 10 && this.y > GROUND_Y - 100) { scores.player++; this.reset(); }
        if (this.x > canvas.width - 10 && this.y > GROUND_Y - 100) { scores.cpu++; this.reset(); }
        
        // Wall bounce
        if (this.x < 0 || this.x > canvas.width) this.dx *= -1;
    }
}

const p1 = new Player(canvas.width - 100, "#ff4757", true); // Player (Right)
const cpu = new Player(100, "#2f3542", false); // CPU (Left)
const ball = new Ball();

// --- TOUCH CONTROLS ---
const setupBtn = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
};
setupBtn('btnLeft', 'left');
setupBtn('btnRight', 'right');
setupBtn('btnJump', 'jump');

function checkCollision(p) {
    let dist = Math.hypot(p.x - ball.x, p.y - ball.y);
    if (dist < p.radius + ball.radius) {
        ball.dx = (ball.x - p.x) * 0.3;
        ball.dy = (ball.y - p.y) * 0.3 - 5;
    }
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Grass/Goals
    ctx.fillStyle = "#2ed573";
    ctx.fillRect(0, GROUND_Y, canvas.width, 20);
    ctx.fillStyle = "white";
    ctx.fillRect(0, GROUND_Y - 100, 10, 100); // CPU Goal
    ctx.fillRect(canvas.width - 10, GROUND_Y - 100, 10, 100); // Player Goal

    // Player Movement
    p1.dx = 0;
    if (input.left) p1.dx = -6;
    if (input.right) p1.dx = 6;
    if (input.jump && !p1.isJumping) { p1.dy = -12; p1.isJumping = true; }

    // CPU AI logic
    if (ball.x < cpu.x + 40) cpu.dx = -4;
    else if (ball.x > cpu.x + 60) cpu.dx = 4;
    else cpu.dx = 0;
    if (ball.y < cpu.y && Math.abs(ball.x - cpu.x) < 50 && !cpu.isJumping) {
        cpu.dy = -12; cpu.isJumping = true;
    }

    p1.update();
    cpu.update();
    ball.update();
    checkCollision(p1);
    checkCollision(cpu);

    p1.draw();
    cpu.draw();
    ball.draw();

    document.getElementById('cpuScore').innerText = scores.cpu;
    document.getElementById('playerScore').innerText = scores.player;

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
