<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traffic Racer | The Escape</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --danger: #ff3366; --road: #111113; }
        body { margin: 0; background: #000; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }

        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: var(--road);
            display: flex; flex-direction: column;
            border: 2px solid #333;
        }

        #game-view { flex: 1; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        #dashboard {
            height: 32%;
            background: linear-gradient(180deg, #1c1c21 0%, #050505 100%);
            border-top: 4px solid #2a2a2a;
            padding: 15px;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .dash-top { display: flex; justify-content: space-between; align-items: center; }
        .hud-text { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 12px; }
        .speed-val { font-family: 'Orbitron', sans-serif; font-size: 42px; color: #fff; text-shadow: 0 0 15px var(--neon); line-height: 1; }

        #steering-wheel {
            width: 105px; height: 105px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 12px solid #1a1a1c;
            background: radial-gradient(circle, #2a2a2e 0%, #111 80%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 10px #000;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 10px; background: #1a1a1c; transform: translateY(-50%); border-radius: 5px; }
        .top-marker { position: absolute; top: -12px; left: 50%; width: 10px; height: 12px; background: var(--danger); transform: translateX(-50%); }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view"><canvas id="gameCanvas"></canvas></div>
        <div id="dashboard">
            <div class="dash-top">
                <div class="hud-text">SCORE<div id="score-val" style="color: #fff; font-size: 18px;">0</div></div>
                <div style="text-align: center;">
                    <div id="kmh" class="speed-val">00</div>
                    <div style="font-size: 8px; color: #555; font-family: Orbitron; letter-spacing: 2px;">KM/H</div>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; align-items: center;">
                <div id="steering-wheel">
                    <div class="top-marker"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const kmhDisp = document.getElementById('kmh');
        const scoreDisp = document.getElementById('score-val');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const LANES = 4;
        const LANE_W = canvas.width / LANES;
        const STEER_LIMIT = 90; 
        
        let gameSpeed = 3; 
        const MAX_SPEED = 28;
        const ACCEL = 0.007;

        let playerX = canvas.width / 2;
        let rotation = 0;
        let lastAngle = 0;
        let isDragging = false;
        
        let traffic = [];
        let roadOffset = 0;
        let score = 0;

        // --- STEERING CORE (Fixed Delta) ---
        function getRawAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const start = (e) => { isDragging = true; lastAngle = getRawAngle(e); e.preventDefault(); };
        const move = (e) => {
            if (!isDragging) return;
            const currentAngle = getRawAngle(e);
            let delta = currentAngle - lastAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            rotation = Math.max(-STEER_LIMIT, Math.min(STEER_LIMIT, rotation + delta));
            wheel.style.transform = `rotate(${rotation}deg)`;
            lastAngle = currentAngle;
        };

        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', () => isDragging = false);
        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', () => isDragging = false);

        // --- TRAFFIC RACER AI ---
        class Vehicle {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_W) + (LANE_W / 2);
                this.y = -200;
                this.w = 34;
                this.h = 75;
                this.vSpeed = 3 + Math.random() * 5;
                this.hue = Math.random() * 360;
                
                // Behavior: 0 = Lane discipline, 1 = Aggressive swerver
                this.behavior = Math.random() > 0.7 ? 1 : 0;
                this.targetX = this.x;
                this.swerveTimer = 100 + Math.random() * 200;
            }
            draw() {
                ctx.fillStyle = this.behavior === 1 ? "#ff3300" : `hsl(${this.hue}, 40%, 45%)`;
                ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h);
                // Windows
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(this.x - 12, this.y + 12, 24, 20);
                // Brake lights
                ctx.fillStyle = "#600";
                ctx.fillRect(this.x - 15, this.y + this.h - 5, 8, 3);
                ctx.fillRect(this.x + 7, this.y + this.h - 5, 8, 3);
            }
            update(gSpeed) {
                this.y += (gSpeed - this.vSpeed);
                
                if (this.behavior === 1) {
                    this.swerveTimer--;
                    if (this.swerveTimer <= 0) {
                        // Switch to a random adjacent lane to cut off the player
                        let dir = Math.random() > 0.5 ? 1 : -1;
                        if (this.lane + dir >= 0 && this.lane + dir < LANES) {
                            this.lane += dir;
                            this.targetX = (this.lane * LANE_W) + (LANE_W / 2);
                        }
                        this.swerveTimer = 150 + Math.random() * 150;
                    }
                }
                // Smooth steering for the AI
                this.x += (this.targetX - this.x) * 0.06;
            }
        }

        function spawn() {
            let availableLanes = [0, 1, 2, 3].filter(l => !traffic.some(v => v.lane === l && v.y < 150));
            if (availableLanes.length > 0) {
                let count = Math.min(availableLanes.length - 1, Math.floor(Math.random() * 2) + 1);
                let lanes = availableLanes.sort(() => Math.random() - 0.5).slice(0, count);
                lanes.forEach(l => traffic.push(new Vehicle(l)));
            }
        }

        let lastSpawn = 0;
        function loop(t) {
            if (gameSpeed < MAX_SPEED) gameSpeed += ACCEL;
            roadOffset = (roadOffset + gameSpeed) % 100;
            
            // Player movement controlled by steering wheel
            playerX += (rotation / STEER_LIMIT) * 12; 
            playerX = Math.max(25, Math.min(canvas.width - 25, playerX));

            // Auto-straighten if not touching
            if (!isDragging) { rotation *= 0.88; wheel.style.transform = `rotate(${rotation}deg)`; }

            kmhDisp.innerText = Math.round(gameSpeed * 11).toString().padStart(2, '0');
            score += Math.floor(gameSpeed / 5);
            scoreDisp.innerText = score;

            if (t - lastSpawn > (1400 - gameSpeed * 40)) { spawn(); lastSpawn = t; }

            traffic.forEach(v => {
                v.update(gameSpeed);
                // Hit Detection
                if (Math.abs(v.x - playerX) < 28 && v.y + v.h > canvas.height - 115 && v.y < canvas.height - 40) {
                    location.reload(); // Crash & Restart
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 300);

            // DRAWING
            ctx.fillStyle = "#151517";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Highway Lanes
            ctx.strokeStyle = "#2a2a2d";
            ctx.setLineDash([40, 60]);
            ctx.lineDashOffset = -roadOffset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath(); ctx.moveTo(i * LANE_W, 0); ctx.lineTo(i * LANE_W, canvas.height); ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // Player Car
            ctx.shadowBlur = 20; ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";
            ctx.fillRect(playerX - 17, canvas.height - 110, 34, 70);
            ctx.shadowBlur = 0; ctx.fillStyle = "#000";
            ctx.fillRect(playerX - 13, canvas.height - 100, 26, 18);

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
