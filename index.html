<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Evocation | Mobile Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cockpit-grey: #1a1a1d;
            --led-blue: #00f2ff;
            --warning-red: #ff3366;
            --glass-sheen: rgba(255, 255, 255, 0.05);
        }

        body { 
            margin: 0; 
            background: #000; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        /* 16:9 Viewport Container */
        #viewport {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            background: #050505;
            display: flex;
            flex-direction: column;
            border: 2px solid #222;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        /* Game Screen Area */
        #screen {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* Professional Mobile Dashboard */
        #dashboard {
            height: 30%;
            background: linear-gradient(180deg, #111 0%, #080808 100%);
            border-top: 4px solid #333;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            padding: 5px 20px;
            gap: 10px;
            box-sizing: border-box;
            z-index: 100;
        }

        /* Gauges: Fuel & Temp */
        .cluster-left { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
        .gauge-unit { font-family: 'Orbitron', sans-serif; font-size: 8px; color: #444; letter-spacing: 1px; }
        .gauge-container { width: 80px; height: 6px; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid #222; }
        .gauge-val { height: 100%; transition: width 0.3s; }

        /* Center Console: Speedo & AC */
        .cluster-center { display: flex; flex-direction: column; align-items: center; justify-content: space-around; }
        .speedo { text-align: center; color: var(--led-blue); }
        .speed-val { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; text-shadow: 0 0 10px var(--led-blue); }
        
        .ac-vents { display: flex; gap: 8px; }
        .vent { width: 40px; height: 20px; background: #111; border: 1px solid #333; border-radius: 2px;
                background-image: linear-gradient(180deg, #222 2px, transparent 2px); background-size: 100% 6px; }

        /* Compact Performance Steering Wheel */
        .cluster-right { display: flex; align-items: center; justify-content: flex-end; }
        #wheel-root {
            width: 110px;
            height: 110px;
            position: relative;
            cursor: grab;
            user-select: none;
        }
        .wheel-rim {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 12px solid #1a1a1a;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 0 10px #000;
            background: transparent;
            position: relative;
            z-index: 5;
        }
        .wheel-hub {
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
            background: #222; border: 2px solid #333; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 10px; background: #1a1a1a; transform: translateY(-50%); border-radius: 2px; }
        .marker { position: absolute; top: -12px; left: 50%; width: 8px; height: 12px; background: var(--warning-red); transform: translateX(-50%); z-index: 15; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="screen">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="dashboard">
            <div class="cluster-left">
                <div class="gauge-unit">FUEL</div>
                <div class="gauge-container"><div id="fuel-bar" class="gauge-val" style="width: 100%; background: #00ff66;"></div></div>
                <div class="gauge-unit">ENGINE TEMP</div>
                <div class="gauge-container"><div id="temp-bar" class="gauge-val" style="width: 45%; background: var(--warning-red);"></div></div>
            </div>

            <div class="cluster-center">
                <div class="speedo">
                    <div class="speed-val" id="speed-text">0</div>
                    <div style="font-size: 8px; letter-spacing: 2px; color: #444;">KM/H</div>
                </div>
                <div class="ac-vents">
                    <div class="vent"></div>
                    <div class="vent"></div>
                </div>
            </div>

            <div class="cluster-right">
                <div id="wheel-root">
                    <div class="marker"></div>
                    <div class="wheel-rim">
                        <div class="spoke"></div>
                        <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                        <div class="wheel-hub"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('wheel-root');
        const speedText = document.getElementById('speed-text');
        const fuelBar = document.getElementById('fuel-bar');

        // Professional Rendering Resolution
        function init() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = init;
        init();

        // System Constants
        const STEERING_GAIN = 0.25; // Dr. Driving fast response
        const MAX_VELOCITY = 35;
        const FRICTION = 0.85; // Auto-centering strength

        // Game State
        let playerX = canvas.width / 2;
        let angle = 0;
        let dragging = false;
        let startAngle = 0;
        let fuel = 100;
        let score = 0;
        let obstacles = [];

        // Advanced Math for Steering Input
        function calcAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const inputStart = (e) => { dragging = true; startAngle = calcAngle(e) - angle; e.preventDefault(); };
        const inputMove = (e) => {
            if (!dragging) return;
            angle = calcAngle(e) - startAngle;
            angle = Math.max(-450, Math.min(450, angle)); // Clamp 1.25 turns
            wheel.style.transform = `rotate(${angle}deg)`;
        };
        const inputEnd = () => { dragging = false; };

        wheel.addEventListener('mousedown', inputStart);
        window.addEventListener('mousemove', inputMove);
        window.addEventListener('mouseup', inputEnd);
        wheel.addEventListener('touchstart', inputStart, {passive: false});
        window.addEventListener('touchmove', inputMove, {passive: false});
        window.addEventListener('touchend', inputEnd);

        // Optimized Physics Engine
        function tick() {
            // Steering Physics
            let velocity = angle * STEERING_GAIN;
            velocity = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocity));
            playerX += velocity;

            if (playerX < 20) playerX = 20;
            if (playerX > canvas.width - 20) playerX = canvas.width - 20;

            // Auto-centering Logic
            if (!dragging) {
                angle *= FRICTION;
                wheel.style.transform = `rotate(${angle}deg)`;
            }

            // HUD Refresh
            speedText.innerText = Math.abs(Math.round(velocity * 1.5));
            fuel -= 0.005;
            fuelBar.style.width = fuel + "%";

            // Spawn Obstacles (Asteroids)
            if (Math.random() < 0.08) {
                obstacles.push({
                    x: Math.random() * canvas.width,
                    y: -40,
                    size: 20 + Math.random() * 30,
                    speed: 8 + Math.random() * 5
                });
            }

            obstacles.forEach((obs, i) => {
                obs.y += obs.speed;
                // Collision check (Ship is roughly 40px wide)
                if (Math.abs(obs.x - playerX) < (obs.size / 2 + 15) && obs.y > canvas.height - 50) {
                    location.reload(); // Quick reset for mobile
                }
            });
            obstacles = obstacles.filter(o => o.y < canvas.height);
        }

        function render() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Parallax Stars
            ctx.fillStyle = "#333";
            for(let i=0; i<15; i++) {
                ctx.fillRect((Math.random() * canvas.width), (Math.random() * canvas.height), 2, 2);
            }

            // Draw Ship (Pro Neon Triangle)
            ctx.shadowBlur = 15;
            ctx.shadowColor = var(--led-blue);
            ctx.fillStyle = var(--led-blue);
            ctx.beginPath();
            ctx.moveTo(playerX, canvas.height - 50);
            ctx.lineTo(playerX - 18, canvas.height - 15);
            ctx.lineTo(playerX + 18, canvas.height - 15);
            ctx.fill();

            // Draw Obstacles
            ctx.shadowBlur = 0;
            ctx.fillStyle = var(--warning-red);
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.size/2, 0, Math.PI*2);
                ctx.fill();
            });

            tick();
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
