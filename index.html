<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Prototype - Cockpit Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; touch-action: none; }
        #stage { position: relative; width: 100vw; height: 100vh; }

        /* LAYER 1: 3D WORLD (BOXES) */
        #world {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Sits behind the Cock.png */
        }

        /* LAYER 2: SPEEDO (ALIGNED TO DASH HOLE) */
        #dash-speedo {
            position: absolute;
            bottom: 12.8%; right: 17.6%;
            width: 90px;
            z-index: 2; /* Visible through Cock.png hole */
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        #kmh { color: #00ffcc; font-size: 26px; text-shadow: 0 0 10px #00ffcc; line-height: 1; }

        /* LAYER 3: YOUR COCKPIT (THE PNG) */
        #cockpit-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; /* The main frame */
            object-fit: fill;
            pointer-events: none;
        }

        /* LAYER 4: STEERING WHEEL (BOX PLACEHOLDER) */
        #wheel-ui {
            position: absolute;
            bottom: 5%; right: 8%;
            width: 130px; height: 130px;
            z-index: 20;
            background: rgba(0, 255, 204, 0.2);
            border: 4px dashed #00ffcc;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #00ffcc; font-family: sans-serif; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="stage">
    <canvas id="world"></canvas>

    <div id="dash-speedo">
        <div id="kmh">000</div>
        <div style="color: #00ffcc; font-size: 8px; font-weight: bold;">KM/H</div>
    </div>

    <img src="Cock.png" id="cockpit-frame">

    <div id="wheel-ui" id="control">STEER</div>
</div>

<script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const speedoTxt = document.getElementById('kmh');
    const steering = document.getElementById('wheel-ui');

    let playerX = 0, wheelRot = 0, speed = 0.05, roadOff = 0, traffic = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function project(x, y, z) {
        const scale = 1 / z;
        const px = (canvas.width * 0.63) + (x - playerX * 1400) * scale;
        const py = (canvas.height * 0.38) + (y * scale);
        return { x: px, y: py, scale: scale };
    }

    class Obstacle {
        constructor() {
            this.lane = Math.floor(Math.random() * 4);
            this.laneX = -800 + (this.lane * 530);
            this.z = 40;
        }
        update() { this.z -= (speed * 0.8); }
        draw() {
            if (this.z < 0.2) return;
            const p = project(this.laneX, 350, this.z);
            const size = 500 * p.scale;
            ctx.fillStyle = "red";
            ctx.fillRect(p.x - size/2, p.y - size, size, size);
        }
    }

    // Steering logic
    let active = false, lastA = 0;
    const getA = (e) => {
        const r = steering.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    };
    steering.onmousedown = steering.ontouchstart = (e) => { active = true; lastA = getA(e); e.preventDefault(); };
    window.onmousemove = window.ontouchmove = (e) => {
        if (!active) return;
        let a = getA(e), d = a - lastA;
        if (d > 180) d -= 360; if (d < -180) d += 360;
        wheelRot = Math.max(-90, Math.min(90, wheelRot + d));
        steering.style.transform = `rotate(${wheelRot}deg)`;
        lastA = a;
    };
    window.onmouseup = window.ontouchend = () => active = false;

    function loop() {
        // Draw the horizon/ground
        ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        playerX += (wheelRot / 90) * 0.08;
        if (!active) { wheelRot *= 0.85; steering.style.transform = `rotate(${wheelRot}deg)`; }

        // DRAW 3D ROAD BOXES (Gray segments)
        for (let z = 40; z > 0.1; z -= 2) {
            const p = project(0, 350, z), pNext = project(0, 350, z - 2);
            const w = 4000 * p.scale;
            ctx.fillStyle = (Math.floor(z + (Date.now()/100)) % 2 == 0) ? "#333" : "#222";
            ctx.fillRect(p.x - w/2, p.y, w, pNext.y - p.y);
        }

        // TRAFFIC BOXES
        if (Math.random() < 0.02) traffic.push(new Obstacle());
        traffic.forEach((v, i) => {
            v.update(); v.draw();
            if (v.z < 1.0 && v.z > 0.5 && Math.abs(v.laneX - playerX * 1400) < 300) {
                location.reload(); 
            }
            if (v.z < 0.1) traffic.splice(i, 1);
        });

        // UPDATE SPEEDO
        speedoTxt.innerText = Math.round(speed * 1200);
        if (speed < 0.7) speed += 0.0001;

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
