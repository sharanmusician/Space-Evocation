<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traffic Racer Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --danger: #ff3366;
            --asphalt: #1a1a1c;
        }

        body { 
            margin: 0; background: #000; 
            height: 100vh; width: 100vw; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none; 
        }

        /* 9:16 Portrait Container */
        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: var(--asphalt);
            display: flex; flex-direction: column;
            border: 2px solid #333;
        }

        #game-view { flex: 1; position: relative; overflow: hidden; background: #111; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Professional Dashboard */
        #dashboard {
            height: 32%;
            background: linear-gradient(180deg, #1c1c21 0%, #050505 100%);
            border-top: 5px solid #2a2a2a;
            padding: 15px;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .dash-top { display: flex; justify-content: space-between; align-items: center; }
        .hud-text { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 12px; }
        
        .speed-unit { text-align: center; font-family: 'Orbitron', sans-serif; color: #fff; }
        .speed-val { font-size: 42px; line-height: 1; text-shadow: 0 0 15px var(--neon); }

        .dash-bottom { display: flex; justify-content: space-between; align-items: flex-end; }

        /* The 90° Locked Steering Wheel */
        #steering-wheel {
            width: 100px; height: 100px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 11px solid #1a1a1c;
            background: radial-gradient(circle, #2a2a2e 0%, #111 80%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 10px #000;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 10px; background: #1a1a1c; transform: translateY(-50%); border-radius: 5px; }
        .top-marker { position: absolute; top: -11px; left: 50%; width: 10px; height: 11px; background: var(--danger); transform: translateX(-50%); }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view"><canvas id="gameCanvas"></canvas></div>

        <div id="dashboard">
            <div class="dash-top">
                <div class="hud-text">
                    SCORE
                    <div id="score-val" style="color: #fff; font-size: 18px;">0</div>
                </div>
                <div class="speed-unit">
                    <div id="kmh" class="speed-val">00</div>
                    <div style="font-size: 9px; letter-spacing: 3px; color: #555;">KM/H</div>
                </div>
            </div>

            <div class="dash-bottom">
                <div style="display: flex; gap: 8px;">
                    <div style="width: 30px; height: 15px; background: #111; border: 1px solid #222;"></div>
                    <div style="width: 30px; height: 15px; background: #111; border: 1px solid #222;"></div>
                </div>
                <div id="steering-wheel">
                    <div class="top-marker"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const kmhDisp = document.getElementById('kmh');
        const scoreDisp = document.getElementById('score-val');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- TRAFFIC RACER CONFIG ---
        const LANES = 4;
        const LANE_W = canvas.width / LANES;
        const STEER_LIMIT = 90; // Clamp at 90 degrees
        
        let gameSpeed = 3; 
        const MAX_SPEED = 24;
        const ACCEL = 0.007;

        let playerX = canvas.width / 2;
        let visualRot = 0;   // Visual clamped position
        let thumbPos = 0;    // Real thumb rotation tracking
        let isDragging = false;
        let startAngle = 0;
        
        let traffic = [];
        let roadOffset = 0;
        let score = 0;

        // --- INPUT ENGINE ---
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const start = (e) => { isDragging = true; startAngle = getAngle(e) - thumbPos; e.preventDefault(); };
        const move = (e) => {
            if (!isDragging) return;
            thumbPos = getAngle(e) - startAngle;
            // Visual Lock: Stop at 90, but track thumb beyond so it reverses instantly
            visualRot = Math.max(-STEER_LIMIT, Math.min(STEER_LIMIT, thumbPos));
            wheel.style.transform = `rotate(${visualRot}deg)`;
        };
        const end = () => { isDragging = false; };

        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);
        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        // --- VEHICLE SYSTEM ---
        class NPC {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_W) + (LANE_W / 2);
                this.y = -150;
                this.w = 34;
                this.h = 68;
                this.vSpeed = 4 + Math.random() * 6; // Slower than player
                this.hue = Math.random() * 360;
            }
            draw() {
                ctx.fillStyle = `hsl(${this.hue}, 50%, 45%)`;
                ctx.fillRect(this.x - this.w/2, this.y, this.h/2, this.h); // Swap w/h slightly for car look
                // Roof & Window
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(this.x - 12, this.y + 12, 24, 20);
                // Brake Lights
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(this.x - 15, this.y + this.h - 5, 8, 3);
                ctx.fillRect(this.x + 7, this.y + this.h - 5, 8, 3);
            }
        }

        function spawn() {
            // Traffic Racer Logic: Spawn 1-3 vehicles, ensuring a lane is open
            let count = Math.floor(Math.random() * 3) + 1;
            let lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, count);
            lanes.forEach(l => traffic.push(new NPC(l)));
        }

        // --- CORE LOOP ---
        let lastSpawn = 0;
        function update(t) {
            if (gameSpeed < MAX_SPEED) gameSpeed += ACCEL;
            roadOffset = (roadOffset + gameSpeed) % 100;
            
            // Movement calculated from visual rotation
            playerX += (visualRot / STEER_LIMIT) * 11; 
            playerX = Math.max(22, Math.min(canvas.width - 22, playerX));

            if (!isDragging) {
                visualRot *= 0.86;
                thumbPos = visualRot; // Sync
                wheel.style.transform = `rotate(${visualRot}deg)`;
            }

            // HUD Update
            kmhDisp.innerText = Math.round(gameSpeed * 11).toString().padStart(2, '0');
            score += Math.floor(gameSpeed / 5);
            scoreDisp.innerText = score;

            // Spawning Logic
            if (t - lastSpawn > (1600 - gameSpeed * 50)) {
                spawn();
                lastSpawn = t;
            }

            traffic.forEach(v => {
                v.y += (gameSpeed - v.vSpeed); // Relative Speed
                
                // Collision
                if (Math.abs(v.x - playerX) < 28 && v.y + v.h > canvas.height - 110 && v.y < canvas.height - 40) {
                    location.reload(); 
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 200);
        }

        function render(t) {
            ctx.fillStyle = "#151517";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road Markings
            ctx.strokeStyle = "#2a2a2d";
            ctx.setLineDash([40, 60]);
            ctx.lineDashOffset = -roadOffset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_W, 0);
                ctx.lineTo(i * LANE_W, canvas.height);
                ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // Player Car
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";
            ctx.fillRect(playerX - 17, canvas.height - 110, 34, 70);
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#000";
            ctx.fillRect(playerX - 13, canvas.height - 102, 26, 18); // Windshield

            update(t);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
