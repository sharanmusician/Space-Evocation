<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Evocation | Steering Edition</title>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        
        .hud { position: absolute; top: 20px; left: 20px; font-size: 22px; text-shadow: 0 0 10px #00ffcc; pointer-events: none; }

        /* The Steering UI */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #steering-wheel {
            width: 100%;
            height: 100%;
            background: url('https://cdn-icons-png.flaticon.com/512/1986/1986937.png'); /* Steering Wheel Icon */
            background-size: cover;
            filter: drop-shadow(0 0 10px #00ffcc);
            cursor: grab;
            transition: transform 0.1s linear;
        }

        #steering-wheel:active { cursor: grabbing; }
    </style>
</head>
<body>
    <div class="hud">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div id="steering-wheel"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const wheel = document.getElementById('steering-wheel');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game State
        let score = 0;
        let gameActive = true;
        let playerX = canvas.width / 2;
        
        // Steering State
        let currentRotation = 0; // In degrees
        let isRotating = false;
        let startAngle = 0;

        const player = { width: 40, height: 40, color: '#00ffcc' };
        const obstacles = [];

        // --- VIRTUAL STEERING CALCULATIONS ---
        function getMouseAngle(event) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
        }

        const startRotation = (e) => {
            isRotating = true;
            startAngle = getMouseAngle(e) - currentRotation;
            e.preventDefault();
        };

        const updateRotation = (e) => {
            if (!isRotating) return;
            const newAngle = getMouseAngle(e);
            currentRotation = newAngle - startAngle;

            // Limit rotation to 1.5 turns (540 degrees) each way
            currentRotation = Math.max(-540, Math.min(540, currentRotation));
            wheel.style.transform = `rotate(${currentRotation}deg)`;
        };

        const stopRotation = () => {
            isRotating = false;
        };

        // Event Listeners
        wheel.addEventListener('mousedown', startRotation);
        window.addEventListener('mousemove', updateRotation);
        window.addEventListener('mouseup', stopRotation);
        
        wheel.addEventListener('touchstart', startRotation);
        window.addEventListener('touchmove', updateRotation);
        window.addEventListener('touchend', stopRotation);

        // --- GAME LOGIC ---
        function spawnObstacle() {
            const size = Math.random() * 50 + 20;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 2 + 4
            });
        }

        function update() {
            if (!gameActive) return;

            // Move ship based on rotation intensity
            // If rotation is 0, ship stays still. If rotation is 180, ship moves fast.
            const moveSpeed = currentRotation / 20; 
            playerX += moveSpeed;

            // Auto-centering force (slowly returns wheel to 0 when not grabbed)
            if (!isRotating) {
                currentRotation *= 0.92;
                wheel.style.transform = `rotate(${currentRotation}deg)`;
            }

            // Screen boundaries
            if (playerX < 0) playerX = 0;
            if (playerX > canvas.width - player.width) playerX = canvas.width - player.width;

            obstacles.forEach((obs, index) => {
                obs.y += obs.speed;
                
                // Collision
                if (obs.x < playerX + player.width &&
                    obs.x + obs.size > playerX &&
                    obs.y < (canvas.height - 120) + player.height &&
                    obs.y + obs.size > (canvas.height - 120)) {
                    gameActive = false;
                    alert("MISSION FAILED. Score: " + score);
                    location.reload();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(index, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });

            if (Math.random() < 0.05) spawnObstacle();
        }

        function draw() {
            // Space Background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Player Ship (Neon Triangle)
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.strokeStyle = player.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(playerX + player.width / 2, canvas.height - 120);
            ctx.lineTo(playerX, canvas.height - 120 + player.height);
            ctx.lineTo(playerX + player.width, canvas.height - 120 + player.height);
            ctx.closePath();
            ctx.stroke();

            // Draw Obstacles
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff4444';
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x + obs.size/2, obs.y + obs.size/2, obs.size/2, 0, Math.PI * 2);
                ctx.fill();
            });

            update();
            requestAnimationFrame(draw);
        }

        draw();

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
