<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: 6-Dice AI</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.2); --bg: #0a0a0a; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100vw; height: 100vh; background: var(--bg); overflow: hidden; position: fixed; top: 0; left: 0; font-family: 'Inter', sans-serif; }
        #game-container { position: absolute; inset: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* HUD & UI */
        #hud { position: absolute; top: env(safe-area-inset-top, 25px); width: 100%; display: flex; justify-content: center; align-items: center; gap: 20px; pointer-events: none; z-index: 10; opacity: 0; transition: opacity 0.5s; }
        .score-box { background: var(--glass); border: 1px solid var(--border); border-radius: 8px; width: 50px; height: 40px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 600; backdrop-filter: blur(5px); }
        #timer { color: #fff; font-size: 24px; font-weight: 800; width: 100px; text-align: center; }
        
        /* Controls */
        #joy-zone { position: absolute; bottom: 55px; left: 60px; width: 140px; height: 45px; z-index: 20; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; opacity: 0; }
        #knob { position: absolute; width: 34px; height: 34px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 21; }
        #act-zone { position: absolute; bottom: 30px; right: 30px; width: 210px; height: 100px; z-index: 20; opacity: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 45px 45px; gap: 8px; }
        
        .btn { background: var(--glass); border: 1px solid var(--border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; border-radius: 8px; text-transform: uppercase; }
        .btn.active { background: #fff; color: #000; }
        #jump { grid-column: span 3; font-size: 13px; letter-spacing: 2px; }

        /* Screens */
        .screen { position: fixed; inset: 0; background: rgba(0,0,0,1); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #end-screen { display: none; }
        .status-text { color: #fff; font-size: 42px; font-weight: 900; margin-bottom: 10px; text-align: center; letter-spacing: -1px; }
        .action-btn { padding: 18px 45px; background: #fff; color: #000; border: none; border-radius: 4px; font-weight: 800; font-size: 14px; letter-spacing: 2px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="screen">
        <h1 class="status-text">ELITE PRO VOLLEY</h1>
        <button class="action-btn" id="start-btn">KICKOFF</button>
    </div>

    <div id="end-screen" class="screen">
        <h1 id="result-title" class="status-text">MATCH ENDED</h1>
        <p id="result-score" style="color: #fff; margin-bottom: 20px; font-size: 18px;">Score: 0 - 0</p>
        <button class="action-btn" id="rematch-btn">REMATCH</button>
    </div>

    <div id="hud">
        <div class="score-box" id="s-c">0</div>
        <div id="timer">01:00</div>
        <div class="score-box" id="s-u">0</div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="joy-zone"></div>
    <div id="knob"></div>
    
    <div id="act-zone">
        <div class="btn" id="lift">Lift</div>
        <div class="btn" id="lob">Lob</div>
        <div class="btn" id="spike">Strike</div>
        <div class="btn" id="jump">JUMP</div>
    </div>
</div>

<script src="index.js"></script>

</body>
</html>
