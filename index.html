<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skill Strike: Optimized</title>
    <style>
        :root { --p1: #ff4757; --ai: #2f3542; --gold: #f1c40f; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        body { margin: 0; background: #080808; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: linear-gradient(to bottom, #1e3799, #4a69bd); border: 2px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        canvas { width: 100%; height: 100%; display: block; }
        
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 10; pointer-events: none; }
        .score { background: rgba(0,0,0,0.7); color: white; padding: 10px 25px; border-radius: 15px; border: 2px solid var(--gold); font-size: 1.2rem; font-weight: bold; min-width: 110px; text-align: center; }
        #timer { color: var(--gold); font-size: 2.2rem; font-weight: 900; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        .btn-start { padding: 18px 60px; background: var(--gold); border: none; border-radius: 50px; font-size: 1.8rem; cursor: pointer; font-weight: bold; box-shadow: 0 5px #b8950c; }
        
        #joystick-zone { position: absolute; bottom: 8%; left: 6%; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; }
        
        #action-zone { position: absolute; bottom: 8%; right: 4%; display: flex; gap: 12px; }
        .act-btn { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff; color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.5); transition: transform 0.1s; }
        #btn-spike { border-color: #ff4757; }
        #btn-lob { border-color: #2ecc71; }
        #btn-cut { border-color: #f1c40f; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay">
        <h1 id="m-title">READY?</h1>
        <button class="btn-start" onclick="begin()">SERVE</button>
    </div>
    <div id="hud">
        <div class="score">AI: <span id="c-s">0</span></div>
        <div id="timer">01:00</div>
        <div class="score">YOU: <span id="u-s">0</span></div>
    </div>
    <canvas id="stage"></canvas>
    
    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    
    <div id="action-zone">
        <div class="act-btn" id="btn-spike">SPIKE</div>
        <div class="act-btn" id="btn-lob">LOB</div>
        <div class="act-btn" id="btn-cut">CUT</div>
    </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// Engine Config
let W, H, G_Y, NET;
let joy = { x: 0, y: 0, active: false };
let activeSkill = null;
let state = { scores: { p: 0, c: 0 }, time: 60, running: false, lastWinner: null };

function syncDimensions() {
    W = canvas.width = container.clientWidth;
    H = canvas.height = container.clientHeight;
    G_Y = H - 40;
    NET = { x: W/2, y: H - 150, w: 10, h: 110 };
    p1.reset(); cpu.reset(); ball.spawn();
}

function begin() {
    document.getElementById('overlay').style.display = 'none';
    state.time = 60;
    state.scores = { p: 0, c: 0 };
    state.running = true;
    syncDimensions();
    requestAnimationFrame(loop);
}

// Controls
const initControls = () => {
    const zone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    
    const handleTouch = (e) => {
        if(!joy.active) return;
        const t = e.touches[0];
        const r = zone.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const dx = t.clientX - cx, dy = t.clientY - cy;
        const d = Math.hypot(dx, dy), lim = r.width/2;
        
        joy.x = (d > 0) ? (dx / d) * Math.min(d, lim) / lim : 0;
        joy.y = (d > 0) ? (dy / d) * Math.min(d, lim) / lim : 0;
        
        stick.style.left = (50 + joy.x * 40) + "%";
        stick.style.top = (50 + joy.y * 40) + "%";
        
        if(joy.y < -0.7 && !p1.air) { p1.dy = -17; p1.air = true; }
    };

    zone.addEventListener('touchstart', e => { joy.active = true; handleTouch(e); });
    window.addEventListener('touchmove', handleTouch);
    window.addEventListener('touchend', () => { 
        joy.active = false; joy.x = joy.y = 0; 
        stick.style.left = stick.style.top = "50%";
    });

    ['spike', 'lob', 'cut'].forEach(s => {
        const b = document.getElementById('btn-' + s);
        b.ontouchstart = (e) => { e.preventDefault(); activeSkill = s; b.style.transform = "scale(0.9)"; };
        b.ontouchend = () => { activeSkill = null; b.style.transform = "scale(1)"; };
    });
};

class Actor {
    constructor(side, color) { this.side = side; this.color = color; this.r = 35; }
    reset() {
        this.x = this.side === 'left' ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.r;
        this.dx = this.dy = 0; this.air = false;
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.r) this.dy += 0.8;
        else { this.y = G_Y - this.r; this.dy = 0; this.air = false; }
        this.x = Math.max(this.r, Math.min(W - this.r, this.x));
        const m = this.r + NET.w/2;
        if(this.side === 'right') this.x = Math.max(NET.x + m, this.x);
        else this.x = Math.min(NET.x - m, this.x);
    }
    draw() {
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(this.x + (this.side==='right'?-12:12), this.y-10, 8, 0, Math.PI*2); ctx.fill();
    }
}

const ball = {
    r: 15, dx: 0, dy: 0,
    spawn() {
        this.y = H * 0.2; this.dx = this.dy = 0;
        this.x = state.lastWinner === 'p' ? W * 0.8 : W * 0.2;
    },
    update() {
        this.dy += 0.42; this.dx *= 0.992; this.dy *= 0.992;
        this.x += this.dx; this.y += this.dy;
        if(this.y < this.r) { this.y = this.r; this.dy = Math.abs(this.dy)*0.5; }
        if(this.y > G_Y - this.r) { this.y = G_Y - this.r; this.dy *= -0.65; }
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx *= -1.2; this.x = (this.x < NET.x) ? NET.x - 20 : NET.x + 20;
        }
        if(this.x < -this.r || this.x > W + this.r) {
            state.scores[this.x > W ? 'c' : 'p']++;
            state.lastWinner = this.x > W ? 'c' : 'p';
            this.spawn(); p1.reset(); cpu.reset();
        }
    }
};

const p1 = new Actor('right', '#ff4757'), cpu = new Actor('left', '#2c3e50');

function loop() {
    if(!state.running) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, G_Y, W, 40);
    ctx.fillStyle = "#fff"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = joy.x * 9.5;
    
    // Optimized AI Brain
    let target = (ball.x < NET.x) ? ball.x - 12 : W * 0.15;
    cpu.dx = (cpu.x < target - 5) ? 7.5 : (cpu.x > target + 5) ? -7.5 : 0;
    if(ball.x < NET.x && !cpu.air && ball.y < G_Y - 50) { if(Math.random()>0.5) { cpu.dy = -16; cpu.air = true; } }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if(d < p.r + ball.r) {
            const ang = (ball.x - p.x) / p.r;
            const s = (p === p1) ? activeSkill : (Math.random() > 0.6 ? 'spike' : 'lob');
            if(s === 'spike') { ball.dx = (p.side==='right'?-15:15); ball.dy = -3; }
            else if(s === 'lob') { ball.dx = (p.side==='right'?-7:7); ball.dy = -17; }
            else if(s === 'cut') { ball.dx = ang * 16; ball.dy = -9; }
            else { ball.dx = ang * 5; ball.dy = -7; } // Fix: Passive hit now always has -7 upward force
        }
    });

    ball.update();
    ctx.fillStyle = "#fff200"; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    
    document.getElementById('u-s').innerText = state.scores.p;
    document.getElementById('c-s').innerText = state.scores.c;
    requestAnimationFrame(loop);
}

// 60-Second Timer
setInterval(() => {
    if(!state.running) return;
    state.time--;
    let s = state.time;
    document.getElementById('timer').innerText = `00:${s < 10 ? '0' + s : s}`;
    if(state.time <= 0) {
        state.running = false;
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('m-title').innerText = state.scores.p > state.scores.c ? "YOU WIN!" : "AI WINS!";
    }
}, 1000);

initControls();
window.onresize = syncDimensions;
</script>
</body>
</html>
