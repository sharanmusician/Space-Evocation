<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Traffic Racer | Cockpit Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* LAYER 1: The Road and Traffic (The "Outside") */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Sits behind everything */
        }

        /* LAYER 2: The Digital Speedometer */
        #speedo-box {
            position: absolute;
            bottom: 12%; /* Aligned to the dash hole */
            right: 17%;
            z-index: 2;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        #kmh { color: #00ff00; font-size: 28px; text-shadow: 0 0 10px #0f0; }

        /* LAYER 3: The Full-Screen Cockpit */
        #cockpit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Sits on top */
            background-image: url('Cock.jpg');
            background-size: 100% 100%;
            pointer-events: none;
            
            /* CHROMA KEY MASK: This makes the green screen transparent */
            /* Note: This works best if the green is very bright/pure */
            mask-image: linear-gradient(transparent, transparent); /* Placeholder */
            -webkit-mask-image: url('Cock.jpg'); /* We use the image itself to define the mask */
        }

        /* LAYER 4: The Steering Wheel (Interactive) */
        #steering-ui {
            position: absolute;
            bottom: 3%;
            right: 5%;
            width: 160px;
            height: 160px;
            z-index: 20; /* Highest layer for touch */
            cursor: pointer;
        }
        #steering-ui img { width: 100%; height: 100%; }
        
        /* Fallback: If green screen doesn't clear, we use this filter */
        .green-remover {
            filter: chroma(color=#00FF00); /* Older IE fallback */
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="roadCanvas"></canvas>

    <div id="speedo-box">
        <div id="kmh">0</div>
        <div style="color: #0f0; font-size: 10px;">KM/H</div>
    </div>

    <img src="Cock.jpg" id="cockpit-overlay">

    <div id="steering-ui">
        <img src="wheel.png" id="wheel-graphic">
    </div>
</div>

<script>
    const canvas = document.getElementById('roadCanvas');
    const ctx = canvas.getContext('2d');
    const kmhDisp = document.getElementById('kmh');
    const steering = document.getElementById('steering-ui');

    // Preload Textures
    const roadImg = new Image(); roadImg.src = 'road.jpg';
    const npcImg = new Image(); npcImg.src = 'traffic_car.png';

    let playerX = 0, wheelRot = 0, gameSpeed = 0.05, roadOffset = 0, traffic = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 3D Projection Math
    function project(x, y, z) {
        const scale = 1 / z;
        // Perspective shifted to the Right-Hand Drive seat
        const px = (canvas.width * 0.65) + (x - playerX * 1400) * scale;
        const py = (canvas.height * 0.35) + (y * scale);
        return { x: px, py: py, scale: scale };
    }

    class Car {
        constructor(lane) {
            this.lane = lane;
            this.laneX = -700 + (lane * 450);
            this.z = 35;
            this.vSpeed = 0.01 + Math.random() * 0.02;
        }
        update() { this.z -= (gameSpeed - this.vSpeed); }
        draw() {
            if (this.z <= 0.2) return;
            const p = project(this.laneX, 300, this.z);
            const w = 600 * p.scale;
            const h = 400 * p.scale;
            if (npcImg.complete) ctx.drawImage(npcImg, p.x - w/2, p.py - h, w, h);
        }
    }

    // Steering logic
    let isTouch = false, lastAngle = 0;
    const getAngle = (e) => {
        const rect = steering.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
    };

    steering.onmousedown = steering.ontouchstart = (e) => { isTouch = true; lastAngle = getAngle(e); e.preventDefault(); };
    window.onmousemove = window.ontouchmove = (e) => {
        if (!isTouch) return;
        let a = getAngle(e), delta = a - lastAngle;
        if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
        wheelRot = Math.max(-90, Math.min(90, wheelRot + delta));
        steering.style.transform = `rotate(${wheelRot}deg)`;
        lastAngle = a;
    };
    window.onmouseup = window.ontouchend = () => isTouch = false;

    function loop(t) {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Update physics
        roadOffset = (roadOffset + gameSpeed * 80) % 100;
        playerX += (wheelRot / 90) * 0.07;
        playerX = Math.max(-2, Math.min(2, playerX));
        
        if (!isTouch) { wheelRot *= 0.85; steering.style.transform = `rotate(${wheelRot}deg)`; }

        // Draw Road
        for (let z = 35; z > 0.1; z -= 1.2) {
            const p = project(0, 300, z), pNext = project(0, 300, z - 1.2);
            const w = 4000 * p.scale;
            if (roadImg.complete) ctx.drawImage(roadImg, p.x - w/2, p.py, w, pNext.py - p.py);
        }

        // Traffic
        if (Math.random() < 0.015) traffic.push(new Car(Math.floor(Math.random() * 4)));
        traffic.forEach((v, i) => {
            v.update(); v.draw();
            // Crash logic
            if (v.z < 1.0 && v.z > 0.5 && Math.abs((v.laneX - playerX * 1400)) < 300) location.reload();
            if (v.z < 0.1) traffic.splice(i, 1);
        });

        // Dashboard Speedo
        kmhDisp.innerText = Math.round(gameSpeed * 650);
        if (gameSpeed < 0.5) gameSpeed += 0.0001;

        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
</script>

</body>
</html>
