<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: Pro Edition</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --border: rgba(255, 255, 255, 0.2); --accent: #00f2ff; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; font-family: 'Inter', sans-serif; }
        
        #overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .start-btn { padding: 20px 60px; background: #fff; color: #000; border-radius: 8px; font-weight: 900; letter-spacing: 2px; cursor: pointer; border: none; }

        #hud { position: absolute; top: env(safe-area-inset-top, 20px); width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 10; pointer-events: none; }
        .score { background: var(--glass); border: 1px solid var(--border); padding: 10px 25px; border-radius: 12px; backdrop-filter: blur(10px); font-size: 26px; font-weight: 900; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #timer { font-size: 24px; color: var(--accent); font-weight: 800; min-width: 90px; text-align: center; }

        canvas { display: block; width: 100vw; height: 100vh; }

        #ui-layer { position: absolute; inset: 0; pointer-events: none; }
        #joy-zone { position: absolute; bottom: 50px; left: 50px; width: 160px; height: 70px; background: var(--glass); border-radius: 35px; border: 1px solid var(--border); pointer-events: auto; }
        #knob { position: absolute; left: 50%; top: 50%; width: 45px; height: 45px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        
        #act-zone { position: absolute; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 80px); gap: 12px; pointer-events: auto; }
        .btn { background: var(--glass); border: 1px solid var(--border); height: 55px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .btn:active { background: #fff; color: #000; transform: scale(0.95); }
        #jump-btn { grid-column: span 3; border-color: var(--accent); color: var(--accent); height: 60px; font-size: 14px; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="color:white; margin-bottom: 30px; font-size: 32px; font-weight: 900; letter-spacing: -1px;">HEAD BALL VOLLEY</h1>
    <button class="start-btn" onclick="kickoff()">START GAME</button>
</div>

<div id="hud">
    <div class="score" id="s-c">0</div>
    <div id="timer">01:00</div>
    <div class="score" id="s-u">0</div>
</div>

<canvas id="canvas"></canvas>

<div id="ui-layer">
    <div id="joy-zone"><div id="knob"></div></div>
    <div id="act-zone">
        <div class="btn" id="lift">Lift</div>
        <div class="btn" id="lob">Lob</div>
        <div class="btn" id="strike">Strike</div>
        <div class="btn" id="jump-btn">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
let W, H, G_Y, NET;
let state = { u: 0, c: 0, time: 60, active: false };
let input = { x: 0, buffer: '', bTimer: 0, joyID: null };

function resize() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 60; NET = { x: W/2, y: G_Y - 100, w: 8, h: 100 };
}

function kickoff() {
    document.getElementById('overlay').style.display = 'none';
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    
    state.active = true;
    resize();
    ball.spawn();
    
    setInterval(() => { 
        if(state.time > 0 && state.active) {
            state.time--;
            document.getElementById('timer').innerText = `00:${state.time.toString().padStart(2, '0')}`;
        }
    }, 1000);
    requestAnimationFrame(loop);
}

class Athlete {
    constructor(side, color) {
        this.side = side; this.color = color;
        this.w = 40; this.h = 45; this.reset();
    }
    reset() {
        this.x = (this.side === 'left') ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.h; this.dx = 0; this.dy = 0; this.air = false;
        this.recovery = 0; this.skill = null;
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if (this.y < G_Y - this.h) this.dy += 1.5;
        else { this.y = G_Y - this.h; this.dy = 0; this.air = false; }
        
        let min = (this.side === 'left') ? 25 : NET.x + 25;
        let max = (this.side === 'left') ? NET.x - 25 : W - 25;
        this.x = Math.max(min, Math.min(max, this.x));
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.roundRect(this.x - 18, this.y, 36, 45, 8); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(this.x, this.y - 5, 14, 0, Math.PI*2); ctx.fill();
    }
}

const ball = {
    x: 0, y: 0, dx: 0, dy: 0, r: 10, lock: 0,
    spawn() { this.x = W * 0.7; this.y = H * 0.3; this.dx = -5; this.dy = 0; this.lock = 0; },
    update() {
        if (this.lock > 0) this.lock--;
        for (let i = 0; i < 8; i++) { // High Precision Physics
            this.x += this.dx / 8; this.y += this.dy / 8;
            if (this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
                this.dx *= -0.6; this.x = (this.x < NET.x) ? NET.x - 15 : NET.x + 15;
            }
        }
        this.dy += 0.3;
        if (this.y >= G_Y - this.r) {
            if (Math.abs(this.dy) > 2.5) this.dy *= -0.55;
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); }
        }
    }
};

const p1 = new Athlete('right', '#4a90e2'), cpu = new Athlete('left', '#ff3b3b');

function aiBrain() {
    if (ball.x > NET.x) { // Ball is on Player Side
        cpu.dx = (W * 0.15 - cpu.x) * 0.1;
        cpu.recovery = 0; return;
    }

    const stuck = (ball.x > NET.x - 110 && ball.dx < 1.5);
    if (stuck || cpu.recovery > 0) {
        cpu.dx = (ball.x - cpu.x) * 0.8;
        if (cpu.recovery === 0) cpu.recovery = 1;
        if (cpu.recovery === 1) {
            cpu.skill = 'lift';
            if (ball.lock > 0) cpu.recovery = 2;
        } else {
            if (!cpu.air) { cpu.dy = -18; cpu.air = true; }
            cpu.skill = 'strike';
            if (ball.dx > 6) cpu.recovery = 0;
        }
    } else {
        // Predictive Interception
        let predX = ball.x + (ball.dx * 12);
        cpu.dx = (predX - cpu.x) * 0.3;
        let dice = Math.floor(Date.now() / 1800) % 4;
        cpu.skill = ['lob', 'lift', 'strike', 'lob'][dice];
        if (cpu.skill === 'strike' && !cpu.air && ball.y < G_Y - 60) { cpu.dy = -18; cpu.air = true; }
    }
}

function handleHit(p) {
    let act = (p === p1) ? (input.bTimer > 0 ? input.buffer : null) : p.skill;
    if (!act) return;

    let range = (Math.abs(ball.dx) > 15) ? 80 : 65;
    if (Math.abs(ball.x - p.x) < range && Math.abs(ball.y - p.y) < 90 && ball.lock === 0) {
        ball.lock = 20; let dir = (p.side === 'right') ? -1 : 1;
        if (act === 'strike') { ball.dx = dir * 28; ball.dy = 7.5; }
        else if (act === 'lift') { ball.dx = dir * 0.6; ball.dy = -19; }
        else { ball.dx = dir * 11; ball.dy = -23; }
        if (p === p1) input.bTimer = 0;
    }
}

function loop() {
    if (!state.active) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(NET.x-4, NET.y, 8, 100);
    
    aiBrain();
    [p1, cpu].forEach(p => { p.update(); p.draw(); handleHit(p); });
    ball.update();

    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 11, 0, Math.PI*2); ctx.fill();
    
    if (input.bTimer > 0) input.bTimer--;
    document.getElementById('s-c').innerText = state.c;
    document.getElementById('s-u').innerText = state.u;
    requestAnimationFrame(loop);
}

// Multi-Touch Input Logic
window.addEventListener('touchstart', e => {
    for (let t of e.changedTouches) {
        if (t.clientX < W / 2) input.joyID = t.identifier;
        ['lift', 'lob', 'strike', 'jump-btn'].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const r = btn.getBoundingClientRect();
            if (t.clientX > r.left && t.clientX < r.right && t.clientY > r.top && t.clientY < r.bottom) {
                if (id === 'jump-btn') { if(!p1.air) { p1.dy = -18.5; p1.air = true; } }
                else { input.buffer = id; input.bTimer = 30; }
            }
        });
    }
}, {passive: false});

window.addEventListener('touchmove', e => {
    for (let t of e.touches) {
        if (t.identifier === input.joyID) {
            let r = joyZone.getBoundingClientRect();
            let val = (t.clientX - (r.left + r.width/2)) / (r.width/2);
            input.x = Math.max(-1, Math.min(1, val));
            knob.style.left = (50 + input.x * 40) + "%";
            p1.dx = input.x * 10;
        }
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) { 
        if (t.identifier === input.joyID) { 
            input.x = 0; p1.dx = 0; knob.style.left = "50%"; input.joyID = null;
        } 
    }
}, {passive: false});

window.addEventListener('resize', resize);
</script>
</body>
</html>
