<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linear Pro Volley</title>
    <style>
        :root { --gold: #f1c40f; --red: #ff4757; --green: #2ecc71; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #1e3799, #4a69bd); }
        canvas { width: 100%; height: 100%; display: block; }
        
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 30px; z-index: 10; pointer-events: none; }
        .score { background: rgba(0,0,0,0.6); color: white; padding: 8px 20px; border-radius: 10px; border: 1.5px solid var(--gold); font-weight: bold; }
        #timer { color: var(--gold); font-size: 2rem; font-weight: 900; }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        .btn-start { padding: 20px 60px; background: var(--gold); border: none; border-radius: 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer; }

        /* Linear Slider (Left Side) */
        #slider-zone { position: absolute; bottom: 60px; left: 40px; width: 220px; height: 60px; background: rgba(255,255,255,0.1); border-radius: 30px; border: 2px solid rgba(255,255,255,0.3); }
        #slider-handle { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.3); }
        
        /* Right Side Actions */
        #action-zone { position: absolute; bottom: 40px; right: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .act-btn { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #fff; color: white; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.4); }
        .wide-btn { grid-column: span 2; width: 100%; height: 70px; border-radius: 15px; background: rgba(241, 196, 15, 0.3); border-color: var(--gold); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay">
        <h1>PRO VOLLEY</h1>
        <button class="btn-start" onclick="begin()">SERVE</button>
    </div>
    <div id="hud">
        <div class="score">AI: <span id="c-s">0</span></div>
        <div id="timer">01:00</div>
        <div class="score">YOU: <span id="u-s">0</span></div>
    </div>
    <canvas id="stage"></canvas>
    
    <div id="slider-zone"><div id="slider-handle"></div></div>
    
    <div id="action-zone">
        <div class="act-btn" id="btn-spike" style="color: var(--red); border-color: var(--red);">SPIKE</div>
        <div class="act-btn" id="btn-lob" style="color: var(--green); border-color: var(--green);">LOB</div>
        <div class="act-btn wide-btn" id="btn-jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');
const handle = document.getElementById('slider-handle');

let W, H, G_Y, NET;
let input = { x: 0, id: null };
let activeSkill = null;
let state = { scores: { p: 0, c: 0 }, time: 60, running: false, lastWinner: null };

function sync() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    G_Y = H - 60;
    NET = { x: W/2, y: H - 180, w: 12, h: 120 };
    if(p1) p1.reset();
    if(cpu) cpu.reset();
}

function begin() {
    const f = container.requestFullscreen || container.webkitRequestFullscreen;
    if (f) f.call(container).catch(() => {});
    document.getElementById('overlay').style.display = 'none';
    state.running = true;
    state.time = 60;
    sync();
    requestAnimationFrame(loop);
}

// LINEAR SLIDER LOGIC
const zone = document.getElementById('slider-zone');
zone.addEventListener('touchstart', e => {
    e.preventDefault();
    input.id = e.changedTouches[0].identifier;
}, {passive: false});

window.addEventListener('touchmove', e => {
    for (let t of e.changedTouches) {
        if (t.identifier === input.id) {
            const r = zone.getBoundingClientRect();
            const cx = r.left + r.width/2;
            let dx = t.clientX - cx;
            let lim = r.width/2 - 35;
            input.x = Math.max(-1, Math.min(1, dx / lim));
            handle.style.left = (50 + input.x * 40) + "%";
        }
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) {
        if (t.identifier === input.id) {
            input.id = null; input.x = 0;
            handle.style.left = "50%";
        }
    }
});

// RIGHT SIDE BUTTONS
const bindBtn = (id, skill) => {
    const b = document.getElementById(id);
    b.addEventListener('touchstart', e => {
        e.preventDefault();
        if(skill === 'jump') { if(!p1.air) { p1.dy = -17; p1.air = true; } }
        else { activeSkill = skill; }
        b.style.background = "rgba(255,255,255,0.3)";
    });
    b.addEventListener('touchend', () => {
        activeSkill = null;
        b.style.background = "rgba(0,0,0,0.4)";
    });
};
bindBtn('btn-spike', 'spike');
bindBtn('btn-lob', 'lob');
bindBtn('btn-jump', 'jump');

class Actor {
    constructor(side, color) { this.side = side; this.color = color; this.r = 35; }
    reset() {
        this.x = (this.side === 'left') ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.r;
        this.dx = this.dy = 0; this.air = false;
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.r) this.dy += 0.8;
        else { this.y = G_Y - this.r; this.dy = 0; this.air = false; }
        this.x = Math.max(this.r, Math.min(W - this.r, this.x));
        const m = this.r + NET.w/2;
        if(this.side === 'right') this.x = Math.max(NET.x + m, this.x);
        else this.x = Math.min(NET.x - m, this.x);
    }
    draw() {
        ctx.fillStyle = this.color; ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
    }
}

const ball = {
    r: 16, dx: 0, dy: 0, x: 0, y: 0,
    spawn() {
        this.y = H * 0.3; this.dx = this.dy = 0;
        this.x = (state.lastWinner === 'p') ? W * 0.75 : W * 0.25;
    },
    update() {
        this.dy += 0.45; this.dx *= 0.99; this.dy *= 0.99;
        this.x += this.dx; this.y += this.dy;
        if(this.y < this.r) { this.y = this.r; this.dy = Math.abs(this.dy)*0.5; }
        if(this.y > G_Y - this.r) { this.y = G_Y - this.r; this.dy *= -0.7; }
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx *= -1.2; this.x = (this.x < NET.x) ? NET.x - 25 : NET.x + 25;
        }
        if(this.x < -50 || this.x > W + 50) {
            state.scores[this.x > W ? 'c' : 'p']++;
            state.lastWinner = this.x > W ? 'c' : 'p';
            this.spawn(); p1.reset(); cpu.reset();
        }
    },
    draw() {
        ctx.fillStyle = "#fff200"; ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
    }
};

const p1 = new Actor('right', '#ff4757'), cpu = new Actor('left', '#2c3e50');

function loop() {
    if(!state.running) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, G_Y, W, 60);
    ctx.fillStyle = "#fff"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = input.x * 10;
    
    // AI Strategy
    let target = (ball.x < NET.x) ? ball.x - 10 : W * 0.15;
    cpu.dx = (cpu.x < target - 5) ? 7.5 : (cpu.x > target + 5) ? -7.5 : 0;
    if(ball.x < NET.x && !cpu.air && ball.y < G_Y - 80 && Math.random() > 0.98) { cpu.dy = -17; cpu.air = true; }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if(d < p.r + ball.r) {
            const s = (p === p1) ? activeSkill : (Math.random() > 0.7 ? 'spike' : 'lob');
            if(s === 'spike') { ball.dx = (p.side==='right'?-18:18); ball.dy = -4; }
            else if(s === 'lob') { ball.dx = (p.side==='right'?-6:6); ball.dy = -18; }
            else { ball.dx = (ball.x - p.x)/p.r * 5; ball.dy = -9; }
        }
    });

    ball.update(); ball.draw();
    document.getElementById('u-s').innerText = state.scores.p;
    document.getElementById('c-s').innerText = state.scores.c;
    requestAnimationFrame(loop);
}

setInterval(() => {
    if(!state.running) return;
    state.time--;
    document.getElementById('timer').innerText = `00:${state.time < 10 ? '0' + state.time : state.time}`;
    if(state.time <= 0) {
        state.running = false;
        document.getElementById('overlay').style.display = 'flex';
    }
}, 1000);

window.onresize = sync;
sync();
</script>
</body>
</html>
