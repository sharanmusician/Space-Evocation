<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Highway Star | Pro-Stop Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --danger: #ff3366;
            --dash: #141416;
        }

        body { 
            margin: 0; background: #000; 
            height: 100vh; width: 100vw; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none; 
        }

        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: #1a1a1c;
            display: flex; flex-direction: column;
            border: 1px solid #222;
        }

        #game-view { flex: 1; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        #dashboard {
            height: 30%;
            background: linear-gradient(180deg, #1c1c1f 0%, #050505 100%);
            border-top: 3px solid #333;
            padding: 15px;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .dash-upper { display: flex; justify-content: space-between; align-items: center; }
        .hud-unit { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 11px; }
        
        .speedo-container { text-align: center; font-family: 'Orbitron', sans-serif; }
        .speed-val { font-size: 38px; color: #fff; text-shadow: 0 0 12px var(--neon); line-height: 1; }

        .dash-lower { display: flex; justify-content: space-between; align-items: flex-end; }

        /* Steering Wheel with Real Stops */
        #steering-wheel {
            width: 100px; height: 100px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 10px solid #18181a;
            background: radial-gradient(circle, #222 0%, #111 70%);
            box-shadow: 0 6px 15px rgba(0,0,0,0.7), inset 0 0 8px #000;
            transition: transform 0.1s cubic-bezier(0.1, 0.7, 0.1, 1); /* Natural weight */
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 8px; background: #18181a; transform: translateY(-50%); }
        .top-notch { position: absolute; top: -10px; left: 50%; width: 8px; height: 10px; background: var(--danger); transform: translateX(-50%); }
        
        .ac-vent { width: 35px; height: 16px; background: #0c0c0d; border: 1px solid #252525; border-radius: 2px;
                   background-image: linear-gradient(0deg, #1a1a1a 50%, transparent 50%); background-size: 100% 4px; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view"><canvas id="gameCanvas"></canvas></div>

        <div id="dashboard">
            <div class="dash-upper">
                <div class="hud-unit">
                    PWR: NOMINAL
                    <div style="width: 60px; height: 4px; background: #000; margin-top: 4px;">
                        <div id="fuel-bar" style="width: 100%; height: 100%; background: var(--neon);"></div>
                    </div>
                </div>
                <div class="speedo-container">
                    <div id="speed-out" class="speed-val">00</div>
                    <div style="font-size: 9px; letter-spacing: 2px; color: #555;">KM/H</div>
                </div>
            </div>

            <div class="dash-lower">
                <div style="display: flex; gap: 8px;"><div class="ac-vent"></div><div class="ac-vent"></div></div>
                <div id="steering-wheel">
                    <div class="top-notch"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const speedOut = document.getElementById('speed-out');
        const fuelBar = document.getElementById('fuel-bar');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onresize = resize;
        resize();

        // --- SYSTEM CONFIG ---
        const LANES = 4;
        const LANE_WIDTH = canvas.width / LANES;
        const STEERING_CLAMP = 90; // Cannot rotate past 90 degrees
        const INITIAL_SPEED = 2;   // Start slow
        const MAX_SPEED = 18;      // Max velocity
        const ACCELERATION = 0.005; // Growth rate

        let gameSpeed = INITIAL_SPEED;
        let playerX = canvas.width / 2;
        let wheelRotation = 0;
        let isDragging = false;
        let startAngle = 0;
        let traffic = [];
        let roadOffset = 0;
        let distance = 0;

        // --- INPUT ENGINE ---
        function getTouchAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const start = (e) => { isDragging = true; startAngle = getTouchAngle(e) - wheelRotation; e.preventDefault(); };
        const move = (e) => {
            if (!isDragging) return;
            let targetAngle = getTouchAngle(e) - startAngle;
            
            // Physical Stops Logic
            wheelRotation = Math.max(-STEERING_CLAMP, Math.min(STEERING_CLAMP, targetAngle));
            wheel.style.transform = `rotate(${wheelRotation}deg)`;
        };
        const end = () => { isDragging = false; };

        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);

        // --- TRAFFIC SYSTEM ---
        class Enemy {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_WIDTH) + (LANE_WIDTH / 2);
                this.y = -100;
                this.w = 26;
                this.h = 50;
                this.color = `hsl(${Math.random() * 360}, 60%, 50%)`;
                this.vSpeed = 3 + (Math.random() * 2); 
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.w/2, this.y, this.w, this.h);
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.fillRect(this.x - 8, this.y + 8, 16, 12);
            }
        }

        function spawn() {
            let blocked = Math.floor(Math.random() * 3) + 1; // 1 to 3 lanes
            let laneChoices = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, blocked);
            laneChoices.forEach(l => traffic.push(new Enemy(l)));
        }

        // --- CORE LOOP ---
        let lastSpawn = 0;
        function update(t) {
            // 1. Acceleration Logic
            if (gameSpeed < MAX_SPEED) gameSpeed += ACCELERATION;
            
            roadOffset = (roadOffset + gameSpeed) % 80;
            
            // 2. Physics & Steering
            // Movement is now a function of current rotation vs the clamped max
            playerX += (wheelRotation / STEERING_CLAMP) * 8; 
            playerX = Math.max(20, Math.min(canvas.width - 20, playerX));

            if (!isDragging) {
                wheelRotation *= 0.85; // Natural auto-center
                wheel.style.transform = `rotate(${wheelRotation}deg)`;
            }

            // 3. Telemetry
            speedOut.innerText = Math.round(gameSpeed * 10).toString().padStart(2, '0');
            distance += (gameSpeed / 10);
            fuelBar.style.width = (100 - (distance / 50)) + "%";

            // 4. Traffic Manager
            if (t - lastSpawn > (2000 - gameSpeed * 80)) {
                spawn();
                lastSpawn = t;
            }

            traffic.forEach(v => {
                v.y += (gameSpeed - v.vSpeed);
                if (Math.abs(v.x - playerX) < 24 && v.y + v.h > canvas.height - 65 && v.y < canvas.height - 15) {
                    location.reload();
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 100);
        }

        function draw(t) {
            ctx.fillStyle = "#1a1a1c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lanes
            ctx.strokeStyle = "#333";
            ctx.setLineDash([30, 40]);
            ctx.lineDashOffset = -roadOffset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_WIDTH, 0);
                ctx.lineTo(i * LANE_WIDTH, canvas.height);
                ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // Player
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";
            ctx.fillRect(playerX - 13, canvas.height - 65, 26, 50);

            update(t);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
