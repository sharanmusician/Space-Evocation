<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Touch Pro Volley</title>
    <style>
        :root { --gold: #f1c40f; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        body { margin: 0; background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Full Screen Container */
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: linear-gradient(to bottom, #1e3799, #4a69bd);
            display: flex; flex-direction: column;
        }
        canvas { width: 100%; height: 100%; display: block; flex-grow: 1; }
        
        #hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: center; gap: 30px; z-index: 10; pointer-events: none; }
        .score { background: rgba(0,0,0,0.6); color: white; padding: 5px 15px; border-radius: 10px; border: 1px solid var(--gold); font-family: sans-serif; }
        #timer { color: var(--gold); font-size: 1.5rem; font-weight: bold; font-family: sans-serif; }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; font-family: sans-serif; }
        .btn-start { padding: 20px 60px; background: var(--gold); border: none; border-radius: 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer; }

        /* Joystick Fixed */
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 50; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; pointer-events: none; }
        
        /* Action Buttons */
        #action-zone { position: absolute; bottom: 50px; right: 30px; display: flex; gap: 10px; z-index: 50; }
        .act-btn { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff; color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.5); font-family: sans-serif; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay">
        <h1 id="m-title">FULLSCREEN VOLLEY</h1>
        <button class="btn-start" onclick="begin()">START GAME</button>
    </div>
    <div id="hud">
        <div class="score">AI: <span id="c-s">0</span></div>
        <div id="timer">01:00</div>
        <div class="score">YOU: <span id="u-s">0</span></div>
    </div>
    <canvas id="stage"></canvas>
    
    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    
    <div id="action-zone">
        <div class="act-btn" id="btn-spike" style="border-color: #ff4757;">SPIKE</div>
        <div class="act-btn" id="btn-lob" style="border-color: #2ecc71;">LOB</div>
        <div class="act-btn" id="btn-cut" style="border-color: #f1c40f;">CUT</div>
    </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');
const stick = document.getElementById('joystick-stick');

let W, H, G_Y, NET;
let joy = { x: 0, y: 0, identifier: null };
let activeSkill = null;
let state = { scores: { p: 0, c: 0 }, time: 60, running: false };

function syncDimensions() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    G_Y = H - 60;
    NET = { x: W/2, y: H - 180, w: 12, h: 120 };
}

function begin() {
    // Force Fullscreen
    if (container.requestFullscreen) container.requestFullscreen();
    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    
    document.getElementById('overlay').style.display = 'none';
    state.running = true;
    syncDimensions();
    requestAnimationFrame(loop);
}

// MULTI-TOUCH JOYSTICK LOGIC
const zone = document.getElementById('joystick-zone');

zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    joy.identifier = touch.identifier;
}, {passive: false});

window.addEventListener('touchmove', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joy.identifier) {
            const r = zone.getBoundingClientRect();
            const cx = r.left + r.width/2, cy = r.top + r.height/2;
            const dx = t.clientX - cx, dy = t.clientY - cy;
            const d = Math.hypot(dx, dy), lim = r.width/2;
            
            joy.x = (dx / d) * Math.min(d, lim) / lim;
            joy.y = (dy / d) * Math.min(d, lim) / lim;
            
            stick.style.left = (50 + joy.x * 40) + "%";
            stick.style.top = (50 + joy.y * 40) + "%";
            
            if(joy.y < -0.7 && !p1.air) { p1.dy = -17; p1.air = true; }
        }
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joy.identifier) {
            joy.identifier = null;
            joy.x = joy.y = 0;
            stick.style.left = stick.style.top = "50%";
        }
    }
});

// SKILL BUTTONS (Independent of Joystick Touch)
['spike', 'lob', 'cut'].forEach(s => {
    const b = document.getElementById('btn-' + s);
    b.addEventListener('touchstart', (e) => {
        e.preventDefault();
        activeSkill = s;
        b.style.background = "rgba(255,255,255,0.3)";
    });
    b.addEventListener('touchend', (e) => {
        e.preventDefault();
        activeSkill = null;
        b.style.background = "rgba(0,0,0,0.5)";
    });
});

class Actor {
    constructor(side, color) { this.side = side; this.color = color; this.r = 35; this.reset(); }
    reset() {
        this.x = this.side === 'left' ? W * 0.15 : W * 0.85;
        this.y = G_Y - this.r;
        this.dx = this.dy = 0; this.air = false;
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.r) this.dy += 0.8;
        else { this.y = G_Y - this.r; this.dy = 0; this.air = false; }
        this.x = Math.max(this.r, Math.min(W - this.r, this.x));
        const m = this.r + NET.w/2;
        if(this.side === 'right') this.x = Math.max(NET.x + m, this.x);
        else this.x = Math.min(NET.x - m, this.x);
    }
    draw() {
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    }
}

const ball = {
    r: 15, dx: 0, dy: 0,
    spawn() {
        this.y = H * 0.3; this.dx = this.dy = 0;
        this.x = state.lastWinner === 'p' ? W * 0.8 : W * 0.2;
    },
    update() {
        this.dy += 0.45; this.dx *= 0.99; this.dy *= 0.99;
        this.x += this.dx; this.y += this.dy;
        if(this.y < this.r) { this.y = this.r; this.dy = Math.abs(this.dy)*0.5; }
        if(this.y > G_Y - this.r) { this.y = G_Y - this.r; this.dy *= -0.7; }
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx *= -1.2; this.x = (this.x < NET.x) ? NET.x - 20 : NET.x + 20;
        }
        if(this.x < -this.r || this.x > W + this.r) {
            state.scores[this.x > W ? 'c' : 'p']++;
            state.lastWinner = this.x > W ? 'c' : 'p';
            this.spawn(); p1.reset(); cpu.reset();
        }
    }
};

const p1 = new Actor('right', '#ff4757'), cpu = new Actor('left', '#2c3e50');

function loop() {
    if(!state.running) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, G_Y, W, 60);
    ctx.fillStyle = "#fff"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = joy.x * 10;
    
    // AI Brain
    let target = (ball.x < NET.x) ? ball.x - 10 : W * 0.15;
    cpu.dx = (cpu.x < target - 5) ? 7.5 : (cpu.x > target + 5) ? -7.5 : 0;
    if(ball.x < NET.x && !cpu.air && ball.y < G_Y - 50 && Math.random() > 0.98) { cpu.dy = -16; cpu.air = true; }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if(d < p.r + ball.r) {
            const ang = (ball.x - p.x) / p.r;
            const s = (p === p1) ? activeSkill : (Math.random() > 0.8 ? 'spike' : 'lob');
            if(s === 'spike') { ball.dx = (p.side==='right'?-16:16); ball.dy = -4; }
            else if(s === 'lob') { ball.dx = (p.side==='right'?-6:6); ball.dy = -18; }
            else if(s === 'cut') { ball.dx = ang * 16; ball.dy = -10; }
            else { ball.dx = ang * 4; ball.dy = -8; }
        }
    });

    ball.update();
    ctx.fillStyle = "#fff200"; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    
    document.getElementById('u-s').innerText = state.scores.p;
    document.getElementById('c-s').innerText = state.scores.c;
    requestAnimationFrame(loop);
}

setInterval(() => {
    if(!state.running) return;
    state.time--;
    document.getElementById('timer').innerText = `00:${state.time < 10 ? '0' + state.time : state.time}`;
    if(state.time <= 0) {
        state.running = false;
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('m-title').innerText = state.scores.p > state.scores.c ? "VICTORY!" : "DEFEAT!";
    }
}, 1000);

window.addEventListener('resize', syncDimensions);
syncDimensions();
</script>
</body>
</html>
