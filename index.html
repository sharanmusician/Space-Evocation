<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Traffic Racer | Real Cockpit</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; display: flex; justify-content: center; align-items: center; }
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        
        /* The 3D World (Road and Cars) sits at the BOTTOM layer */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* The Speedometer text sits behind the cockpit green screen */
        #speedo-container {
            position: absolute; bottom: 12.5%; right: 18%; 
            width: 80px; text-align: center; z-index: 2;
            font-family: 'Orbitron', sans-serif;
        }
        #kmh { color: #00ff00; font-size: 22px; text-shadow: 0 0 10px #0f0; }

        /* The Cockpit Image sits on the TOP layer */
        #cockpit {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 10; pointer-events: none;
            object-fit: fill;
            /* This CSS trick removes the green color so we see the road behind it */
            mix-blend-mode: multiply; 
        }
        
        /* Steering Wheel UI */
        #steering-box {
            position: absolute; bottom: 5%; right: 10%;
            width: 130px; height: 130px; z-index: 20;
        }
        #wheel-img { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="gameCanvas"></canvas>

        <div id="speedo-container">
            <div id="kmh">0</div>
            <div style="color: #0f0; font-size: 8px;">KM/H</div>
        </div>

        <img id="cockpit" src="Cock.jpg">

        <div id="steering-box">
            <img id="wheel-img" src="wheel.png">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const kmhDisp = document.getElementById('kmh');
        const wheelBox = document.getElementById('steering-box');

        // Preload Road & Traffic
        const roadImg = new Image(); roadImg.src = 'road.jpg';
        const carImg = new Image(); carImg.src = 'traffic_car.png';

        let playerX = 0, wheelRot = 0, gameSpeed = 0.04, roadOffset = 0, traffic = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function project(x, y, z) {
            const scale = 1 / z;
            // Aligned perspective to the Right-Hand Driver seat in your image
            const px = (canvas.width * 0.6) + (x - playerX * 1200) * scale;
            const py = (canvas.height * 0.4) + (y * scale);
            return { x: px, py: py, scale: scale };
        }

        class Enemy {
            constructor(lane) {
                this.lane = lane;
                this.laneX = -600 + (lane * 400);
                this.z = 30;
            }
            update() { this.z -= gameSpeed; }
            draw() {
                const p = project(this.laneX, 250, this.z);
                const w = 550 * p.scale;
                const h = 350 * p.scale;
                if (carImg.complete) ctx.drawImage(carImg, p.x - w/2, p.py - h, w, h);
            }
        }

        // Steering Controls
        let isDragging = false, lastA = 0;
        const getA = (e) => {
            const r = wheelBox.getBoundingClientRect();
            const cx = r.left + r.width/2, cy = r.top + r.height/2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        };

        wheelBox.ontouchstart = wheelBox.onmousedown = (e) => { isDragging = true; lastA = getA(e); e.preventDefault(); };
        window.onmousemove = window.ontouchmove = (e) => {
            if (!isDragging) return;
            let a = getA(e), d = a - lastA;
            if (d > 180) d -= 360; if (d < -180) d += 360;
            wheelRot = Math.max(-90, Math.min(90, wheelRot + d));
            wheelBox.style.transform = `rotate(${wheelRot}deg)`;
            lastA = a;
        };
        window.onmouseup = window.ontouchend = () => isDragging = false;

        function loop(t) {
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            roadOffset = (roadOffset + gameSpeed * 60) % 100;
            playerX += (wheelRot / 90) * 0.06;

            // Draw 3D Road
            for (let z = 30; z > 0.1; z -= 1) {
                const p = project(0, 250, z), pNext = project(0, 250, z - 1);
                const w = 3000 * p.scale;
                if (roadImg.complete) ctx.drawImage(roadImg, p.x - w/2, p.py, w, pNext.py - p.py);
            }

            // Spawn and update traffic
            if (Math.random() < 0.02) traffic.push(new Enemy(Math.floor(Math.random() * 4)));
            traffic.forEach((v, i) => {
                v.update(); v.draw();
                // Collision
                if (v.z < 0.8 && v.z > 0.4 && Math.abs((v.laneX - playerX * 1200)) < 250) location.reload();
                if (v.z < 0.1) traffic.splice(i, 1);
            });

            kmhDisp.innerText = Math.round(gameSpeed * 620);
            if (gameSpeed < 0.4) gameSpeed += 0.0001;

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
