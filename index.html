<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: Pro Edition</title>
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --blue: #2e86de; --glass: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        
        html, body { 
            width: 100vw; height: 100vh; height: -webkit-fill-available;
            background: #000; overflow: hidden; position: fixed; top: 0; left: 0; 
        }
        
        #game-container { 
            position: absolute; inset: 0; 
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex; align-items: center; justify-content: center;
        }

        canvas { width: 100%; height: 100%; display: block; }
        
        #hud { 
            position: absolute; top: env(safe-area-inset-top, 20px); 
            width: 100%; display: flex; justify-content: center; gap: 100px; 
            pointer-events: none; z-index: 10; 
        }
        .score { color: white; font-size: 32px; font-weight: 800; font-family: 'Segoe UI', sans-serif; opacity: 0.8; }
        
        /* Professional Minimalist Controls */
        #joy-zone { position: absolute; bottom: 40px; left: 30px; width: 120px; height: 120px; z-index: 20; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; }
        #knob { 
            position: absolute; width: 50px; height: 50px; 
            background: var(--glass); border: 1px solid #fff; 
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; 
        }
        
        #act-zone { position: absolute; bottom: 30px; right: 20px; width: 240px; height: 160px; z-index: 20; }
        .btn { 
            position: absolute; border-radius: 50%; 
            background: var(--glass); backdrop-filter: blur(8px); 
            color: white; display: flex; align-items: center; justify-content: center; 
            font-weight: 700; border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px; letter-spacing: 1px;
            transition: background 0.1s;
        }
        .btn:active { background: rgba(255,255,255,0.3); }
        
        #spike { width: 70px; height: 70px; bottom: 85px; right: 10px; }
        #lob { width: 70px; height: 70px; bottom: 85px; right: 90px; }
        #jump { width: 150px; height: 55px; bottom: 10px; right: 10px; border-radius: 30px; }
        
        #overlay { 
            position: absolute; inset: 0; background: #000; 
            z-index: 100; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; cursor: pointer; 
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="overlay" onclick="enterFullscreen()">
        <h2 style="letter-spacing: 8px; font-family: sans-serif;">PRO VOLLEY</h2>
        <p style="color: #888; margin-top: 10px; font-size: 12px;">TAP TO INITIALIZE</p>
    </div>
    
    <div id="hud">
        <div class="score" id="s-c">0</div>
        <div class="score" id="s-u">0</div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div id="joy-zone"></div>
    <div id="knob"></div>
    
    <div id="act-zone">
        <div class="btn" id="spike">SPIKE</div>
        <div class="btn" id="lob">LOB</div>
        <div class="btn" id="jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
let W, H, G_Y, NET, state = { u: 0, c: 0, active: false };
const inputs = { joyId: null, moveX: 0, spike: false, lob: false, buffer: 0 };

async function enterFullscreen() {
    const el = document.documentElement;
    try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    } catch (err) {}
    start();
}

function start() {
    document.getElementById('overlay').style.display = 'none';
    state.active = true;
    resize();
    ball.spawn();
    requestAnimationFrame(loop);
}

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    G_Y = H - 50;
    // Net made smaller as requested
    NET = { x: W/2, y: G_Y - 95, w: 8, h: 95 };
    updateKnobUI(0);
    if(p1) p1.reset();
    if(cpu) cpu.reset();
}

function updateKnobUI(val) {
    const r = joyZone.getBoundingClientRect();
    knob.style.left = (r.left + r.width/2 + val * 35) + "px";
    knob.style.top = (r.top + r.height/2) + "px";
}

joyZone.addEventListener('touchstart', e => { e.preventDefault(); inputs.joyId = e.changedTouches[0].identifier; }, {passive: false});
window.addEventListener('touchmove', e => {
    for (let t of e.changedTouches) if (t.identifier === inputs.joyId) {
        const r = joyZone.getBoundingClientRect();
        inputs.moveX = Math.max(-1, Math.min(1, (t.clientX - (r.left + r.width/2)) / 40));
        updateKnobUI(inputs.moveX);
    }
}, {passive: false});
window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) if (t.identifier === inputs.joyId) { inputs.joyId = null; inputs.moveX = 0; updateKnobUI(0); }
});

const bindBtn = (id, key) => {
    const b = document.getElementById(id);
    b.addEventListener('touchstart', e => {
        e.preventDefault();
        inputs[key] = true;
        inputs.buffer = 12;
        if(key === 'jump' && !p1.air) { p1.dy = -14; p1.air = true; }
    }, {passive: false});
    b.addEventListener('touchend', () => { if(key !== 'jump') inputs[key] = false; });
};
bindBtn('spike', 'spike'); bindBtn('lob', 'lob'); bindBtn('jump', 'jump');

class Athlete {
    constructor(side, color) { 
        this.side = side; 
        this.color = color; 
        this.h = 55; // Smaller players
    }
    reset() { 
        this.x = (this.side === 'right') ? W * 0.75 : W * 0.25; 
        this.y = G_Y - this.h; 
        this.dx = this.dy = 0; 
        this.air = false; 
        this.anim = 0; 
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        // Gravity applies to entire body y
        if(this.y < G_Y - this.h) {
            this.dy += 0.8;
        } else {
            this.y = G_Y - this.h;
            this.dy = 0;
            this.air = false;
        }
        const limit = NET.x + (this.side === 'right' ? 25 : -25);
        this.x = (this.side === 'right') ? Math.max(limit, Math.min(W-25, this.x)) : Math.min(limit, Math.max(25, this.x));
        this.anim += Math.abs(this.dx) * 0.25;
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y); // Translate entire player (Prevents leg stretching)
        if(this.side === 'right') ctx.scale(-1, 1);
        
        ctx.strokeStyle = "rgba(255,255,255,0.8)"; 
        ctx.lineWidth = 3;
        
        // LEGS (Rigid relative to Torso)
        let walk = Math.sin(this.anim) * 8;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(walk, 55); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(-walk, 55); ctx.stroke();

        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-10, 8, 20, 28, 4);
        ctx.fill();
        
        // Head
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
        
        // Arm
        let act = (this === p1) ? (inputs.spike || inputs.lob || inputs.buffer > 0) : this.skill;
        ctx.beginPath(); ctx.moveTo(8, 12); 
        ctx.lineTo(30, (act && (inputs.spike || this.skill==='spike')) ? -15 : 35); 
        ctx.stroke();
        
        ctx.restore();
    }
}

const ball = {
    r: 12, dx: 0, dy: 0, x: 0, y: 0, lock: 0,
    spawn() { this.y = H * 0.2; this.dx = 0; this.dy = 0; this.x = (state.u > state.c) ? W*0.3 : W*0.7; this.lock = 0; },
    update() {
        if(this.lock > 0) this.lock--;
        this.dy += 0.45; this.x += this.dx; this.y += this.dy;
        
        if(this.y < this.r) { this.y = this.r; this.dy *= -0.5; }
        if(this.y >= G_Y - this.r) {
            this.y = G_Y - this.r;
            if(Math.abs(this.dy) > 3) this.dy *= -0.6;
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); p1.reset(); cpu.reset(); }
        }
        // Net Collision
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx = (this.x < NET.x) ? -Math.abs(this.dx) - 3 : Math.abs(this.dx) + 3;
            this.x = (this.x < NET.x) ? NET.x - (NET.w/2 + this.r + 3) : NET.x + (NET.w/2 + this.r + 3);
        }
    },
    draw() { 
        ctx.fillStyle = "var(--gold)"; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); 
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    }
};

const p1 = new Athlete('right', '#ff4757'), cpu = new Athlete('left', '#2e86de');

function loop() {
    if(!state.active) return;
    ctx.clearRect(0,0,W,H);
    if(inputs.buffer > 0) inputs.buffer--;

    // Court Floor
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(0, G_Y, W, 50);
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);

    p1.dx = inputs.moveX * 8.5;
    
    // AI 
    let d = ball.x - cpu.x;
    if (ball.x < NET.x) {
        cpu.dx = d > 5 ? 7 : d < -5 ? -7 : 0;
        if(!cpu.air && ball.y < G_Y - 100 && Math.abs(d) < 80) { cpu.dy = -13; cpu.air = true; }
        cpu.skill = (Math.abs(NET.x - cpu.x) < 150) ? (Math.random() > 0.4 ? 'spike' : 'lob') : null;
    } else { cpu.dx = (cpu.x < W * 0.2) ? 4 : -4; cpu.skill = null; }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        
        let skill = (p === p1) ? (inputs.spike ? 'spike' : inputs.lob ? 'lob' : (inputs.buffer > 0 ? 'spike' : null)) : p.skill;
        
        // Accurate Hitbox
        let hb = { x1: p.x - 45, x2: p.x + 45, y1: p.y - 25, y2: p.y + 75 };

        if(ball.x > hb.x1 && ball.x < hb.x2 && ball.y > hb.y1 && ball.y < hb.y2 && ball.lock === 0) {
            ball.lock = 12;
            const dir = (p.side === 'right') ? -1 : 1;
            
            if(skill === 'spike') {
                ball.dx = dir * 18;
                ball.dy = (ball.y < p.y + 15) ? 10 : 4;
            } else if(skill === 'lob') {
                ball.dx = dir * 8;
                ball.dy = (ball.y > G_Y - 50) ? -23 : -18;
            } else {
                ball.dx = dir * 6 + (p.dx * 0.3);
                ball.dy = -8;
            }
            ball.x = p.x + (dir * 50);
            inputs.buffer = 0;
        }
    });

    ball.update(); ball.draw();
    document.getElementById('s-u').innerText = state.u;
    document.getElementById('s-c').innerText = state.c;
    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
