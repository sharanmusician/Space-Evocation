<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Head Ball MVP - Optimized</title>
    <style>
        :root { --accent: #ff4757; --bg: #1e272e; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
        body { margin: 0; background: var(--bg); font-family: 'Arial Black', sans-serif; overflow: hidden; height: 100vh; }

        /* Orientation Logic */
        #rotate-overlay {
            position: fixed; inset: 0; background: #000; color: white;
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        @media (orientation: portrait) { #rotate-overlay { display: flex; } }

        /* Game Layout */
        #stage { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #header { height: 60px; display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.3); color: white; }
        .score-box { background: #333; padding: 5px 20px; border-radius: 10px; border: 2px solid #555; min-width: 80px; text-align: center; }

        canvas { flex-grow: 1; background: linear-gradient(#4facfe 0%, #00f2fe 100%); display: block; }

        /* Professional Control Pad */
        #control-bar {
            height: 140px; background: #2f3542; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 50px;
            border-top: 4px solid #57606f;
        }

        .d-pad { display: flex; gap: 15px; }
        .btn {
            width: 85px; height: 85px; background: #57606f; border: none;
            border-radius: 50%; color: white; font-size: 30px; font-weight: bold;
            box-shadow: 0 6px #2f3542; transform: translateY(-3px);
            display: flex; justify-content: center; align-items: center;
        }
        .btn:active { transform: translateY(0px); box-shadow: 0 2px #2f3542; background: #747d8c; }
        .jump-btn { background: var(--accent); width: 100px; height: 100px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="rotate-overlay"><h2>ROTATE FOR LANDSCAPE</h2></div>

    <div id="stage">
        <div id="header">
            <div class="score-box" id="cpu-score">AI: 0</div>
            <div style="color: yellow;">VS</div>
            <div class="score-box" id="player-score">YOU: 0</div>
        </div>

        <canvas id="game"></canvas>

        <div id="control-bar">
            <div class="d-pad">
                <div class="btn" id="left">←</div>
                <div class="btn" id="right">→</div>
            </div>
            <div class="btn jump-btn" id="jump">JUMP</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let w, h, groundY;
let scores = { player: 0, cpu: 0 };
let input = { left: false, right: false, jump: false };

function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = canvas.offsetHeight;
    groundY = h - 20;
}
window.addEventListener('resize', init);
init();

// --- Entities ---
const ball = {
    x: 0, y: 0, r: 12, dx: 0, dy: 0,
    reset() { this.x = w/2; this.y = h/2; this.dx = 0; this.dy = 0; }
};
ball.reset();

class Player {
    constructor(x, color, isUser) {
        this.x = x; this.color = color; this.isUser = isUser;
        this.r = 35; this.dy = 0; this.dx = 0; this.isJumping = false;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
        // Eye
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(this.x + (this.isUser ? -15 : 15), this.y - 12, 7, 0, Math.PI*2); ctx.fill();
    }
    update() {
        this.y = Math.min(this.y + this.dy, groundY - this.r);
        if (this.y < groundY - this.r) { this.dy += 0.6; } 
        else { this.dy = 0; this.isJumping = false; }
        this.x = Math.max(this.r, Math.min(w - this.r, this.x + this.dx));
    }
}

const user = new Player(w - 100, '#ff4757', true);
const cpu = new Player(100, '#2f3542', false);

// --- Input Handling ---
const handle = (id, key, val) => {
    const el = document.getElementById(id);
    const set = (e) => { e.preventDefault(); input[key] = val; };
    el.addEventListener('touchstart', set, {passive: false});
    el.addEventListener('mousedown', set);
    el.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = !val; }, {passive: false});
    el.addEventListener('mouseup', () => input[key] = !val);
};
handle('left', 'left', true); handle('right', 'right', true); handle('jump', 'jump', true);

function physics() {
    // User logic
    user.dx = 0;
    if (input.left) user.dx = -7;
    if (input.right) user.dx = 7;
    if (input.jump && !user.isJumping) { user.dy = -14; user.isJumping = true; }

    // CPU AI logic (Tracks ball)
    const cpuTarget = ball.x - 30;
    cpu.dx = (cpu.x < cpuTarget) ? 5 : (cpu.x > cpuTarget) ? -5 : 0;
    if (ball.y < cpu.y && Math.abs(ball.x - cpu.x) < 60 && !cpu.isJumping) { cpu.dy = -14; cpu.isJumping = true; }

    user.update(); cpu.update();

    // Ball Physics
    ball.dy += 0.4; ball.x += ball.dx; ball.y += ball.dy;
    if (ball.y > groundY - ball.r) { ball.y = groundY - ball.r; ball.dy *= -0.7; }
    if (ball.x < 0 || ball.x > w) ball.dx *= -0.8;

    // Collisions
    [user, cpu].forEach(p => {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (d < p.r + ball.r) {
            ball.dx = (ball.x - p.x) * 0.4;
            ball.dy = (ball.y - p.y) * 0.4 - 5;
        }
    });

    // Score Check
    if (ball.x < 15 && ball.y > groundY - 110) { scores.player++; ball.reset(); }
    if (ball.x > w - 15 && ball.y > groundY - 110) { scores.cpu++; ball.reset(); }
}

function render() {
    ctx.clearRect(0,0,w,h);
    // Grass & Goals
    ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, groundY, w, 20);
    ctx.fillStyle = "white"; 
    ctx.fillRect(0, groundY - 100, 15, 100); // CPU Goal
    ctx.fillRect(w - 15, groundY - 100, 15, 100); // User Goal

    user.draw(); cpu.draw();
    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

    document.getElementById('cpu-score').innerText = `AI: ${scores.cpu}`;
    document.getElementById('player-score').innerText = `YOU: ${scores.player}`;

    physics();
    requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
