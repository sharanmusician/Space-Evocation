<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Head Volley 16:9 Landscape</title>
    <style>
        :root { --p-color: #ff4757; --ai-color: #2f3542; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
        
        body { 
            margin: 0; background: #000; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        /* 16:9 Aspect Ratio Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            background: linear-gradient(#4facfe, #00f2fe);
            border: 2px solid #333;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* HUD & Overlays */
        #hud {
            position: absolute; top: 10px; width: 100%; 
            display: flex; justify-content: center; gap: 30px;
            pointer-events: none; z-index: 5;
        }
        .score-item { background: rgba(0,0,0,0.6); color: white; padding: 5px 15px; border-radius: 8px; font-size: 1.2rem; }
        #timer { color: #f1c40f; font-size: 1.5rem; }

        /* Controls positioned over the 16:9 area */
        #touch-ui {
            position: absolute; bottom: 15px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px;
            z-index: 10;
        }
        .btn {
            width: 70px; height: 70px; background: rgba(255,255,255,0.3);
            border: 3px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 28px; color: white;
        }
        .btn:active { background: rgba(255,255,255,0.6); transform: scale(0.9); }
        .jump-btn { background: rgba(230, 126, 34, 0.7); width: 90px; height: 90px; border-radius: 20px; font-size: 16px; }

        #end-screen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; color: white;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div class="score-item">AI: <span id="c-s">0</span></div>
            <div id="timer">02:00</div>
            <div class="score-item">YOU: <span id="u-s">0</span></div>
        </div>

        <div id="end-screen">
            <h1 id="result-msg">GAME OVER</h1>
            <button onclick="location.reload()" style="padding: 10px 30px; background: #27ae60; color: white; border: none; font-weight: bold; border-radius: 5px;">REPLAY</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="touch-ui">
            <div style="display: flex; gap: 20px;">
                <div class="btn" id="l-btn">←</div>
                <div class="btn" id="r-btn">→</div>
            </div>
            <div class="btn jump-btn" id="j-btn">JUMP</div>
        </div>
    </div>

<script>
const cvs = document.getElementById('gameCanvas');
const ctx = cvs.getContext('2d');

let w, h, gY, net;
let scores = { p: 0, c: 0 };
let timeLeft = 120;
let keys = { l: false, r: false, j: false };
let isRunning = true;

function resize() {
    w = cvs.width = cvs.offsetWidth;
    h = cvs.height = cvs.offsetHeight;
    gY = h - 30;
    net = { x: w/2, y: h - 130, w: 8, h: 100 };
}

class Player {
    constructor(side, color) {
        this.side = side; this.color = color;
        this.r = 32; this.reset();
    }
    reset() {
        this.x = this.side === 'left' ? 100 : w - 100;
        this.y = gY - this.r;
        this.dx = 0; this.dy = 0; this.air = false;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.stroke();
        // Eye
        ctx.fillStyle = "white"; ctx.beginPath();
        ctx.arc(this.x + (this.side === 'right' ? -12 : 12), this.y - 12, 8, 0, Math.PI*2); ctx.fill();
    }
    update() {
        this.x += this.dx; this.y += this.dy;
        if (this.y < gY - this.r) this.dy += 0.7;
        else { this.y = gY - this.r; this.dy = 0; this.air = false; }
        
        // Net & Wall Collisions
        if (this.side === 'right') {
            if (this.x < net.x + this.r + 5) this.x = net.x + this.r + 5;
            if (this.x > w - this.r) this.x = w - this.r;
        } else {
            if (this.x > net.x - this.r - 5) this.x = net.x - this.r - 5;
            if (this.x < this.r) this.x = this.r;
        }
    }
}

const ball = {
    r: 13,
    reset() { this.x = w/2; this.y = 60; this.dx = 0; this.dy = 0; },
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = "#f1c40f"; ctx.fill(); ctx.stroke();
    }
};

const user = new Player('right', '#ff4757');
const cpu = new Player('left', '#2c3e50');

window.addEventListener('resize', resize);
resize();
ball.reset();

// Controls Logic
const bind = (id, k) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
    el.ontouchend = (e) => { e.preventDefault(); keys[k] = false; };
};
bind('l-btn', 'l'); bind('r-btn', 'r'); bind('j-btn', 'j');

// Timer
setInterval(() => {
    if (!isRunning) return;
    if (timeLeft > 0) {
        timeLeft--;
        let m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
    } else {
        isRunning = false;
        document.getElementById('end-screen').style.display = 'flex';
        const msg = document.getElementById('result-msg');
        if (scores.p > scores.c) msg.innerText = "YOU WON!";
        else if (scores.p < scores.c) msg.innerText = "AI WON!";
        else msg.innerText = "GAME MATCH (TIE)";
    }
}, 1000);

function loop() {
    if (!isRunning) return;
    ctx.clearRect(0, 0, w, h);

    // Draw Floor & Net
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, gY, w, 30);
    ctx.fillStyle = "white"; ctx.fillRect(net.x - 4, net.y, net.w, net.h);

    // Player (You - Right)
    user.dx = 0;
    if (keys.l) user.dx = -6; if (keys.r) user.dx = 6;
    if (keys.j && !user.air) { user.dy = -15; user.air = true; }

    // AI (Left)
    const aiTarget = ball.x - 15;
    cpu.dx = (cpu.x < aiTarget) ? 5 : (cpu.x > aiTarget) ? -5 : 0;
    if (ball.y < cpu.y && Math.abs(ball.x - cpu.x) < 50 && !cpu.air) { cpu.dy = -15; cpu.air = true; }

    user.update(); cpu.update();
    ball.dy += 0.4; ball.x += ball.dx; ball.y += ball.dy;

    // Ball Net Bounce
    if (ball.y > net.y && Math.abs(ball.x - net.x) < ball.r + 5) { ball.dx *= -1.2; ball.x += ball.dx; }

    // Scoring Rules
    if (ball.y > gY - ball.r) {
        if (ball.x < net.x) scores.p++; else scores.c++;
        ball.reset();
    }
    if (ball.x < 0 || ball.x > w) ball.dx *= -1;

    // Hit Logic
    [user, cpu].forEach(p => {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (d < p.r + ball.r) {
            ball.dx = (ball.x - p.x) * 0.4 + p.dx;
            ball.dy = (ball.y - p.y) * 0.4 - 6;
        }
    });

    user.draw(); cpu.draw(); ball.draw();
    document.getElementById('u-s').innerText = scores.p;
    document.getElementById('c-s').innerText = scores.c;

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
