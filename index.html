<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Volley - Ground Play</title>
    <style>
        :root { --gold: #f1c40f; --red: #ff4757; --green: #2ecc71; --white: rgba(255, 255, 255, 0.2); }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #1e3c72, #2a5298); overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 10; pointer-events: none; }
        .score { color: white; font-size: 1.2rem; font-weight: bold; }
        #timer { color: var(--gold); font-size: 1.8rem; font-weight: 900; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        .btn-start { padding: 20px 60px; background: var(--gold); border: none; border-radius: 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer; color: #000; }
        #slider-zone { position: absolute; bottom: 40px; left: 30px; width: 220px; height: 80px; display: flex; align-items: center; }
        #slider-track { width: 100%; height: 14px; background: var(--white); border-radius: 20px; position: relative; }
        #slider-handle { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; backdrop-filter: blur(5px); }
        #action-zone { position: absolute; bottom: 30px; right: 30px; width: 220px; height: 180px; pointer-events: none; }
        .act-btn { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,0.4); color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); pointer-events: auto; }
        #btn-spike { width: 75px; height: 75px; bottom: 95px; right: 10px; border-color: var(--red); }
        #btn-lob { width: 75px; height: 75px; bottom: 95px; right: 105px; border-color: var(--green); }
        #btn-jump { width: 190px; height: 65px; bottom: 10px; right: 10px; border-radius: 35px; border-color: var(--gold); font-size: 15px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay"><h1>PRO VOLLEY</h1><button class="btn-start" id="startBtn">START</button></div>
    <div id="hud">
        <div class="score">CPU: <span id="c-s">0</span></div>
        <div id="timer">01:00</div>
        <div class="score">YOU: <span id="u-s">0</span></div>
    </div>
    <canvas id="stage"></canvas>
    <div id="slider-zone"><div id="slider-track"><div id="slider-handle"></div></div></div>
    <div id="action-zone">
        <div class="act-btn" id="btn-spike">SPIKE</div>
        <div class="act-btn" id="btn-lob">LOB</div>
        <div class="act-btn" id="btn-jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
const handle = document.getElementById('slider-handle'), startBtn = document.getElementById('startBtn'), gameContainer = document.getElementById('game-container');
let W, H, G_Y, NET, input = { x: 0, id: null }, activeSkill = null, state = { scores: { p: 0, c: 0 }, time: 60, running: false, lastWinner: null };

function sync() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 60; NET = { x: W/2, y: H - 160, w: 10, h: 100 };
    if(p1) p1.reset(); if(cpu) cpu.reset();
}

startBtn.addEventListener('click', () => {
    if (gameContainer.requestFullscreen) gameContainer.requestFullscreen();
    document.getElementById('overlay').style.display = 'none';
    state.running = true; sync(); ball.spawn(); requestAnimationFrame(loop);
});

const zone = document.getElementById('slider-zone');
zone.addEventListener('touchstart', e => { e.preventDefault(); input.id = e.changedTouches[0].identifier; }, {passive: false});
window.addEventListener('touchmove', e => {
    for (let t of e.changedTouches) { if (t.identifier === input.id) {
        const r = zone.getBoundingClientRect();
        input.x = Math.max(-1, Math.min(1, (t.clientX - (r.left + r.width/2)) / (r.width/2 - 30)));
        handle.style.left = (50 + input.x * 40) + "%";
    }}
}, {passive: false});
window.addEventListener('touchend', e => { for (let t of e.changedTouches) if (t.identifier === input.id) { input.id = null; input.x = 0; handle.style.left = "50%"; }});

const bind = (id, s) => {
    const b = document.getElementById(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); if(s==='jump'){ if(!p1.air){ p1.dy = -12; p1.air=true; }} else activeSkill = s; });
    b.addEventListener('touchend', () => { if(s !== 'jump') activeSkill = null; });
};
bind('btn-spike','spike'); bind('btn-lob','lob'); bind('btn-jump','jump');

class Actor {
    constructor(side, color) { this.side = side; this.color = color; this.r = 28; }
    reset() { this.x = (this.side === 'left') ? W * 0.2 : W * 0.8; this.y = G_Y - this.r; this.dx = this.dy = 0; this.air = false; }
    update() {
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.r) this.dy += 0.55; else { this.y = G_Y - this.r; this.dy = 0; this.air = false; }
        const limit = NET.w/2 + this.r;
        if(this.side === 'right') this.x = Math.max(NET.x + limit, Math.min(W-this.r, this.x));
        else this.x = Math.min(NET.x - limit, Math.max(this.r, this.x));
    }
    draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); }
}

const ball = {
    r: 14, dx: 0, dy: 0, x: 0, y: 0, groundTime: 0,
    spawn() { this.y = H * 0.4; this.dx = 0; this.dy = 0; this.x = (state.lastWinner === 'p') ? W * 0.75 : W * 0.25; this.groundTime = 0; },
    update() {
        this.dy += 0.55; 
        this.dx *= 0.992;
        this.x += this.dx; this.y += this.dy;

        // VISIBILITY FIX: Clamp top position so it never leaves screen
        if (this.y < this.r + 10) { this.y = this.r + 10; this.dy = Math.max(this.dy, 1); }

        // Ground Logic with Settle Timer
        if(this.y >= G_Y - this.r) {
            this.y = G_Y - this.r;
            this.dy *= -0.3; // Very dead bounce
            this.dx *= 0.94; // Higher friction
            
            // Increment time on ground
            if (Math.abs(this.dy) < 1) {
                this.groundTime++;
            } else {
                this.groundTime = 0; // Reset if it bounces back up
            }

            // Must stay on ground for ~1.5 seconds (90 frames)
            if(this.groundTime > 90) {
                const win = this.x > NET.x ? 'c' : 'p';
                state.scores[win]++; state.lastWinner = win;
                p1.reset(); cpu.reset(); this.spawn();
            }
        } else {
            this.groundTime = 0; // Ball is in the air
        }

        // Net
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx *= -0.4; this.x = (this.x < NET.x) ? NET.x - (this.r + NET.w/2 + 2) : NET.x + (this.r + NET.w/2 + 2);
        }
        // Bounds
        if(this.x < -150 || this.x > W + 150) {
            const win = this.x > W ? 'c' : 'p';
            state.scores[win]++; state.lastWinner = win;
            p1.reset(); cpu.reset(); this.spawn();
        }
    },
    draw() { ctx.fillStyle = "#fff200"; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); }
};

const p1 = new Actor('right', '#ff4757'), cpu = new Actor('left', '#fff');

function loop() {
    if(!state.running) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(0, G_Y, W, 60);
    ctx.fillStyle = "#fff"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);
    p1.dx = input.x * 7;

    // Smart AI
    if (ball.x < NET.x) {
        let aiTarget = ball.x + (Math.sin(Date.now() / 700) * 25);
        cpu.dx = (cpu.x < aiTarget - 5) ? 5.8 : (cpu.x > aiTarget + 5) ? -5.8 : 0;
        if(!cpu.air && ball.y < G_Y - 130 && Math.random() > 0.98) cpu.dy = -11;
    } else {
        let home = W * 0.18; cpu.dx = (cpu.x < home) ? 4 : -4;
    }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let dx = ball.x - p.x, dy = ball.y - p.y, dist = Math.sqrt(dx*dx + dy*dy), minDist = p.r + ball.r;
        if(dist < minDist) {
            let nx = dx / dist, ny = dy / dist;
            ball.x = p.x + nx * (minDist + 1); ball.y = p.y + ny * (minDist + 1);
            const dir = (p.side === 'right') ? -1 : 1;
            
            let skill = (p === p1) ? activeSkill : (Math.abs(NET.x - p.x) < 140 ? 'spike' : 'lob');
            if(skill === 'spike') { ball.dx = dir * 13; ball.dy = 1.5; }
            else if(skill === 'lob') { ball.dx = dir * 7; ball.dy = -11; }
            else { ball.dx = (nx * 4.5) + (p.dx * 0.4); ball.dy = (ny * 4.5) - 2.5; }
            
            // Limit vertical speed on impact to prevent hiding
            ball.dy = Math.max(ball.dy, -15);
        }
    });

    ball.update(); ball.draw();
    document.getElementById('u-s').innerText = state.scores.p;
    document.getElementById('c-s').innerText = state.scores.c;
    requestAnimationFrame(loop);
}

setInterval(() => { if(state.running) state.time--; document.getElementById('timer').innerText = `00:${state.time < 10 ? '0' + state.time : state.time}`; }, 1000);
window.addEventListener('resize', sync); sync();
</script>
</body>
</html>
