<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: Head Ball Pro</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.2); --bg: #0a0a0a; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100vw; height: 100vh; background: var(--bg); overflow: hidden; position: fixed; top: 0; left: 0; font-family: 'Inter', sans-serif; }
        #game-container { position: absolute; inset: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); }
        canvas { width: 100%; height: 100%; display: block; }
        #hud { position: absolute; top: 25px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 20px; pointer-events: none; z-index: 10; }
        .score-box { background: var(--glass); border: 1px solid var(--border); border-radius: 8px; width: 50px; height: 40px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 600; backdrop-filter: blur(5px); }
        #timer { color: #fff; font-size: 24px; font-weight: 800; width: 100px; text-align: center; }
        #act-zone { position: absolute; bottom: 30px; right: 30px; width: 210px; height: 100px; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 45px 45px; gap: 8px; }
        .btn { background: var(--glass); border: 1px solid var(--border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; border-radius: 8px; text-transform: uppercase; }
        #jump { grid-column: span 3; font-size: 13px; letter-spacing: 2px; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="hud"><div class="score-box" id="s-c">0</div><div id="timer">01:00</div><div class="score-box" id="s-u">0</div></div>
    <canvas id="canvas"></canvas>
    <div id="act-zone">
        <div class="btn">Lift</div><div class="btn">Lob</div><div class="btn">Strike</div>
        <div class="btn" id="jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
let W, H, G_Y, NET, state = { u: 0, c: 0, active: true, time: 60 };
const inputs = { moveX: 0, buffer: 0, type: '' };

function resize() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 50; NET = { x: W/2, y: G_Y - 80, w: 6, h: 80 };
}

class Athlete {
    constructor(side, color) { 
        this.side = side; this.color = color; this.h = 38; this.x = 0; this.y = 0;
        this.dx = 0; this.dy = 0; this.air = false;
        this.cpuSkill = null; this.combo = 0;
    }
    reset() { this.x = (this.side === 'right') ? W*0.8 : W*0.2; this.y = G_Y - this.h; this.dx=this.dy=0; this.combo=0; }
    update() {
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.h) this.dy += 1.5; else { this.y = G_Y - this.h; this.dy = 0; this.air = false; }
        let limit = (this.side === 'left') ? [20, NET.x - 25] : [NET.x + 25, W - 20];
        this.x = Math.max(limit[0], Math.min(limit[1], this.x));
    }
    draw() {
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(this.x-8, this.y, 16, 25);
    }
}

const ball = {
    x: 0, y: 0, dx: 0, dy: 0, r: 8, lock: 0,
    spawn() { this.x = W*0.7; this.y = H*0.3; this.dx = -2; this.dy = 0; this.lock = 0; },
    update() {
        if(this.lock > 0) this.lock--;
        // Physics Sub-stepping for high speed strikes
        for(let s=0; s<3; s++) {
            this.x += this.dx/3; this.y += this.dy/3;
            if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
                this.dx *= -0.5; this.x = (this.x < NET.x) ? NET.x - 15 : NET.x + 15;
            }
        }
        this.dy += 0.25;
        if(this.y >= G_Y - this.r) { 
            if(Math.abs(this.dy) > 2) this.dy *= -0.6; 
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); }
        }
    }
};

const p1 = new Athlete('right', '#fff'), cpu = new Athlete('left', '#ff3b3b');

function loop() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#333"; ctx.fillRect(NET.x-3, NET.y, 6, 80);

    // PERFECT AI LOGIC
    if (ball.x < NET.x + 40) {
        let isStuck = (ball.x > NET.x - 80 && Math.abs(ball.dx) < 2);
        
        // 1. RECOVERY MODE (The "Net Fix")
        if (isStuck || cpu.combo > 0) {
            cpu.cpuDX = (ball.x - cpu.x) * 0.8;
            if (cpu.combo === 0) cpu.combo = 1;
            if (cpu.combo === 1) { 
                cpu.cpuSkill = 'lift'; 
                if (ball.lock > 0) cpu.combo = 2; 
            } else { 
                if (!cpu.air) { cpu.dy = -18; cpu.air = true; }
                cpu.cpuSkill = 'spike';
                if (ball.dx > 5) cpu.combo = 0;
            }
        } else {
            // 2. NORMAL PLAY (Dice Logic)
            cpu.cpuDX = (ball.x - cpu.x) * 0.5;
            let dice = Math.floor(Date.now() / 2000) % 5;
            const moves = ['lob', 'lift', 'spike', 'lob', 'lift'];
            cpu.cpuSkill = moves[dice];
            if (moves[dice] === 'spike' && !cpu.air && ball.y < G_Y - 50) { cpu.dy = -17; cpu.air = true; }
        }
    } else {
        cpu.cpuDX = (W*0.15 - cpu.x) * 0.1; cpu.combo = 0; cpu.cpuSkill = null;
    }

    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let act = (p === p1) ? (inputs.buffer > 0 ? inputs.type : null) : p.cpuSkill;
        // High Speed Detection (Bigger hit box for strikes)
        let hitRange = (Math.abs(ball.dx) > 15) ? 70 : 50;
        if(Math.abs(ball.x - p.x) < hitRange && Math.abs(ball.y - p.y) < 80 && ball.lock === 0 && act) {
            ball.lock = 20; let dir = (p.side === 'right') ? -1 : 1;
            if(act === 'spike') { ball.dx = dir * 24; ball.dy = 7; }
            else if(act === 'lift') { ball.dx = dir * 0.5; ball.dy = -17; }
            else { ball.dx = dir * 9; ball.dy = -20; }
            if(p === p1) inputs.buffer = 0;
        }
    });

    ball.update();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2); ctx.fill();
    document.getElementById('s-u').innerText = state.u;
    document.getElementById('s-c').innerText = state.c;
    requestAnimationFrame(loop);
}

resize(); ball.spawn(); loop();
window.addEventListener('resize', resize);
</script>
</body>
</html>
