<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elite Volley: Pro Physics</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.2); --bg: #0a0a0a; }
        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; position: fixed; font-family: -apple-system, system-ui, sans-serif; }
        #game-container { position: absolute; inset: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); }
        canvas { width: 100%; height: 100%; display: block; }
        
        #hud { position: absolute; top: 25px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 20px; pointer-events: none; z-index: 10; opacity: 0; }
        .score-box { background: var(--glass); border: 1px solid var(--border); border-radius: 8px; width: 50px; height: 40px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 600; backdrop-filter: blur(5px); }
        #timer { color: #fff; font-size: 24px; font-weight: 800; width: 90px; text-align: center; }
        
        #joy-zone { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 45px; z-index: 20; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; opacity: 0; }
        #knob { position: absolute; width: 34px; height: 34px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #act-zone { position: absolute; bottom: 30px; right: 30px; width: 200px; height: 100px; z-index: 20; opacity: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 45px 45px; gap: 8px; }
        .btn { background: var(--glass); border: 1px solid var(--border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; border-radius: 8px; text-transform: uppercase; backdrop-filter: blur(5px); }
        .btn.active { background: #fff; color: #000; transform: scale(0.95); }
        #jump { grid-column: span 3; font-size: 13px; letter-spacing: 2px; }

        #overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #start-btn { padding: 20px 40px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; letter-spacing: 4px; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="overlay"><button id="start-btn">KICKOFF</button></div>
    <div id="hud"><div class="score-box" id="s-c">0</div><div id="timer">01:00</div><div class="score-box" id="s-u">0</div></div>
    <canvas id="canvas"></canvas>
    <div id="joy-zone"></div><div id="knob"></div>
    <div id="act-zone">
        <div class="btn" id="lift">Lift</div>
        <div class="btn" id="lob">Lob</div>
        <div class="btn" id="spike">Strike</div>
        <div class="btn" id="jump">JUMP</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const knob = document.getElementById('knob'), joyZone = document.getElementById('joy-zone');
let W, H, G_Y, NET, state = { u: 0, c: 0, active: false, time: 60 };
const inputs = { moveX: 0, spike: false, lob: false, lift: false, buffer: 0, type: '', joyID: null };

document.getElementById('start-btn').addEventListener('click', function() {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    state.active = true;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('hud').style.opacity = 1;
    document.getElementById('joy-zone').style.opacity = 1;
    document.getElementById('act-zone').style.opacity = 1;
    resize(); ball.spawn();
    setInterval(() => { if(state.time > 0 && state.active) { state.time--; document.getElementById('timer').innerText = `00:${state.time.toString().padStart(2, '0')}`; } }, 1000);
    requestAnimationFrame(loop);
});

function resize() {
    W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
    G_Y = H - 50; NET = { x: W/2, y: G_Y - 80, w: 2, h: 80 };
    updateKnobUI(0); p1.reset(); cpu.reset();
}

function updateKnobUI(val) {
    const r = joyZone.getBoundingClientRect();
    knob.style.left = (r.left + r.width/2 + val * (r.width/2 - 17)) + "px";
    knob.style.top = (r.top + r.height/2) + "px";
}

window.addEventListener('touchstart', e => {
    const btnIds = ['lift', 'lob', 'spike', 'jump'];
    const rJ = joyZone.getBoundingClientRect();
    for (let t of e.changedTouches) {
        if (t.clientX > rJ.left && t.clientX < rJ.right && t.clientY > rJ.top && t.clientY < rJ.bottom) inputs.joyID = t.identifier;
        btnIds.forEach(id => {
            const b = document.getElementById(id).getBoundingClientRect();
            if (t.clientX > b.left && t.clientX < b.right && t.clientY > b.top && t.clientY < b.bottom) {
                inputs[id] = true;
                if (id === 'jump' && !p1.air) { p1.dy = -18; p1.air = true; }
                if (id !== 'jump') { inputs.buffer = 15; inputs.type = id; }
                document.getElementById(id).classList.add('active');
            }
        });
    }
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (!state.active) return;
    const rJ = joyZone.getBoundingClientRect();
    for (let t of e.touches) {
        if (t.identifier === inputs.joyID) {
            inputs.moveX = Math.max(-1, Math.min(1, (t.clientX - (rJ.left + rJ.width/2)) / (rJ.width/2 - 17)));
            updateKnobUI(inputs.moveX);
        }
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    for (let t of e.changedTouches) {
        if (t.identifier === inputs.joyID) { inputs.joyID = null; inputs.moveX = 0; updateKnobUI(0); }
        ['lift', 'lob', 'spike', 'jump'].forEach(k => {
            inputs[k] = false; document.getElementById(k).classList.remove('active');
        });
    }
});

class Athlete {
    constructor(side, color) { this.side = side; this.color = color; this.h = 38; this.cpuSkill = null; }
    reset() { 
        this.x = (this.side === 'right') ? W * 0.85 : W * 0.15; 
        this.y = G_Y - this.h; this.dx = this.dy = 0; this.air = false; this.anim = 0; 
    }
    update() {
        this.dx = (this === p1) ? inputs.moveX * 9.5 : this.cpuDX;
        this.x += this.dx; this.y += this.dy;
        if(this.y < G_Y - this.h) this.dy += 1.5;
        else { this.y = G_Y - this.h; this.dy = 0; this.air = false; }
        const limit = NET.x + (this.side === 'right' ? 18 : -18);
        this.x = (this.side === 'right') ? Math.max(limit, Math.min(W-20, this.x)) : Math.min(limit, Math.max(20, this.x));
        this.anim += Math.abs(this.dx) * 0.2;
    }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y); if(this.side === 'right') ctx.scale(-1, 1);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
        let walk = Math.sin(this.anim) * 5;
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(walk, 38); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-walk, 38); ctx.stroke();
        ctx.fillStyle = this.color; ctx.fillRect(-5, 6, 10, 20);
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
        let s = (this === p1) ? (inputs.buffer > 0 ? inputs.type : null) : this.cpuSkill;
        ctx.beginPath();
        if(s === 'spike') { ctx.moveTo(5, 5); ctx.lineTo(18, -10); }
        else if(s === 'lob' || s === 'lift') { ctx.moveTo(5, 8); ctx.lineTo(20, 30); }
        else { ctx.moveTo(3, 8); ctx.lineTo(3, 28); }
        ctx.stroke(); ctx.restore();
    }
}

const ball = {
    r: 8, dx: 0, dy: 0, x: 0, y: 0, lock: 0,
    spawn() { this.y = H * 0.3; this.dx = 0; this.dy = 0; this.x = (state.u > state.c) ? W*0.3 : W*0.7; this.lock = 0; },
    update() {
        if(this.lock > 0) this.lock--;
        this.dy += 0.22; this.x += this.dx; this.y += this.dy;
        if(this.y < 25) { this.y = 25; this.dy = Math.abs(this.dy) * 0.2; } 
        if(this.y >= G_Y - this.r) {
            this.y = G_Y - this.r; if(Math.abs(this.dy) > 2) this.dy *= -0.5;
            else { state[this.x > NET.x ? 'c' : 'u']++; this.spawn(); p1.reset(); cpu.reset(); }
        }
        if(this.y + this.r > NET.y && Math.abs(this.x - NET.x) < this.r + NET.w/2) {
            this.dx = -this.dx * 0.1; this.dy *= 0.3;
            this.x = (this.x < NET.x) ? NET.x - (NET.w/2 + this.r + 2) : NET.x + (NET.w/2 + this.r + 2);
        }
    },
    draw() { 
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    }
};

const p1 = new Athlete('right', '#fff'), cpu = new Athlete('left', '#444');

function loop() {
    if(!state.active) return;
    ctx.clearRect(0,0,W,H);
    if(inputs.buffer > 0) inputs.buffer--;
    ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(0, G_Y, W, 2);
    ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(NET.x - NET.w/2, NET.y, NET.w, NET.h);
    
    // AI LOGIC
    let futureX = ball.x + (ball.dx * 12);
    let ballDist = futureX - cpu.x;
    if (ball.x < NET.x) {
        cpu.cpuDX = ballDist > 8 ? 7 : ballDist < -8 ? -7 : 0;
        if (Math.abs(ball.x - cpu.x) < 40 && ball.dy > 0 && ball.y > G_Y - 160 && !cpu.air) { 
            cpu.dy = -17; cpu.air = true; 
        }
        if (Math.abs(ball.x - cpu.x) < 50) {
            cpu.cpuSkill = (ball.y < cpu.y) ? (Math.random() > 0.4 ? 'spike' : 'lob') : null;
        }
    } else {
        let homeX = W * 0.15;
        cpu.cpuDX = (cpu.x < homeX - 10) ? 5.5 : (cpu.x > homeX + 10) ? -5.5 : 0;
        cpu.cpuSkill = null;
    }
    
    [p1, cpu].forEach(p => {
        p.update(); p.draw();
        let act = (p === p1) ? (inputs.buffer > 0 ? inputs.type : null) : p.cpuSkill;
        let hb = { x1: p.x - 35, x2: p.x + 35, y1: p.y - 30, y2: p.y + 60 };
        
        if(ball.x > hb.x1 && ball.x < hb.x2 && ball.y > hb.y1 && ball.y < hb.y2 && ball.lock === 0) {
            ball.lock = 20;
            let hitDir = (ball.x < p.x) ? -1 : 1; 

            if(act === 'lift') { 
                // 90 DEGREE UPRISE - SLOW MOTION
                ball.dx = hitDir * 0.35; 
                ball.dy = -12.5; 
            } else if(act === 'lob') { 
                // GO INSIDE OPPONENT - ARCING FORWARD
                ball.dx = hitDir * 5.8; 
                ball.dy = -14.5; 
            } else if(act === 'spike') { 
                ball.dx = hitDir * 11.5; ball.dy = 5.5; 
            } else { 
                // DEFAULT HIT
                ball.dx = hitDir * 4; ball.dy = -5; 
            }
            inputs.buffer = 0;
        }
    });
    
    ball.update(); ball.draw();
    document.getElementById('s-u').innerText = state.u;
    document.getElementById('s-c').innerText = state.c;
    requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
window.onload = resize;
</script>
</body>
</html>
