<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traffic Racer | Pro Physics</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --danger: #ff3366; --road: #111113; }
        body { margin: 0; background: #000; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }

        #viewport {
            position: relative;
            width: 100vw; height: 177.78vw;
            max-width: 56.25vh; max-height: 100vh;
            background: var(--road);
            display: flex; flex-direction: column;
            border: 2px solid #333;
        }

        #game-view { flex: 1; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        #dashboard {
            height: 32%;
            background: linear-gradient(180deg, #1c1c21 0%, #050505 100%);
            border-top: 4px solid #2a2a2a;
            padding: 15px;
            box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .dash-top { display: flex; justify-content: space-between; align-items: center; }
        .hud-text { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 12px; }
        .speed-val { font-family: 'Orbitron', sans-serif; font-size: 42px; color: #fff; text-shadow: 0 0 15px var(--neon); line-height: 1; }

        #steering-wheel {
            width: 105px; height: 105px;
            position: relative; cursor: grab;
            border-radius: 50%;
            border: 12px solid #1a1a1c;
            background: radial-gradient(circle, #2a2a2e 0%, #111 80%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 10px #000;
        }
        .spoke { position: absolute; top: 50%; left: 10%; width: 80%; height: 10px; background: #1a1a1c; transform: translateY(-50%); border-radius: 5px; }
        .top-marker { position: absolute; top: -12px; left: 50%; width: 10px; height: 12px; background: var(--danger); transform: translateX(-50%); }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="game-view"><canvas id="gameCanvas"></canvas></div>
        <div id="dashboard">
            <div class="dash-top">
                <div class="hud-text">SCORE<div id="score-val" style="color: #fff; font-size: 18px;">0</div></div>
                <div style="text-align: center;">
                    <div id="kmh" class="speed-val">00</div>
                    <div style="font-size: 8px; color: #555; font-family: Orbitron;">KM/H</div>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end;">
                <div id="steering-wheel">
                    <div class="top-marker"></div>
                    <div class="spoke"></div>
                    <div class="spoke" style="transform: rotate(90deg) translateY(-50%);"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const kmhDisp = document.getElementById('kmh');
        const scoreDisp = document.getElementById('score-val');

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const LANES = 4;
        const LANE_W = canvas.width / LANES;
        const STEER_LIMIT = 90; 
        
        let gameSpeed = 4; 
        const MAX_SPEED = 30;
        const ACCEL = 0.008;

        // Player State
        let playerX = canvas.width / 2;
        let playerRotation = 0; // The tilt of the car body
        let wheelRotation = 0;  // Input from dashboard
        let lastInputAngle = 0;
        let isDragging = false;
        
        let traffic = [];
        let roadOffset = 0;
        let score = 0;

        // --- STEERING (Delta Tracking) ---
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const px = e.touches ? e.touches[0].clientX : e.clientX;
            const py = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
        }

        const start = (e) => { isDragging = true; lastInputAngle = getAngle(e); e.preventDefault(); };
        const move = (e) => {
            if (!isDragging) return;
            const current = getAngle(e);
            let delta = current - lastInputAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            wheelRotation = Math.max(-STEER_LIMIT, Math.min(STEER_LIMIT, wheelRotation + delta));
            wheel.style.transform = `rotate(${wheelRotation}deg)`;
            lastInputAngle = current;
        };

        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', () => isDragging = false);

        // --- VEHICLE CLASSES ---
        class NPC {
            constructor(lane) {
                this.lane = lane;
                this.x = (lane * LANE_W) + (LANE_W / 2);
                this.y = -250;
                this.w = 36;
                this.h = 75;
                this.vSpeed = 3 + Math.random() * 5;
                this.color = `hsl(${Math.random() * 360}, 40%, 40%)`;
                this.targetX = this.x;
                this.angle = 0;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.h/2);
                ctx.rotate(this.angle);
                // Shadow
                ctx.fillStyle = "rgba(0,0,0,0.2)";
                ctx.fillRect(-this.w/2 + 4, -this.h/2 + 4, this.w, this.h);
                // Body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                // Windows
                ctx.fillStyle = "#111";
                ctx.fillRect(-this.w/2 + 4, -this.h/2 + 12, this.w - 8, 18);
                // Brake Lights
                ctx.fillStyle = "#900";
                ctx.fillRect(-this.w/2 + 2, this.h/2 - 6, 8, 4);
                ctx.fillRect(this.w/2 - 10, this.h/2 - 6, 8, 4);
                ctx.restore();
            }
            update(gSpeed) {
                this.y += (gSpeed - this.vSpeed);
                // Smoothly correct any lane changes (future AI expansion)
                this.x += (this.targetX - this.x) * 0.1;
            }
        }

        function spawn() {
            // "Golden Path" Logic: Ensure at least one lane is ALWAYS empty
            let lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
            let count = Math.floor(Math.random() * 2) + 1; // Spawns 1 or 2 cars
            
            // Check if top of road is clear
            lanes = lanes.filter(l => !traffic.some(v => v.lane === l && v.y < 200));
            
            // Limit to max 2 cars per row to keep gaps open
            let spawnSelection = lanes.slice(0, Math.min(count, 2));
            spawnSelection.forEach(l => traffic.push(new NPC(l)));
        }

        let lastSpawn = 0;
        function loop(t) {
            if (gameSpeed < MAX_SPEED) gameSpeed += ACCEL;
            roadOffset = (roadOffset + gameSpeed) % 120;
            
            // --- PLAYER PHYSICS (Real Car Logic) ---
            let lateralTarget = (wheelRotation / STEER_LIMIT) * 12;
            playerX += lateralTarget;
            playerX = Math.max(LANE_W/2 - 10, Math.min(canvas.width - LANE_W/2 + 10, playerX));

            // Body Tilt: Front moves first, body rotates based on lateral velocity
            let targetRotation = lateralTarget * 0.03; 
            playerRotation += (targetRotation - playerRotation) * 0.15;

            if (!isDragging) {
                wheelRotation *= 0.9;
                wheel.style.transform = `rotate(${wheelRotation}deg)`;
            }

            kmhDisp.innerText = Math.round(gameSpeed * 10).toString().padStart(2, '0');
            score += Math.floor(gameSpeed / 8);
            scoreDisp.innerText = score;

            // Frequency of cars
            if (t - lastSpawn > (1500 - gameSpeed * 30)) {
                spawn();
                lastSpawn = t;
            }

            traffic.forEach(v => {
                v.update(gameSpeed);
                // Tight Collision Detection
                if (Math.abs(v.x - playerX) < 30 && v.y + v.h > canvas.height - 110 && v.y < canvas.height - 35) {
                    location.reload(); 
                }
            });
            traffic = traffic.filter(v => v.y < canvas.height + 400);

            // --- RENDER ---
            ctx.fillStyle = "#151517";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lanes
            ctx.strokeStyle = "#2a2a2d";
            ctx.setLineDash([60, 60]);
            ctx.lineDashOffset = -roadOffset;
            for(let i=1; i<LANES; i++) {
                ctx.beginPath(); ctx.moveTo(i * LANE_W, 0); ctx.lineTo(i * LANE_W, canvas.height); ctx.stroke();
            }

            traffic.forEach(v => v.draw());

            // DRAW PLAYER CAR
            ctx.save();
            ctx.translate(playerX, canvas.height - 75);
            ctx.rotate(playerRotation);
            
            // Body Shadow
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fillRect(-18 + 5, -35 + 5, 36, 70);

            // Main Body
            ctx.fillStyle = var(--neon);
            ctx.shadowBlur = 15; ctx.shadowColor = var(--neon);
            ctx.fillRect(-18, -35, 36, 70);
            
            // Windshield & Roof
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#000";
            ctx.fillRect(-14, -28, 28, 20); // Front window
            ctx.fillStyle = "#111";
            ctx.fillRect(-14, 5, 28, 25); // Back roof

            // Headlights
            ctx.fillStyle = "#fff";
            ctx.fillRect(-16, -35, 8, 3);
            ctx.fillRect(8, -35, 8, 3);

            ctx.restore();

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
